/* Layout: une colonne, trois onglets (Jouer, Mon score, Équipe). Les thèmes sont des lignes notées, groupées par chapitre HAS, avec la cible à 100 %. Le quiz prend tout l’écran. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #0E2233;
  --ink-2: #4A5D6C;
  --line: #D5DDE3;
  --track: #E3E9ED;
  --accent: #FBC52A;
  --on-accent: #0E2233;
  --good: #1B7F4B;
  --warn: #A85F00;
  --bad: #B3261E;
  --good-bg: #E3F3EA;
  --bad-bg: #FBE6E4;
  --f-display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1824; --surface: #112437; --ink: #EAF1F6; --ink-2: #9FB2C2; --line: #223A50; --track: #1B3247;
    --accent: #FBC52A; --on-accent: #0E2233; --good: #4CC38A; --warn: #F0A93B; --bad: #FF7A70;
    --good-bg: #12372A; --bad-bg: #3F1D1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1824; --surface: #112437; --ink: #EAF1F6; --ink-2: #9FB2C2; --line: #223A50; --track: #1B3247;
  --accent: #FBC52A; --on-accent: #0E2233; --good: #4CC38A; --warn: #F0A93B; --bad: #FF7A70;
  --good-bg: #12372A; --bad-bg: #3F1D1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: inherit; font-size: 13px; }
.app { padding-block: 20px 110px; }
.eyebrow { font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; margin: 0; text-wrap: balance; line-height: 1; }
h1 { font-size: clamp(54px, 15vw, 88px); text-transform: uppercase; letter-spacing: -.01em; }
h2 { font-size: 28px; text-transform: uppercase; }
h3 { font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { margin-top: 8px; }
.lede { margin: 12px 0 0; color: var(--ink-2); max-width: 46ch; }
.chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px 6px 6px; border-radius: 999px; font-size: 14px; }
.chip i { font-style: normal; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 800; font-size: 14px; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 20px 28px; align-items: center; margin-top: 24px; padding-block: 20px; border-block: 1px solid var(--line); }
.big { font-family: var(--f-display); font-stretch: 70%; font-weight: 900; font-size: 84px; line-height: .85; font-variant-numeric: tabular-nums; }
.big small { font-size: 34px; margin-left: 2px; }
.cap { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.chmini { display: grid; gap: 10px; min-width: 0; }
.chmini div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.chmini b { font-variant-numeric: tabular-nums; }
.chmini .bar { grid-column: 1 / -1; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.bar.good > span { background: var(--good); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.defi { margin-top: 24px; background: var(--accent); color: var(--on-accent); padding: 18px; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.defi h2 { font-size: 32px; }
.defi p { margin: 6px 0 0; font-size: 15px; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 12px 22px; font-weight: 700; font-size: 16px; min-height: 48px; }
.defi .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); }
.sect { margin-top: 32px; }
.sect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.sect-head span { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; max-width: 62ch; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px 14px 0; align-items: start; }
.row:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.row .name { font-weight: 700; font-size: 17px; line-height: 1.25; min-width: 0; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 6px; }
.refs { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.refs b { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 2px; font-weight: 500; }
.pill { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--ink-2); color: var(--ink-2); white-space: nowrap; }
.pill.imp { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pct { text-align: right; min-width: 74px; }
.pct b { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; display: block; }
.pct b small { font-size: 15px; }
.pct em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.pct em.good { color: var(--good); } .pct em.warn { color: var(--warn); } .pct em.bad { color: var(--bad); }
.row .bar { grid-column: 1 / -1; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 3px; font-size: 13px; color: var(--ink-2); font-weight: 700; border-top: 3px solid transparent; margin-top: -1px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.panel { margin-top: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.stat { border-left: 3px solid var(--accent); padding-left: 10px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-2); }
.field { margin-top: 20px; display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input { border: 1px solid var(--ink-2); background: var(--surface); border-radius: 8px; padding: 12px; min-height: 48px; max-width: 320px; }
.code { font-family: var(--f-mono); font-weight: 500; background: var(--track); padding: 1px 6px; border-radius: 4px; }
.chart { width: 100%; height: auto; display: block; margin-top: 12px; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-2); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .target { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .area { fill: var(--accent); opacity: .3; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
.chart .end { fill: var(--ink); stroke: var(--accent); stroke-width: 3; }
.chart .endlbl { fill: var(--ink); font-size: 12px; font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--ink); }
.tbl td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
.scroll { overflow-x: auto; }
.duel { display: grid; gap: 10px; margin-top: 12px; }
.duel div { display: grid; grid-template-columns: 90px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
.duel .bar { height: 14px; border-radius: 3px; }
.duel .bar span { background: var(--accent); border-radius: 0; }
.duel b { text-align: right; font-variant-numeric: tabular-nums; }
.room { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 12px; }
.room .code { font-size: 28px; letter-spacing: .12em; padding: 4px 12px; }
.quiz { padding-block: 16px 40px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.qtop .linkbtn { font-size: 15px; color: var(--ink); min-height: 44px; }
.qtop .eyebrow { text-align: right; }
.segs { display: flex; gap: 6px; margin-top: 8px; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); }
.segs i.done { background: var(--ink); }
.segs i.now { background: var(--accent); }
.qtheme { margin-top: 24px; }
.qtext { font-size: 22px; line-height: 1.3; font-weight: 700; margin: 8px 0 0; max-width: 40ch; text-wrap: pretty; }
.opts { display: grid; gap: 10px; margin-top: 20px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 56px; font-size: 16px; }
.opt .l { font-family: var(--f-mono); font-weight: 500; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--ink-2); border-radius: 4px; font-size: 13px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .tag { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.opt.right .tag { color: var(--good); } .opt.wrong .tag { color: var(--bad); }
.fb { margin-top: 20px; border-top: 2px solid var(--ink); padding-top: 14px; }
.fb h3 { font-size: 24px; }
.fb h3.good { color: var(--good); } .fb h3.bad { color: var(--bad); }
.fb p { margin: 8px 0 0; max-width: 60ch; }
.src { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.res { margin-top: 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.keep { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.keep li { border-left: 3px solid var(--accent); padding-left: 12px; max-width: 60ch; }
.delta { font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }
@media (max-width: 420px) {
  .score { grid-template-columns: 1fr; }
  .duel div { grid-template-columns: 70px 1fr 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > span { transition: width .5s ease; }
}
/* Palette plus vive : fond crème, indigo, un accent par chapitre (corail, turquoise, violet). */
:root { --bg:#FFF7EA; --surface:#FFFFFF; --ink:#1E1B4B; --ink-2:#5E5A85; --line:#EBDDC6; --track:#F1E6D3; --accent:#FFC233; --on-accent:#1E1B4B; --good:#0B8A5F; --warn:#C45F00; --bad:#D1163F; --good-bg:#DDF7EA; --bad-bg:#FFE3E8; --c1:#FF5A6E; --c2:#0B8F88; --c3:#7C5CFA; }

.sect-head { border-bottom-color: var(--c, var(--ink)); }

    hygiene: {

      questions: [
        { id: "HYG-001", theme: "hygiene", q: "La friction hydro-alcoolique est la méthode à privilégier. Dans quelle situation lave-t-on les mains à l’eau et au savon ?",
          opts: ["Avant un geste aseptique, quel que soit le patient pris en charge", "Patient porteur de Clostridioides difficile ou de la gale, ou peau visiblement lésée ou souillée", "Après un contact avec l’environnement du patient, dans toutes les situations de soin", "Après le retrait des gants, systématiquement et quel que soit le soin"], ok: 1,
          why: "La friction est à privilégier partout, sauf pour Clostridium difficile et la gale, ou si la peau est visiblement lésée ou souillée. Le référentiel attend de l’équipe qu’elle connaisse ces rares indications du lavage à l’eau et au savon.", src: "Mémo CertiF p. 4 · critère 2.2-08" },
        { id: "HYG-002", theme: "hygiene", q: "Vrai ou faux : la friction est aussi efficace quand je porte une alliance ou une montre.",

          why: "Les bijoux diminuent l’efficacité de la friction. Prérequis : aucun bijou aux mains ni aux poignets, pas de montre, manches courtes, ongles courts et sans vernis. Les experts-visiteurs l’observent dans le service.", src: "Mémo CertiF p. 4 · critère 2.2-08 (observation)" },
        { id: "HYG-003", theme: "hygiene", q: "Que mesure l’ICSHA ?",

        { id: "HYG-004", theme: "hygiene", q: "Quelles précautions s’appliquent pour tout soin, tout patient et en tout lieu, quel que soit son statut infectieux ?",

          why: "Les précautions standard sont le socle. Les précautions complémentaires s’y ajoutent selon le micro-organisme, sur prescription ou protocole, et l’information donnée au patient est tracée dans le dossier.", src: "Mémo CertiF p. 4 · critères 2.2-08 et 2.2-09" }
      ]
    },
    hygiene2: {
      th: "hygiene", title: "Excreta, AES et EPI",
      questions: [
        { id: "HYG-005", theme: "hygiene", q: "Sans sac de recueil à usage unique, que fait-on d’un bassin plein ?",
          opts: ["On le rince au lavabo avant le lave-bassin", "On le dépose plein dans le lave-bassin, sans rinçage ni vidange", "On le vide dans les toilettes puis on le lave à la main avant le lave-bassin", "On le laisse dans la chambre jusqu’à la fin du tour"], ok: 1,
          why: "Ni manipulation ni rinçage : risque d’aérosolisation et de contamination de l’environnement. Il est transporté avec un couvercle.", src: "Fiche HAS IAS p. 2 · critère 2.2-08" },
        { id: "HYG-006", theme: "hygiene", q: "Que porte-t-on pour gérer des excreta ?",
          opts: ["Des gants de soins et une protection de la tenue, avec hygiène des mains par friction hydroalcoolique au retrait des gants", "Rien si les mains sont propres, la manipulation des excreta ne présentant aucun risque", "Un masque seul", "Des gants, puis friction seulement avant le geste suivant"], ok: 0,
          why: "Les selles sont le principal réservoir de bactéries résistantes d’origine digestive : gants, protection de la tenue, puis hygiène des mains au retrait des gants.", src: "Fiche HAS IAS p. 2 · critère 2.2-08" },
        { id: "HYG-007", theme: "hygiene", q: "Après usage d’un objet perforant à usage unique, que faut-il faire ?",
          opts: ["Recapuchonner l’aiguille avant de la jeter dans le conteneur pour protéger le personnel", "Le jeter immédiatement dans un conteneur adapté, sans dépose intermédiaire", "Désadapter l’aiguille à la main avant de la jeter dans le conteneur", "Le poser sur le plateau et le jeter en fin de soin, avec le reste des déchets"], ok: 1,
          why: "Ne pas recapuchonner, plier, casser ni désadapter à la main. Même règle avec du matériel sécurisé. Le conteneur est placé au plus près du soin.", src: "Fiche HAS IAS p. 4 · critère 2.2-08" },
        { id: "HYG-008", theme: "hygiene", q: "Où doit se trouver la conduite à tenir en cas d’accident d’exposition au sang ?",

          why: "Les experts-visiteurs demandent aux professionnels où la trouver et ce qu’il faut faire en cas de piqûre, coupure ou projection. Elle est accessible dans les lieux de soins.", src: "Fiche HAS IAS p. 4 et 8 · critère 2.2-08" }
      ]
    },
    hygiene3: {
      th: "hygiene", title: "Précautions complémentaires et dispositifs invasifs",
      questions: [
        { id: "HYG-009", theme: "hygiene", q: "Pour quel patient met-on en place des précautions Contact simples ?",
          opts: ["Un patient grippé", "Un patient tuberculeux", "Un patient porteur d’une BMR ou d’un norovirus", "Un patient atteint de gale ou de C. difficile"], ok: 2,
          why: "Précautions Contact simples : BMR/BHRe, adénovirus, entérovirus, norovirus, diphtérie, hépatite A, varicelle, zona, syndrome pieds-mains-bouche. La gale et C. difficile relèvent des précautions Contact renforcées ; grippe et tuberculose, des précautions respiratoires.", src: "Fiche HAS IAS p. 5 · critère 2.2-09" },
        { id: "HYG-010", theme: "hygiene", q: "Que doit-on tracer dans le dossier d’un patient en précautions complémentaires ?",
          opts: ["L’information donnée au patient et la prescription des précautions complémentaires d’hygiène, avec leur type (contact, respiratoire, gale, clostridium)", "Rien, tout se dit à l’oral entre les membres de l’équipe", "Uniquement la durée de l’isolement et sa date de levée", "Uniquement le nom du micro-organisme identifié chez le patient"], ok: 0,
          why: "Les précautions font l’objet d’une prescription médicale ou d’un protocole validé, et l’information du patient est tracée.", src: "Fiche HAS IAS p. 5 · critère 2.2-09" },
        { id: "HYG-011", theme: "hygiene", q: "Quand lève-t-on des précautions complémentaires ?",
          opts: ["À la sortie du patient", "Dès qu’elles ne sont plus justifiées", "Toujours après 7 jours", "Seulement si le patient le demande"], ok: 1,
          why: "Les mesures sont réévaluées et levées dès qu’elles ne sont plus justifiées. La levée intervient après réévaluation.", src: "Fiche HAS IAS p. 5 · critère 2.2-09" },
        { id: "HYG-012", theme: "hygiene", q: "Un patient est porteur d’un dispositif invasif. Que doit-on retrouver dans son dossier ?",
          opts: ["Le nom du fabricant du dispositif et son numéro de référence", "La date de pose, la surveillance, la réévaluation de la pertinence du maintien et la date de retrait", "Rien si le dispositif est récent : sa surveillance ne s’impose qu’après quelque temps", "Seulement la date de retrait, consignée une fois le dispositif ôté"], ok: 1,
          why: "Cathéters, sondes urinaires et assistance ventilatoire : le maintien est réévalué régulièrement pour limiter un risque infectieux évitable.", src: "Fiche HAS IAS p. 6 · critère 2.2-10" },
        { id: "HYG-013", theme: "hygiene", q: "Quel est le sur-risque d’infection urinaire chez un patient sondé ?",
          opts: ["Environ 2 fois plus", "Environ 5 fois plus", "Environ 10 fois plus qu’un patient non sondé", "Aucun sur-risque, le sondage ne changeant pas la fréquence des infections"], ok: 1,
          why: "Les infections urinaires sont les principales infections associées aux soins en France ; les patients sondés ont 5 fois plus de risque que les non sondés.", src: "Fiche HAS IAS p. 6 · critère 2.2-10" }
      ]
    },
    hygiene4: {
      th: "hygiene", title: "Les repères IAS",
      questions: [
        { id: "HYG-014", theme: "hygiene", q: "Laquelle de ces situations n’est PAS une des 5 indications de l’hygiène des mains selon l’OMS ?",
          opts: ["Après un risque d’exposition à un liquide biologique, par exemple une projection", "Avant un geste aseptique", "Après un contact avec l’environnement du patient", "Avant de saisir une prescription sur l’ordinateur"], ok: 3,
          why: "Les 5 indications : avant et après contact avec le patient, avant un geste aseptique, après un risque d’exposition à un liquide biologique, après un contact avec l’environnement du patient.", src: "Fiche HAS IAS pp. 2-3 · critère 2.2-08" },
        { id: "HYG-015", theme: "hygiene", q: "Où les solutions hydroalcooliques doivent-elles être disponibles ?",
          opts: ["Uniquement dans la salle de soins, hors de portée des patients et des visiteurs", "Dans les salles de soins, sur les chariots, à la sortie des chambres", "Uniquement à l’entrée du service, pour les visiteurs et les professionnels", "Seulement sur demande à la pharmacie, afin de limiter leur usage"], ok: 1,
          why: "Les SHA sont accessibles au plus près du soin. Il faut aussi informer les patients de la nécessité de les utiliser. Elles sont placées sur les chariots de soins.", src: "Fiche HAS IAS p. 3 · critère 2.2-08" },
        { id: "HYG-016", theme: "hygiene", q: "Qu’est-ce qu’une infection associée aux soins (IAS) ?",
          opts: ["Une infection déjà présente à l’arrivée du patient, ou en incubation au début de la prise en charge", "Une infection survenant au cours d’une prise en charge, ni présente ni en incubation à l’entrée du patient", "Une infection transmise uniquement par les soignants au cours d’une prise en charge", "Une infection contractée uniquement après 48 heures d’hospitalisation, et jamais avant"], ok: 1,
          why: "Elle survient au cours ou au décours d’une prise en charge diagnostique, thérapeutique, palliative, préventive ou éducative. On parle de nosocomiale si elle est contractée en établissement de santé. Elle survient aussi au décours de la prise en charge.", src: "Fiche HAS IAS p. 2 · critère 2.2-08" }
      ]
    },
    medic1: {
      th: "medic", title: "Prescription et conciliation",
      questions: [
        { id: "MED-001", theme: "medic", q: "À l’entrée d’un patient, que doit faire le médecin de son traitement habituel ?",
          opts: ["Le recopier tel quel", "L’analyser systématiquement : le poursuivre, le modifier ou l’arrêter", "L’ignorer et prescrire un traitement neuf quel que soit celui que le patient prend", "Laisser l’infirmier décider"], ok: 1,
          why: "Le traitement habituel est intégré à la prescription après analyse systématique par le médecin : poursuivre, modifier ou arrêter.", src: "Fiche HAS médicament p. 3 · critère 2.2-02" },
        { id: "MED-002", theme: "medic", q: "Une prescription conditionnelle (traitement à donner seulement dans certaines situations : douleur, nausées…) doit comporter :",
          opts: ["Rien de plus que le médicament et la dose : c’est l’infirmier qui juge du moment et de la durée du traitement", "Une condition explicite, un maximum par 24 h, l’intervalle entre prises et la durée maximale", "Seulement le nom du médicament", "L’accord oral de la famille"], ok: 1,
          why: "La condition est explicite (valeur seuil ou signe clinique) et la prescription précise le maximum par 24 h, l’intervalle entre 2 prises et la durée maximale du traitement.", src: "Fiche HAS médicament p. 3 · critère 2.2-02" },
        { id: "MED-003", theme: "medic", q: "Dans quel cas accepte-t-on une prescription orale ?",
          opts: ["Dès que le médecin est pressé", "Exceptionnellement, en urgence", "La nuit, par habitude", "Jamais, même en urgence"], ok: 1,
          why: "La prescription orale reste exceptionnelle. Elle est écrite et contresignée par le médecin le plus tôt possible. Elle est acceptée dans l’attente de l’arrivée imminente du prescripteur.", src: "Fiche HAS médicament p. 3 · critère 2.2-02" },
        { id: "MED-004", theme: "medic", q: "Combien de sources d’information faut-il consulter au minimum pour une conciliation des traitements médicamenteux ?",
          opts: ["Une seule, par exemple le dossier patient", "Deux, sans l’entretien avec le patient", "Trois sources différentes", "Cinq"], ok: 2,
          why: "Au moins trois sources différentes (entretien patient, prescriptions, dossier patient, officine), avec rencontre du patient ou de son entourage et échange médico-pharmaceutique. Dont l’entretien avec le patient ou son entourage.", src: "Fiche HAS médicament p. 5 · critère 2.1-04" },
        { id: "MED-005", theme: "medic", q: "Pour quels patients la conciliation est-elle prioritaire ?",
          opts: ["Les patients polymédicamentés et les patients âgés", "Uniquement les patients en chirurgie", "Les patients sans traitement habituel à leur entrée dans le service", "Aucun en particulier"], ok: 0,
          why: "Elle cible les profils les plus à risque : patients polymédicamentés, patients âgés, patients sous chimiothérapie ou dialysés. Le public d’une UGA est donc concerné au premier chef.", src: "Fiche HAS médicament p. 5 · critère 2.1-04" },
        { id: "MED-006", theme: "medic", q: "Vrai ou faux : le bilan médicamenteux est une ordonnance.",
          opts: ["Vrai", "Faux"], ok: 1,
          why: "Le bilan médicamenteux n’est ni une prescription ni une ordonnance. C’est la liste exhaustive des médicaments pris ou à prendre, y compris l’automédication. Il doit être dans le dossier et intégré à la lettre de liaison.", src: "Fiche HAS médicament p. 5 · critère 2.1-04" }
      ]
    },
    medic2: {
      th: "medic", title: "Préparer et administrer",
      questions: [
        { id: "MED-008", theme: "medic", q: "Où et quand prépare-t-on un médicament à administrer ?",
          opts: ["Dans le couloir, plusieurs heures avant le tour", "Dans une zone de préparation identifiée et indépendante, au plus près de l’administration", "Au poste de soins, pour tous les patients d’un coup, en début de poste, avant les premiers soins", "Dans la chambre du patient précédent"], ok: 1,
          why: "Zone de préparation identifiée, adaptée, indépendante, respectant l’hygiène, et délai de préparation proche de l’administration.", src: "Fiche HAS médicament p. 8 · critère 2.2-05" },
        { id: "MED-009", theme: "medic", q: "Pendant la préparation des médicaments, quel est le principal facteur de risque à limiter ?",
          opts: ["Le bruit des chariots", "Les interruptions de tâches", "La température de la salle", "La couleur des étiquettes"], ok: 1,
          why: "Les professionnels préparent en évitant les interruptions de tâches. Les situations à risque (injectables, pousse-seringue, PCA, multiplicité des préparations) sont identifiées.", src: "Fiche HAS médicament p. 8 · critère 2.2-05" },
        { id: "MED-010", theme: "medic", q: "Quand trace-t-on l’administration d’un médicament ?",
          opts: ["En fin de poste, de mémoire", "Au moment de la prise", "Le lendemain matin", "Uniquement en cas de problème"], ok: 1,
          why: "L’administration, ou le motif de non-administration, est tracée dans le dossier au moment de la prise par les professionnels habilités.", src: "Fiche HAS médicament p. 8 · critère 2.2-05" },
        { id: "MED-011", theme: "medic", q: "Un stylo injecteur d’insuline peut-il servir à plusieurs patients ?",
          opts: ["Oui, à condition de changer l’aiguille neuve entre chaque patient", "Non, un stylo pour un seul patient"], ok: 1,
          why: "Un stylo, un patient. Le stylo ouvert porte l’étiquette patient et la date d’ouverture.", src: "Mémo CertiF p. 26 · critère 2.2-05" },
        { id: "MED-012", theme: "medic", q: "Qui est informé du traitement prescrit ?",
          opts: ["Personne, le patient n’a pas besoin de savoir", "Le patient, tout au long de sa prise en charge", "Seulement la famille", "Seulement le médecin traitant à la sortie"], ok: 1,
          why: "Le patient est informé de ses traitements et, en prévision de sa sortie, de la nécessité de signaler tout effet indésirable. L’information couvre toute la prise en charge, y compris la nécessité de signaler tout effet indésirable.", src: "Fiche HAS médicament pp. 3 et 8 · critères 1.2-02, 2.2-02" }
      ]
    },
    medic3: {
      th: "medic", title: "Stockage et erreurs médicamenteuses",
      questions: [
        { id: "MED-013", theme: "medic", q: "Comment les médicaments sont-ils stockés dans l’unité de soins ?",
          opts: ["Sur le chariot, porte ouverte", "Dans une armoire fermée à clé ou par un code", "Dans les tiroirs de la table de chevet", "Dans le bureau du cadre"], ok: 1,
          why: "Le stockage est sécurisé : armoire fermée à clé ou par un code, ou au minimum zone fermée non accessible au patient (salle de soins, local pharmacie…). Au minimum, une zone non accessible au patient et au public.", src: "Fiche HAS médicament p. 8 · critère 2.2-04" },
        { id: "MED-014", theme: "medic", q: "Que peut-on ranger dans le réfrigérateur réservé aux médicaments ?",
          opts: ["Les médicaments et les boissons du service, rangées sur une étagère", "Exclusivement des produits pharmaceutiques", "Les médicaments et les repas des soignants, s’il reste de la place", "Les médicaments et les échantillons de laboratoire"], ok: 1,
          why: "Les équipements de stockage à froid sont exclusivement affectés aux produits pharmaceutiques, avec contrôle de température et système de secours en cas de panne. Ni boissons, ni aliments.", src: "Fiche HAS médicament pp. 7-8 · critère 2.2-04" },
        { id: "MED-015", theme: "medic", q: "Que fait-on des médicaments périmés ?",
          opts: ["On les jette dans la poubelle du service", "Ils sont retirés et remis à la PUI pour destruction", "On les garde en réserve", "On les donne au patient à la sortie"], ok: 1,
          why: "Le retrait des périmés est effectif et ils sont remis à la PUI pour destruction. La PUI est la pharmacie à usage intérieur.", src: "Fiche HAS médicament p. 8 · critère 2.2-04" },
        { id: "MED-016", theme: "medic", q: "Quelle règle s’applique au rangement des médicaments dans les bacs et tiroirs ?",
          opts: ["On peut déconditionner les médicaments pour gagner de la place dans les tiroirs", "Pas de déconditionnement, contenant identifié par molécule et par dosage", "On mélange les dosages d’un même médicament dans le même bac", "On range par ordre d’arrivée, sans tenir compte du dosage"], ok: 1,
          why: "Les erreurs de rangement alimentent les « erreurs de médicament ». Pas de déconditionnement, identification par molécule et par dosage, pas de mélange. Pas de mélange non plus.", src: "Fiche HAS médicament p. 8 · critère 2.2-04" },
        { id: "MED-017", theme: "medic", q: "À quelle étape du circuit surviennent le plus souvent les erreurs médicamenteuses déclarées ?",
          opts: ["À la prescription", "À la dispensation", "À l’administration", "Au stockage"], ok: 2,
          why: "65 % surviennent lors de l’administration, 28 % lors de la prescription et 7 % lors de la dispensation. C’est l’étape qui cumule les risques des étapes précédentes.", src: "Fiche HAS médicament p. 10 · critère 2.2-06" },
        { id: "MED-018", theme: "medic", q: "Quels sont les 3 types d’erreurs déclarées les plus fréquents ?",
          opts: ["Erreurs de dose, de médicament, de patient", "Erreurs d’horaire, de couleur, de poids", "Erreurs de pharmacie, de livraison, de facturation", "Erreurs de langue, de lecture, d’écriture"], ok: 0,
          why: "Erreurs de dose (41 %, souvent un surdosage), de médicament (31 %) et de patient (14 %, identitovigilance). Elles représentent 86 % des erreurs déclarées.", src: "Fiche HAS médicament p. 10 · critère 2.2-06" },
        { id: "MED-019", theme: "medic", q: "Que doit connaître chaque professionnel de son service sur les médicaments à risque ?",
          opts: ["Rien de particulier : la gestion de ces médicaments relève de la seule pharmacie", "La liste des médicaments à risque de l’unité et les moyens de maîtrise", "Uniquement les noms des chimiothérapies utilisées dans l’établissement", "Seulement les dosages de chaque médicament, sans la liste de l’unité"], ok: 1,
          why: "La liste des médicaments à risque est adaptée à chaque domaine d’activité et connue des professionnels, qui doivent aussi être formés à la prévention du risque médicamenteux. La liste est établie collégialement et les moyens de maîtrise sont associés à chaque médicament.", src: "Fiche HAS médicament p. 10 · critère 2.2-06" }
      ]
    },
    medic4: {
      th: "medic", title: "Pratiques du service (pack cadre)",
      questions: [
        { id: "MED-020", theme: "medic", q: "Parmi ces propositions, lesquelles décrivent la gestion des traitements personnels d’un patient hospitalisé ?", opts: ["Ils sont retirés au patient dès son entrée et le retrait est tracé dans le DPI*","Seule la prescription faite dans le service est appliquée, même si le patient prend ce traitement habituellement","Ils sont rangés dans un casier dédié de l’armoire à pharmacie, avec l’étiquette du patient","Ils sont rendus au patient à la sortie, uniquement s’ils sont toujours prescrits","Le patient les garde dans sa table de nuit et les prend lui-même","Ils sont utilisés pour d’autres patients du service en cas de rupture de stock","Ils sont rendus à la sortie, qu’ils soient encore prescrits ou non"], ok: 0, oks: [0,1,2,3], multi: 1, why: "À l’entrée, les traitements personnels sont retirés au patient et le retrait est tracé dans le DPI*. Ils sont rangés dans un casier dédié avec l’étiquette du patient, et rendus à la sortie seulement s’ils sont toujours prescrits. À l’hôpital, seule la prescription faite dans le service est appliquée, même si le patient prend ce traitement habituellement à la demande de son médecin traitant.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-04", note: "DPI* : dossier patient informatisé" },
        { id: "MED-021", theme: "medic", q: "Un traitement nominatif est délivré pour un patient précis. Où est-il rangé et que devient-il à la sortie du patient ?", opts: ["Casier dédié avec étiquette patient, puis retour à la PUI* à la sortie","Armoire commune avec la dotation, puis réutilisé pour un autre patient","Dans la chambre du patient, puis remis au patient à sa sortie","Casier dédié avec étiquette patient, puis détruit dans le service à la sortie"], ok: 0, why: "Un traitement nominatif est rangé dans un casier dédié de l’armoire à pharmacie, avec l’étiquette du patient, puis retourné à la PUI* à la sortie du patient.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-04", note: "PUI* : pharmacie à usage intérieur" },
        { id: "MED-022", theme: "medic", q: "Lesquelles de ces propositions sont des conditions de gestion des stupéfiants ?", opts: ["Ils sont stockés dans un coffre à clé, à l’intérieur de l’armoire à pharmacie","La clé est détenue par une IDE*, et cette détention est tracée","La dotation est contrôlée deux fois par jour, par l’équipe de jour et par l’équipe de nuit","L’administration est tracée au nom du patient","Les dates de péremption sont contrôlées une fois par mois","La clé reste sur le coffre pendant le service pour gagner du temps","La dotation n’est contrôlée qu’en cas d’écart constaté","L’administration est tracée par le total de la journée, sans nom de patient"], ok: 0, oks: [0,1,2,3,4], multi: 1, why: "Les stupéfiants sont stockés dans un coffre à clé de l’armoire à pharmacie. La clé est détenue par une IDE* et cette détention est tracée. La dotation est contrôlée 2 fois par jour (équipe de jour et équipe de nuit), les dates de péremption 1 fois par mois, et chaque administration est tracée au nom du patient.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-04", note: "IDE* : infirmier diplômé d’État" },
        { id: "MED-023", theme: "medic", q: "Quelles sont les bonnes conditions de stockage des bouteilles de fluides médicaux (air, oxygène) ?", opts: ["Accrochées au mur ou placées dans un chariot dédié","Avec le robinet fermé","À la verticale","Couchées au sol pour éviter qu’elles ne tombent","Avec le robinet laissé entrouvert pour éviter un blocage","Rangées dans l’armoire à pharmacie avec les médicaments"], ok: 0, oks: [0,1,2], multi: 1, why: "Les bouteilles (obus) d’air et d’oxygène présentent un risque d’explosion. Elles sont accrochées au mur ou placées dans un chariot dédié, robinet fermé, à la verticale.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-04" },
        { id: "MED-024", theme: "medic", q: "Quelles sont les règles de gestion des piluliers ?", opts: ["Préparés pour 24 heures au maximum","Médicaments laissés dans leur blister, sans les déblistériser","Identifiés avec l’étiquette du patient","Préparés pour la semaine afin de gagner du temps","Médicaments sortis de leur blister et regroupés dans la case","Identifiés par le seul numéro de chambre"], ok: 0, oks: [0,1,2], multi: 1, why: "Un pilulier est préparé pour 24 heures au maximum, sans déblistériser les médicaments, et identifié avec l’étiquette du patient.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-05" },
        { id: "MED-025", theme: "medic", q: "Lesquels de ces médicaments ou produits sont des médicaments à risque ?", opts: ["L’insuline","Le chlorure de potassium","Les anticoagulants oraux et injectables","Les antalgiques opiacés","Les chimiothérapies injectables","Les fluides médicaux","Le paracétamol en comprimés","Les vitamines orales","Le sérum physiologique pour rinçage"], ok: 0, oks: [0,1,2,3,4,5], multi: 1, why: "Médicaments à risque cités : l’insuline, le chlorure de potassium, les anticoagulants oraux et injectables, les antalgiques opiacés, les chimiothérapies injectables et les fluides médicaux.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-06" },
        { id: "MED-026", theme: "medic", q: "Avant d’administrer un traitement, la règle des 5 B demande de vérifier cinq points. Lesquels ?", opts: ["Bon patient","Bon médicament","Bonne dose","Bonne voie d’administration","Bon moment","Bon prescripteur","Bon fabricant","Bon service"], ok: 0, oks: [0,1,2,3,4], multi: 1, why: "Les 5 B : bon patient, bon médicament, bonne dose, bonne voie d’administration, bon moment.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-05" },
        { id: "MED-027", theme: "medic", q: "J’administre à mon patient un demi-comprimé. Que fais-je de la moitié restante ?", opts: ["Je la jette","Je la remets dans le pilulier pour la prochaine prise","Je la range dans le casier du patient","Je la garde dans ma poche pour la prochaine prise"], ok: 0, why: "La moitié restante est jetée : une moitié de comprimé sortie de son blister ne se conserve pas.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-05" },
        { id: "MED-028", theme: "medic", q: "Quels médicaments peuvent être stockés dans le chariot de soins ?", opts: ["Les piluliers","Les médicaments « si besoin » nécessaires au tour d’administration (24 heures maximum)","Les stupéfiants","Les traitements nominatifs de tous les patients du service","Les médicaments à risque, comme le chlorure de potassium"], ok: 0, oks: [0,1], multi: 1, why: "Seuls les piluliers et les médicaments « si besoin » nécessaires au tour d’administration (24 heures maximum) peuvent être stockés dans le chariot de soins.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-04" },
        { id: "MED-029", theme: "medic", q: "Un médicament à risque demande une attention particulière des soignants, car il a plus de risques de causer des dommages au patient. Qu’est-ce qui peut rendre un médicament « à risque » ?", opts: ["Sa toxicité","Sa marge thérapeutique étroite","Un conditionnement similaire à un autre produit, qui peut faire confondre","Un risque d’explosion, comme pour les bouteilles d’air et d’oxygène","Son prix de vente élevé","Une date de péremption inférieure à 6 mois","Une prescription réservée aux médecins spécialistes"], ok: 0, oks: [0,1,2,3], multi: 1, why: "Un médicament à risque a plus de risques de causer des dommages au patient : toxicité, marge thérapeutique étroite, conditionnement similaire (risque de confusion), et risque d’explosion pour les fluides médicaux (bouteilles d’air et d’oxygène).", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-06" },
        { id: "MED-030", theme: "medic", q: "Une PM* conditionnelle doit être la plus précise possible. Lesquelles de ces formulations sont correctes ?", opts: ["« Si besoin »","« Si EVA* > 3 »","« Si douleur »","« Si fièvre »","« Si température > 38 °C et/ou frissons »"], ok: 1, oks: [1,4], multi: 1, why: "Une PM* conditionnelle doit contenir un critère précis et mesurable : « si EVA* > 3 » ou « si température > 38 °C et/ou frissons ». « Si besoin », « si douleur » et « si fièvre » sont trop imprécis.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-02", note: "PM* : prescription médicale · EVA* : échelle visuelle analogique (évaluation de la douleur)" },
        { id: "MED-031", theme: "medic", q: "Je n’administre pas un traitement prescrit. Quelle traçabilité dois-je effectuer ?", opts: ["Le noter dans le DPI* comme « non administré », avec un commentaire explicatif","Ne rien noter : une dose non donnée ne se trace pas","Le noter dans le DPI* comme « administré » pour ne pas décaler le tour","Le dire à l’oral à l’équipe suivante, sans l’écrire dans le DPI*"], ok: 0, why: "Il faut noter dans le DPI* « non administré », avec un commentaire explicatif.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-05", note: "DPI* : dossier patient informatisé" },
        { id: "MED-032", theme: "medic", q: "Comment doit être identifié un traitement injectable pour l’administration ?", opts: ["Avec une étiquette patient","Avec une étiquette institutionnelle dûment complétée","Avec le numéro de chambre écrit au feutre sur la seringue","Sans étiquette si l’administration est immédiate","Avec le nom du médicament seul, sans nom de patient"], ok: 0, oks: [0,1], multi: 1, why: "Un traitement injectable est identifié avec une étiquette patient et une étiquette institutionnelle dûment complétée : nom du produit, dosage, volume, solvant, voie, vitesse, date, heure de pose, préparateur.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-05" }
      ]
    },
    urg4: {
      th: "urgences", title: "Chariot d’urgence : rythme de vérification (pack cadre)",
      questions: [
        { id: "URG-036", theme: "urgences", q: "À quel rythme le chariot d’urgence doit-il être vérifié ?", opts: ["Tous les jours","Toutes les semaines","Toutes les 2 semaines","Tous les mois"], ok: 2, why: "Le chariot d’urgence est vérifié entièrement toutes les 2 semaines, soit 2 fois par mois : une fois par l’équipe de jour et une fois par l’équipe de nuit. Cette vérification complète est réalisée en binôme et tracée. Elle s’ajoute au contrôle de l’extérieur à chaque prise de service et après chaque utilisation.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · Fiche chariot d’urgence en 10 points (nov. 2024) · point 5 · critère 2.2-12" }
      ]
    },
    trans3: {
      th: "transfusion", title: "Poche de sang après transfusion (pack cadre)",
      questions: [
        { id: "TRA-040", theme: "transfusion", q: "Après une transfusion, quelle est la durée minimale pendant laquelle la poche doit être gardée dans le service ?", opts: ["30 minutes","1 heure","2 heures","4 heures"], ok: 3, why: "La poche est conservée au moins 4 heures et au maximum 24 heures, tubulure clampée, à température ambiante, dans le poste de soins, puis éliminée dans la filière DASRI*.", src: "Questions du Pôle Gériatrie (cadre) · circuit du médicament · critère 2.2-11", note: "DASRI* : déchets d’activités de soins à risque infectieux" }
      ]
    },
    atb1: {
      th: "sortie", title: "Bon usage des antibiotiques",
      questions: [
        { id: "SOR-001", theme: "sortie", q: "Entre quelles heures de traitement la pertinence d’un antibiotique doit-elle être réévaluée et tracée ?",
          opts: ["Entre la 6e et la 12e heure suivant la première prise", "Entre la 24e et la 72e heure", "Après 10 jours de traitement, à la fin de la cure", "Seulement à la sortie du patient, lors de la lettre de liaison"], ok: 1,
          why: "La réévaluation entre la 24e et la 72e heure, tracée dans le dossier, permet de prolonger, d’arrêter ou d’adapter selon les résultats bactériologiques.", src: "Fiche HAS médicament p. 4 · critère 2.4-02" },
        { id: "SOR-002", theme: "sortie", q: "À partir de quelle durée une prolongation d’antibiotique doit-elle être justifiée dans le dossier ?",
          opts: ["Dès le dépassement de 3 jours de traitement", "Au-delà de 7 jours", "Seulement au-delà de 21 jours de traitement continu", "Jamais besoin de justifier, la prescription initiale suffit"], ok: 1,
          why: "Toute prescription d’antibiotique, ou sa prolongation au-delà de 7 jours, est justifiée dans le dossier.", src: "Fiche HAS médicament p. 4 · critère 2.4-02" },
        { id: "SOR-003", theme: "sortie", q: "Que doit-on retrouver dans le dossier lors de la prescription d’un antibiotique ?",
          opts: ["Rien de particulier", "L’indication, justifiée par écrit", "Le prix du traitement", "Le nom du fabricant"], ok: 1,
          why: "L’indication est justifiée dans le dossier lors de l’initiation et de la réévaluation, avec si possible une alerte informatique pour la réévaluation.", src: "Fiche HAS médicament pp. 4 et 13 · critère 2.4-02" },
        { id: "SOR-004", theme: "sortie", q: "Quel est le rôle du référent en antibiothérapie ?",
          opts: ["Il prescrit lui-même tous les antibiotiques de l’établissement, à la place des médecins", "Il coordonne le programme de bon usage, avec la pharmacie et la microbiologie", "Il remplace le pharmacien pour la dispensation des antibiotiques", "Il ne s’occupe que des urgences, sans lien avec la pharmacie"], ok: 1,
          why: "Désigné par les représentants légaux, avec un temps dédié, il s’appuie sur des correspondants en antibiothérapie dans les services. Demandez qui est le vôtre. Il peut être sollicité par les prescripteurs.", src: "Fiche HAS médicament p. 4 · critère 2.4-02" },
        { id: "SOR-005", theme: "sortie", q: "Pourquoi réévaluer systématiquement un antibiotique ?",
          opts: ["Pour réduire le nombre de prescriptions écrites et alléger le travail administratif", "Pour limiter l’antibiorésistance, qui est une priorité", "Pour faire plaisir à la pharmacie, qui le demande à chaque service", "Parce que l’antibiotique perd son efficacité en 48 h"], ok: 1,
          why: "Les infections impliquent de plus en plus de bactéries devenues résistantes. La réévaluation limite l’exposition inutile et préserve l’efficacité des antibiotiques.", src: "Fiche HAS médicament p. 4 · critère 2.4-02" }
      ]
    },
    urg1: {
      th: "urgences", title: "Reconnaître et agir",
      questions: [
        { id: "URG-001", theme: "urgences", q: "Quel signe neurologique caractérise une détresse vitale ?",
          opts: ["Un patient somnolent mais qui répond à la voix et aux stimulations", "Un coma : pas de réponse aux stimulations douloureuses", "Un patient confus, désorienté, mais qui marche seul", "Des maux de tête isolés, sans autre signe associé"], ok: 1,
          why: "Détresse neurologique : coma. Détresse respiratoire : arrêt, respiration anormale en fréquence ou en amplitude, obstruction (impossible de parler, mains au cou). Détresse circulatoire : tension imprenable, pouls proximal non perçu.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-002", theme: "urgences", q: "Un résident s’étouffe en mangeant : que fait-on en premier ?",
          opts: ["Lui faire boire de l’eau pour faire passer ce qui l’obstrue, sans autre geste", "Agir vite : claques dans le dos, puis compressions abdominales si besoin", "Attendre qu’il tousse seul, sans intervenir tant qu’il reste conscient", "L’allonger en position latérale de sécurité et attendre que cela passe"], ok: 1,
          why: "En cas d’étouffement, il faut agir vite : claques dans le dos, voire compressions abdominales.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-003", theme: "urgences", q: "Le sang gicle ou coule de façon continue d’une plaie. Que faire ?",
          opts: ["Exercer une pression sur la plaie pour arrêter le saignement", "Rincer abondamment la plaie", "Attendre l’arrivée du médecin sans toucher", "Appliquer de la glace uniquement"], ok: 0,
          why: "Une pression sur la plaie permet d’arrêter le saignement en attendant les secours.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-004", theme: "urgences", q: "Une personne est inconsciente, mais sa poitrine se soulève régulièrement. Que fait-on ?",
          opts: ["On libère ses voies aériennes et on la met en PLS", "On commence immédiatement les compressions thoraciques et les insufflations", "On la laisse allongée sur le dos en surveillant simplement sa respiration", "On l’assoit pour faciliter sa respiration et éviter qu’elle ne s’étouffe"], ok: 0,
          why: "Une réanimation cardiopulmonaire n’est pas nécessaire tant que la respiration est normale. On libère les voies aériennes et on met en PLS.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-005", theme: "urgences", q: "Une personne est inconsciente et ne respire pas normalement. Que fait-on ?",
          opts: ["PLS et attendre le médecin sans autre geste d’urgence", "Compressions thoraciques et insufflations jusqu’à l’arrivée des secours", "Surveiller sa respiration toutes les 10 minutes en attendant qu’elle reprenne seule", "Lui faire respirer de l’oxygène seul, sans compressions ni insufflations"], ok: 1,
          why: "C’est l’arrêt cardiaque : on alerte, on effectue compressions thoraciques et insufflations, et on poursuit jusqu’à la reprise d’une respiration normale ou l’arrivée des secours.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-006", theme: "urgences", q: "Un patient se plaint d’une douleur qui serre la poitrine, avec sueurs et nausées. Pourquoi faut-il le questionner ?",
          opts: ["Pour remplir le dossier", "Pour que le SAMU puisse juger le degré d’urgence", "Pour le rassurer uniquement", "Ce n’est pas nécessaire, on attend le médecin"], ok: 1,
          why: "Un malaise cardiaque peut aussi comporter des difficultés respiratoires, des sueurs, des nausées. Les informations recueillies permettent au SAMU d’évaluer l’urgence.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { id: "URG-007", theme: "urgences", q: "Quelle différence y a-t-il entre une urgence relative et une urgence vitale ?",
          opts: ["Aucune différence : les deux situations imposent exactement la même prise en charge immédiate", "L’urgence relative n’engage pas la vie à l’instant T, mais peut se dégrader brutalement", "L’urgence relative ne concerne que les enfants, l’urgence vitale que les adultes", "L’urgence relative se règle toujours sans médecin, par les soins de l’équipe infirmière"], ok: 1,
          why: "Dans l’urgence relative, le facteur temps n’est pas prédominant. C’est le reflet d’une évaluation à un instant T : l’état peut passer en urgence vitale. Elle impose une surveillance régulière.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" }
      ]
    },
    urg2: {
      th: "urgences", title: "Alerte, chariot et formation",
      questions: [
        { id: "URG-008", theme: "urgences", q: "Que doit être le numéro d’appel pour une urgence vitale dans l’établissement ?",
          opts: ["Un numéro unique et dédié, joignable 24 h sur 24", "Le standard de l’établissement, aux heures ouvrables seulement", "Le téléphone portable du médecin de garde, noté sur un papier", "Un numéro différent selon l’infirmier présent"], ok: 0,
          why: "Un numéro et non une référence (« appeler le réanimateur de garde »). Le médecin qui répond sait tout de suite qu’il s’agit d’une urgence vitale. Chaque professionnel doit connaître ce numéro : posez-vous la question maintenant. Il est affiché dans tous les postes de soins.", src: "Fiche HAS urgences vitales p. 3 · critère 2.2-12" },
        { id: "URG-010", theme: "urgences", q: "Que doit-on faire après chaque utilisation du chariot d’urgence ?",
          opts: ["Rien, le chariot reste ouvert pour le prochain besoin", "Le vérifier, le compléter et le sceller", "Le remettre sans vérifier, faute de temps", "Le ranger à la pharmacie sans contrôle"], ok: 1,
          why: "Après utilisation, le chariot ou le sac d’urgence est vérifié, complété et scellé. Il est aussi scellé après chaque vérification périodique.", src: "Fiche HAS urgences vitales p. 4 · critère 2.2-12" },
        { id: "URG-011", theme: "urgences", q: "Qui doit pouvoir connaître la composition du chariot d’urgence de l’unité ?",
          opts: ["Seulement la pharmacie, qui la définit seule", "Les professionnels qui l’utilisent", "Seulement le cadre de santé, qui en reste seul informé", "Personne, car sa composition reste confidentielle"], ok: 1,
          why: "La composition est définie avec les professionnels habilités à l’utiliser et adaptée aux profils de patients ; les professionnels y ont accès.", src: "Fiche HAS urgences vitales p. 3 · critère 2.2-12" },
        { id: "URG-012", theme: "urgences", q: "Quelle formation est prioritairement attendue pour les gestes et soins d’urgence ?",
          opts: ["Une formation maison de 15 minutes, dispensée par le cadre du service", "L’AFGSU, avec le niveau 2 obligatoire pour les professionnels du soin", "Aucune, les médecins s’en chargent seuls en cas d’urgence dans l’unité", "Uniquement une vidéo à regarder une fois à l’embauche, sans mise en pratique"], ok: 1,
          why: "AFGSU niveau 1 recommandé pour tout le personnel, niveau 2 obligatoire pour les professionnels du soin et recyclé tous les 4 ans. Pensez à vérifier la date de votre dernière formation. Le niveau 2 est recyclé tous les 4 ans.", src: "Fiche HAS urgences vitales p. 4 · critère 2.2-12" },
        { id: "URG-013", theme: "urgences", q: "À quoi servent les exercices de mise en situation in situ ?",
          opts: ["À remplir un tableau de formation et comptabiliser le nombre d’agents présents à chaque séance", "À évaluer l’ensemble du processus, de l’appel à la prise en charge médicale", "À tester seulement le défibrillateur, sans évaluer le reste du processus", "À remplacer toute formation théorique et pratique du personnel"], ok: 1,
          why: "Ces exercices dans le service évaluent toute la chaîne : symptômes, éléments à communiquer lors de l’appel, intervention, résultats. L’évaluation part des premiers symptômes.", src: "Fiche HAS urgences vitales pp. 4-5 · critère 2.2-12" },
        { id: "URG-014", theme: "urgences", q: "Environ quelle proportion des patients survit sans séquelle après un arrêt cardiaque intrahospitalier ?",
          opts: ["80 %", "50 %", "20 %", "5 %"], ok: 2,
          why: "Environ 20 % en moyenne, d’où l’importance d’une organisation rigoureuse : chaque minute compte pour maximiser les chances de survie.", src: "Fiche HAS urgences vitales p. 1 · critère 2.2-12" }
      ]
    },
    ei1: {
      th: "ei", title: "Déclarer et comprendre",
      questions: [
        { id: "EIQ-001", theme: "ei", q: "Un soignant évite une erreur de patient juste avant d’administrer un traitement. Faut-il le déclarer ?",
          opts: ["Non, il n’y a pas eu de conséquence pour le patient, donc il n’y a rien à déclarer", "Oui : un presque accident est un événement porteur de risque à déclarer", "Seulement si le médecin le demande explicitement à l’équipe", "Seulement si le patient s’en est aperçu et en a parlé à l’équipe"], ok: 1,
          why: "Le presque accident est un événement indésirable associé aux soins sans conséquence, ou dont les conséquences ont été évitées ou limitées. Il fait partie de ce qu’on attend en déclaration interne : c’est une opportunité d’analyse.", src: "Fiche HAS EIAS pp. 1-2 · critère 1.2-07" },
        { id: "EIQ-002", theme: "ei", q: "Quelle situation correspond à un événement indésirable associé aux soins (EIAS) ?",
          opts: ["Une aggravation due à l’évolution naturelle de la maladie, sans lien avec les soins reçus", "Un événement défavorable associé aux soins, qui s’écarte des résultats escomptés", "Un retard de livraison de repas sans effet sur le patient ni sur le déroulement des soins", "Une opinion du patient sur la décoration du service, sans lien avec les soins"], ok: 1,
          why: "Un EIAS n’est pas lié à l’évolution naturelle de la maladie, est défavorable au patient, associé aux soins, a ou aurait pu avoir des conséquences et s’écarte des attentes du soin. L’événement est défavorable pour le patient.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { id: "EIQ-003", theme: "ei", q: "Quelles conséquences font d’un EIAS un événement indésirable grave (EIGS) ?",
          opts: ["Un simple retard de soin sans aucune conséquence pour la santé du patient", "Le décès, la mise en jeu du pronostic vital ou la survenue probable d’un déficit fonctionnel permanent", "Une réclamation écrite du patient auprès de la direction de l’établissement", "Une augmentation de la durée de séjour de 1 jour liée à un retard de prise en charge"], ok: 1,
          why: "Les EIGS ont des conséquences graves : décès, pronostic vital, déficit fonctionnel permanent probable. Ils sont tous à déclarer en interne ; ceux de la définition réglementaire vont aussi au portail national.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { id: "EIQ-004", theme: "ei", q: "Un EIGS répond à la définition réglementaire. Que faut-il faire ?",
          opts: ["Attendre le bilan annuel pour le présenter à la gouvernance avec les autres événements", "Le déclarer sans délai sur le portail national de signalement", "Le traiter seulement dans le service, sans déclaration sur le portail national", "Le déclarer seulement si la famille du patient en fait la demande à l’établissement"], ok: 1,
          why: "Il est déclaré sans délai par la gouvernance ou par les professionnels eux-mêmes via le portail national. Si le professionnel l’a déclaré en interne, c’est à la gouvernance de faire la déclaration sur le portail. La déclaration est systématique.", src: "Fiche HAS EIAS p. 5 · critère 1.2-07" },
        { id: "EIQ-005", theme: "ei", q: "Que révèle l’absence totale de déclaration d’EIGS dans un établissement ?",
          opts: ["Que les soins y sont parfaitement sûrs", "Un possible défaut de culture de sécurité des soins", "Qu’il n’y a aucun risque", "Rien de particulier"], ok: 1,
          why: "L’enquête ENEIS estime environ 4 EIGS par mois dans un service de 30 lits, dont plus de la moitié évitable, avec une sous-déclaration persistante. L’absence de déclaration est donc un indicateur révélateur.", src: "Fiche HAS EIAS p. 1 · critère 1.2-07" },
        { id: "EIQ-006", theme: "ei", q: "Vrai ou faux : un patient peut lui-même déclarer un événement indésirable qui le concerne.",
          opts: ["Vrai", "Faux"], ok: 0,
          why: "Il peut le déclarer à l’établissement et à l’ARS via un accès spécifique du portail national. Il doit être informé de cette possibilité et des modalités.", src: "Fiche HAS EIAS p. 5 · critère 1.2-07" },
        { id: "EIQ-007", theme: "ei", q: "Comment la HAS distingue-t-elle l’erreur de la faute professionnelle ?",
          opts: ["Il n’y a aucune différence : toute erreur est une faute qui appelle des mesures disciplinaires", "L’erreur est involontaire et analysée pour apprendre ; la faute est un manquement délibéré", "La faute est une erreur grave sans conséquence", "L’erreur est toujours sanctionnée"], ok: 1,
          why: "L’erreur est analysée dans une logique d’apprentissage collectif. La faute justifie des mesures disciplinaires. Une charte de non-punition soutient cette culture juste. L’erreur est généralement involontaire, et la faute est un manquement délibéré à une règle connue.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { id: "EIQ-008", theme: "ei", q: "Sur quoi repose la déclaration en interne d’un événement indésirable ?",
          opts: ["Une obligation légale uniquement, sans valeur éthique ni déontologique pour les professionnels", "Un devoir éthique, déontologique et professionnel, au-delà des obligations légales", "Une simple recommandation facultative laissée à l’appréciation de chaque professionnel", "Une obligation réservée aux cadres, les autres professionnels n’étant pas concernés"], ok: 1,
          why: "Les professionnels, y compris nouveaux et étudiants, sont informés qu’ils ont un devoir éthique, déontologique et professionnel de déclarer tout EIAS, et des modalités de déclaration.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" }
      ]
    },
    ei2: {
      th: "ei", title: "Informer, analyser, accompagner",
      questions: [
        { id: "EIQ-009", theme: "ei", q: "Un patient a subi un dommage lié aux soins, même non grave. Dans quel délai l’informer ?",
          opts: ["Dans un délai de 3 mois", "De préférence dans les 24 heures, sans excéder 15 jours", "Seulement s’il pose la question", "À la fin de l’hospitalisation, quelle que soit la durée"], ok: 1,
          why: "L’information du patient, de sa famille, de ses proches ou de sa personne de confiance est une obligation légale, que l’EIAS soit grave ou non : de préférence dans les 24 h, sans excéder 15 jours.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { id: "EIQ-010", theme: "ei", q: "Que doit comporter l’annonce d’un dommage associé aux soins ?",
          opts: ["Uniquement des excuses sincères et personnelles, sans détail sur la nature de l’événement ni sur ses conséquences", "La nature de l’événement, ses conséquences prévisibles, les actions correctives, les mesures de soutien", "Uniquement le nom du soignant concerné par l’événement et sa fonction", "Le détail des sanctions prévues contre les professionnels impliqués"], ok: 1,
          why: "L’annonce peut se faire en une fois ou en plusieurs. Les professionnels qui annoncent, prioritairement les médecins, sont formés aux bonnes pratiques d’annonce. L’annonce comporte aussi les faits établis et le plan de soins.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { id: "EIQ-011", theme: "ei", q: "Pourquoi recueillir le récit du patient lors d’un EIGS ?",
          opts: ["Pour constituer un dossier juridique destiné à protéger l’établissement en cas de contentieux", "Pour obtenir sa vision, compléter l’analyse et rétablir le lien de confiance", "Pour éviter qu’il saisisse la CDU ou engage une procédure contre l’établissement", "Ce n’est pas attendu : l’analyse repose uniquement sur les professionnels"], ok: 1,
          why: "Le récit apporte des informations utiles à l’analyse, renforce la confiance et fait partie de l’analyse collective. Ce lien de confiance est à rétablir avec l’équipe.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { id: "EIQ-012", theme: "ei", q: "Dans quel délai les analyses approfondies d’un EIGS doivent-elles être réalisées et reportées sur le portail national ?",
          opts: ["Dans les 48 heures", "Dans un délai de 3 mois après l’événement", "Dans les 2 ans", "Aucun délai"], ok: 1,
          why: "Le volet 2 de la déclaration, l’analyse approfondie, est attendu dans les 3 mois, avec les professionnels concernés, la chronologie des faits, plusieurs causes dont profondes, les barrières et les actions à échéances réalistes.", src: "Fiche HAS EIAS p. 6 · critère 1.2-07" },
        { id: "EIQ-013", theme: "ei", q: "Un EIGS peut-il être causé uniquement par des facteurs liés au patient ?",
          opts: ["Oui, c’est fréquent : le comportement du patient explique l’essentiel de ces événements", "Non : il est toujours causé par un ensemble de facteurs favorisants", "Oui, quand il est âgé, car son état de santé explique à lui seul l’événement", "Cela dépend du service où l’événement est survenu et de son organisation"], ok: 1,
          why: "L’analyse identifie plusieurs causes, immédiates et profondes. Elle s’appuie sur une méthode de retour d’expérience (CREX, RMM, REMED) et un outil comme ALARM. Il n’est jamais causé uniquement par le patient.", src: "Fiche HAS EIAS p. 6 · critère 1.2-07" },
        { id: "EIQ-014", theme: "ei", q: "Qu’entend-on par « seconde victime » ?",
          opts: ["Le deuxième patient concerné par un événement indésirable survenu dans le même service de soins", "Un professionnel impliqué dans un EIAS et affecté psychologiquement ou émotionnellement", "L’établissement qui subit une sanction après un événement indésirable grave", "La famille du patient, touchée par les conséquences de l’événement"], ok: 1,
          why: "Culpabilité, honte, anxiété, perte de confiance, troubles du sommeil, retrait… Il doit exister un parcours d’accompagnement connu de l’encadrement : entretien et mise en relation avec un pair formé. Le professionnel peut aussi être affecté professionnellement.", src: "Fiche HAS EIAS pp. 2 et 7 · critère 1.2-07" },
        { id: "EIQ-015", theme: "ei", q: "Que doit-on présenter aux représentants des usagers à chaque commission des usagers (CDU) ?",
          opts: ["Rien sur les événements indésirables, qui restent confidentiels au sein de l’établissement", "Une synthèse des événements indésirables : causes profondes et plans d’actions", "Le nom des soignants impliqués dans chaque événement indésirable", "Uniquement le nombre de lits"], ok: 1,
          why: "Les représentants des usagers sont informés et participent à l’évaluation des actions. La synthèse des plans d’actions est aussi diffusée aux équipes, pour démontrer l’intérêt de déclarer.", src: "Fiche HAS EIAS p. 7 · critères 1.2-07, 1.4-06" }
      ]
    },
    ei3: {
      th: "ei", title: "Politique qualité et gestion des risques",
      questions: [
        { id: "EIQ-016", theme: "ei", q: "Quel est le principe du cycle PDCA d’amélioration continue ?",
          opts: ["Prévoir, Déclarer, Corriger, Archiver", "Planifier, Faire, Vérifier, Agir", "Prescrire, Délivrer, Contrôler, Administrer", "Publier, Diffuser, Classer, Auditer"], ok: 1,
          why: "Le management par la qualité s’inscrit dans un cycle : planification, mise en œuvre, exploitation, analyse des résultats et amélioration continue.", src: "Fiche HAS management p. 3 · critères 3.1-01, 3.1-02" },
        { id: "EIQ-017", theme: "ei", q: "Que contient un plan d’actions qualité structuré ?",
          opts: ["Un titre et un budget global, sans pilote ni calendrier pour les actions", "Pour chaque action : un pilote, un calendrier, des indicateurs de suivi avec une cible", "Uniquement la liste des audits réalisés dans l’année, sans pilote ni calendrier de suivi des actions", "Seulement les actions déjà terminées, présentées sans indicateur ni cible de suivi"], ok: 1,
          why: "Le plan est unique, pertinent, décliné par pôle ou service, connu des professionnels pour les actions qui les concernent, et évalué chaque année. Chaque action comporte aussi un état d’avancement.", src: "Fiche HAS management pp. 3-4 · critère 3.1-01" },
        { id: "EIQ-018", theme: "ei", q: "Qu’est-ce qu’une rencontre sécurité ?",
          opts: ["Une visite de la sécurité incendie menée dans les locaux du service par la direction", "Un échange entre la gouvernance et les équipes sur un problème de sécurité ou un événement indésirable", "Une réunion de planning consacrée à l’organisation des équipes du service", "Un contrôle de la CDU sur les dossiers des patients hospitalisés"], ok: 1,
          why: "Elle montre l’engagement de la gouvernance. La culture de sécurité est aussi évaluée par une enquête auprès des professionnels. Les équipes concernées sont pluriprofessionnelles.", src: "Fiche HAS management p. 3 · critère 3.1-02" },
        { id: "EIQ-019", theme: "ei", q: "Comment hiérarchise-t-on les risques a priori ?",
          opts: ["Selon l’ordre alphabétique des services et des risques recensés dans la cartographie", "Selon leur gravité potentielle et leur probabilité de survenue", "Selon le coût des équipements concernés par chaque risque", "Selon l’ancienneté du service où le risque est identifié"], ok: 1,
          why: "Les dangers connus sont recensés (cartographie), priorisés par gravité et probabilité, et chaque risque est associé à des mesures préventives (barrières) et à des actions réactives si l’événement survient.", src: "Fiche HAS management p. 4 · critère 3.1-01" },
        { id: "EIQ-021", theme: "ei", q: "Que mesure un audit clinique ?",
          opts: ["La satisfaction des patients à l’égard de leur prise en charge", "L’écart entre la pratique réelle observée et la pratique attendue ou recommandée", "Le nombre d’événements indésirables survenus dans l’unité sur la période", "Le budget de l’unité et son évolution"], ok: 1,
          why: "Exemples de critères : hygiène des mains, traçabilité de la douleur, administration des médicaments. Les audits sont une des méthodes d’évaluation des pratiques professionnelles (EPP).", src: "Fiche HAS management p. 6 · critère 2.4-01" },
        { id: "EIQ-022", theme: "ei", q: "Quelle est la différence entre PREMs et PROMs ?",
          opts: ["Ce sont deux noms différents pour un même questionnaire de satisfaction proposé aux patients", "Les PREMs mesurent l’expérience, les PROMs les résultats de soins, rapportés par les patients", "Les PREMs concernent les soignants et les PROMs les patients", "Les PREMs mesurent la satisfaction hôtelière des patients et les PROMs les coûts supportés par l’établissement"], ok: 1,
          why: "Avec les questionnaires de satisfaction, ce sont trois mesures complémentaires de la qualité rapportée par les patients. Les PREMs mesurent l’expérience des soins rapportée par les patients, les PROMs les résultats de soins rapportés par les patients.", src: "Fiche HAS management p. 6 · critère 1.4-02" }
      ]
    },
    info1: {
      th: "info", title: "Personne de confiance et directives anticipées",
      questions: [
        { id: "INF-001", theme: "info", q: "Que doit-on tracer dans le dossier de soins à propos de la personne de confiance ?",
          opts: ["Rien, c’est la famille qui le sait", "Son identité et la désignation signée par elle", "Seulement son numéro de téléphone, sans son identité", "Uniquement son lien de parenté avec le patient, sans sa désignation"], ok: 1,
          why: "La personne de confiance est le référent de l’expression des volontés du patient. Elle peut être désignée avant l’hospitalisation : l’équipe retrouve alors l’information auprès des proches ou dans « Mon espace santé ». La désignation est signée par la personne de confiance.", src: "Fiche HAS fin de vie p. 3 · critère 1.3-11" },
        { id: "INF-002", theme: "info", q: "Quelle est la différence entre la personne de confiance et la personne à prévenir ?",
          opts: ["Aucune, c’est obligatoirement la même personne, désignée une seule fois par le patient", "Ce sont deux notions distinctes : le patient peut désigner l’une et l’autre", "La personne à prévenir remplace la personne de confiance dès l’entrée du patient", "Seule la personne à prévenir est tracée"], ok: 1,
          why: "Le patient connaît la différence entre les deux notions. Leur identité est tracée dans le dossier et elles ont été informées de leur rôle.", src: "Fiche HAS engagement p. 5 · critères 1.2-01, 1.3-11" },
        { id: "INF-003", theme: "info", q: "À quels patients informe-t-on de l’utilité des directives anticipées ?",
          opts: ["Seulement aux patients en fin de vie", "À tous les patients, quel que soit leur profil", "Seulement aux patients de moins de 70 ans", "Seulement à ceux qui le demandent"], ok: 1,
          why: "Les équipes informent tous les patients de l’utilité des directives anticipées. Elles tracent les directives et aussi le refus d’en rédiger.", src: "Fiche HAS fin de vie p. 3 · critère 1.1-04" },
        { id: "INF-004", theme: "info", q: "Un patient refuse de rédiger des directives anticipées. Que fait-on ?",
          opts: ["On ne note rien", "On trace son refus dans le dossier", "On insiste jusqu’à ce qu’il accepte", "On demande à la famille de les rédiger à sa place"], ok: 1,
          why: "Le refus d’en rédiger est tracé, au même titre que les directives elles-mêmes.", src: "Fiche HAS fin de vie p. 3 · critère 1.1-04" },
        { id: "INF-005", theme: "info", q: "Vrai ou faux : les proches ou aidants peuvent détenir les directives anticipées du patient.",
          opts: ["Vrai", "Faux"], ok: 0,
          why: "Les proches et/ou aidants peuvent détenir les directives anticipées. Ils s’impliquent dans le projet de soins avec l’accord du patient.", src: "Fiche HAS engagement p. 5 · critère 1.3-11" }
      ]
    },
    info2: {
      th: "info", title: "Consentement, projet de soins et fin de vie",
      questions: [
        { id: "INF-006", theme: "info", q: "Pour que le consentement du patient soit libre et éclairé, que doit-on lui avoir présenté ?",
          opts: ["Uniquement le formulaire à signer, présenté avec la liste des soins prévus", "Les différentes options de prise en charge, avec leurs bénéfices et leurs risques", "Uniquement le coût des soins et la durée prévue de l’hospitalisation", "Rien, le médecin décide seul de la prise en charge du patient"], ok: 1,
          why: "Le patient exprime ses préférences et besoins pour son projet de soins, et son consentement est demandé pour ce projet. L’information est claire, complète et adaptée. Il faut aussi recueillir ses préférences.", src: "Fiche HAS fin de vie pp. 3 et 6 · critère 1.3-01" },
        { id: "INF-007", theme: "info", q: "Avec qui associe-t-on les proches et aidants au projet de soins ?",
          opts: ["Toujours, même si le patient s’y oppose", "Avec l’accord du patient", "Seulement si le médecin le décide", "Jamais pendant l’hospitalisation"], ok: 1,
          why: "Avec l’accord du patient, les proches ou aidants s’impliquent dans le projet de soins. Les aidants, professionnels ou non, peuvent aussi continuer à aider pour les actes de la vie quotidienne dans un cadre tracé au projet de soins.", src: "Fiche HAS fin de vie p. 4 · fiche engagement pp. 3, 5 · critère 1.3-11" },
        { id: "INF-008", theme: "info", q: "Que trace-t-on dans le dossier lors d’une limitation ou d’un arrêt des thérapeutiques actives (LATA) ?",
          opts: ["Rien de spécial", "La décision issue de la procédure collégiale et l’annonce à la famille", "Seulement l’heure du décès", "Seulement la décision du médecin seul, sans procédure collégiale ni annonce à la famille"], ok: 1,
          why: "La LATA suit une analyse pluriprofessionnelle avant un décès prévisible, pour éviter toute obstination déraisonnable. Le transfert éventuel en USP/LISP ou à domicile (HAD) est aussi tracé. On trace aussi le recours à l’équipe mobile de soins palliatifs et la prescription anticipée de la phase agonique.", src: "Fiche HAS fin de vie p. 4 · critères 1.1-09, 2.1-05" },
        { id: "INF-009", theme: "info", q: "Comment évalue-t-on la douleur d’un patient qui ne peut pas participer (non communicant) ?",
          opts: ["On ne l’évalue pas", "Par une hétéroévaluation, avec un outil adapté", "En demandant à la famille de décider", "Une seule fois à l’entrée"], ok: 1,
          why: "L’auto-évaluation est la règle quand elle est possible. Sinon, hétéroévaluation avec un outil adapté, régulière, tracée, avec les décisions de prise en charge. Elle est réalisée par les soignants.", src: "Fiche HAS fin de vie p. 2 · critère 1.1-05" },
        { id: "INF-010", theme: "info", q: "Quand un traitement antalgique ou sédatif est mis en place pour une souffrance réfractaire en fin de vie, qui est informé ?",
          opts: ["Personne, car c’est une décision médicale qui n’appelle aucune information", "Le patient, la personne de confiance, la famille ou à défaut un proche", "Seulement le pharmacien", "Seulement le cadre de santé"], ok: 1,
          why: "Le médecin informe, même si ces traitements peuvent avoir pour effet d’abréger la vie. La démarche palliative refuse de provoquer intentionnellement la mort. La procédure est tracée dans le dossier médical.", src: "Fiche HAS fin de vie p. 2 · critères 1.1-09, 1.2-02" }
      ]
    },
    dig1: {
      th: "dignite", title: "Accompagner la fin de vie",
      questions: [
        { id: "DIG-001", theme: "dignite", q: "Jusqu’à quand les facilités de présence d’un proche sont-elles prévues ?",
          opts: ["Jusqu’à la fin des heures de visite", "Jusqu’au décès du patient", "Jusqu’à la sortie de l’unité de soins", "Elles ne sont pas prévues"], ok: 1,
          why: "Des facilités de présence ou d’accompagnement d’un proche sont prévues jusqu’au décès. La continuité de la prise en charge est assurée jusqu’au décès, avec respect de l’intimité et de la dignité.", src: "Fiche HAS fin de vie p. 4 · critères 1.1-01, 1.1-09" },
        { id: "DIG-002", theme: "dignite", q: "Que garantit-on au patient en soins palliatifs en matière de douleur ?",
          opts: ["Une prise en charge adaptée, évaluée, soulagée rapidement et réévaluée régulièrement", "Une évaluation unique à l’entrée, sans réévaluation ultérieure sauf nouvelle plainte du patient", "Aucune évaluation, car la douleur est inévitable en soins palliatifs", "Une évaluation seulement s’il la demande, la douleur n’étant traitée qu’à sa demande"], ok: 0,
          why: "La prise en charge de la douleur est un droit fondamental et fait partie intégrante des soins palliatifs. Cette prise en charge est aussi optimale.", src: "Fiche HAS fin de vie p. 2 · critère 1.1-05" },
        { id: "DIG-003", theme: "dignite", q: "Les soins palliatifs concernent-ils uniquement les patients qui vont décéder prochainement ?",
          opts: ["Oui, uniquement : ils sont réservés aux patients dont le décès est proche", "Non : le décès n’est pas la seule issue, des séjours de répit sont aussi proposés", "Oui, mais seulement à domicile, auprès de patients en fin de vie", "Non, ils concernent uniquement les enfants atteints de maladies graves"], ok: 1,
          why: "Les soins palliatifs s’adressent aux personnes atteintes de maladies graves évolutives en phase avancée ou terminale, et accompagnent aussi la famille et les proches. Les séjours de répit sont proposés aux patients et à leur entourage.", src: "Fiche HAS fin de vie pp. 1 et 5 · critère 2.1-05" },
        { id: "DIG-004", theme: "dignite", q: "Quelles structures peuvent contribuer au parcours de fin de vie d’un patient ?",
          opts: ["Les LISP, l’EMSP, les USP, l’HAD", "Uniquement la chambre mortuaire de l’établissement, sans autre structure", "Seul le service des urgences, qui prend en charge toute la fin de vie", "Aucune, tout se fait dans le service sans recours à une structure extérieure"], ok: 0,
