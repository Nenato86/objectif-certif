          why: "Les établissements identifient les filières spécifiques (LISP, EMSP, USP, HAD, HDJ…), formalisent des partenariats et informent les professionnels de ces dispositifs.", src: "Fiche HAS fin de vie p. 3 · critère 2.1-05" },
        { id: "DIG-005", theme: "dignite", q: "Quel soutien est prévu pour les professionnels confrontés à la fin de vie ?",
          opts: ["Aucun soutien particulier, la confrontation à la fin de vie faisant partie du métier", "Des temps d’échange pluriprofessionnels et des dispositifs d’écoute", "Une réunion annuelle, sans dispositif d’écoute ni temps d’échange", "Un congé accordé automatiquement après chaque décès d’un patient"], ok: 1,
          why: "Les équipes disposent de temps d’échange pour évoquer les difficultés de la prise en soins palliative, et connaissent les dispositifs d’écoute et d’accompagnement psychologique pour elles-mêmes et les proches. Ces temps d’échange peuvent se faire avec un psychologue.", src: "Fiche HAS fin de vie pp. 4-5 · critère 3.2-06" }
      ]
    },
    exp1: {
      th: "experience", title: "Satisfaction et expérience du patient",
      questions: [
        { id: "EXP-001", theme: "experience", q: "Comment fonctionne e-Satis ?",
          opts: ["Un questionnaire papier remis à l’entrée du patient, qu’il remplit puis rend à l’équipe avant sa sortie", "Un mail avec un lien vers un questionnaire national, environ 2 semaines après la sortie", "Un appel téléphonique la veille de la sortie, réalisé par l’équipe du service", "Un affichage dans le service, invitant les patients à donner leur avis"], ok: 1,
          why: "Les résultats sont restitués aux établissements en temps réel sur la plateforme nationale et mis à disposition du public sur Qualiscope. Le recueil de l’adresse mail du patient est donc essentiel. Le patient peut répondre jusqu’à 8 semaines après l’envoi.", src: "Fiche HAS engagement p. 2 · critère 1.4-02" },
        { id: "EXP-002", theme: "experience", q: "Que mesurent les PREMs ?",
          opts: ["Les résultats de santé et la qualité de vie rapportés par les patients", "L’expérience des soins rapportée par les patients", "Le coût des soins supporté par l’établissement", "La charge de travail des soignants dans l’unité"], ok: 1,
          why: "PREMs : expérience rapportée par les patients. PROMs : résultats de santé et qualité de vie perçus par le patient. La satisfaction mesure l’écart entre attentes et service rendu. Les trois sont complémentaires.", src: "Fiche HAS engagement p. 2 · critères 1.4-02, 1.4-03" },
        { id: "EXP-003", theme: "experience", q: "Un secteur est couvert par e-Satis avec des résultats exploitables. Faut-il un questionnaire de satisfaction interne en plus ?",
          opts: ["Oui, toujours, quelle que soit la couverture du secteur par e-Satis", "Non, sauf si le secteur n’est pas couvert ou si les résultats sont inexploitables", "Oui, tous les mois, pour compléter les résultats d’e-Satis", "Non, jamais, même si e-Satis ne couvre pas le secteur ou que ses résultats sont inexploitables"], ok: 1,
          why: "L’établissement dispose d’un questionnaire interne uniquement lorsque e-Satis ne couvre pas le secteur ou que ses résultats sont inexploitables.", src: "Fiche HAS engagement p. 4 · critère 1.4-02" },
        { id: "EXP-004", theme: "experience", q: "Quels taux l’établissement doit-il suivre pour les enquêtes de satisfaction ?",
          opts: ["Aucun", "Les taux de retour des questionnaires", "Uniquement le nombre de lits", "Uniquement le nombre de plaintes"], ok: 1,
          why: "Par exemple le nombre de questionnaires envoyés par rapport au nombre de patients concernés, et de réponses par rapport aux envois (notamment pour e-Satis). Des actions sont menées pour les améliorer.", src: "Fiche HAS engagement p. 5 · critère 1.4-02" },
        { id: "EXP-005", theme: "experience", q: "Que doivent connaître la CDU, les professionnels, la CME et la commission des soins ?",
          opts: ["Seulement le nombre de lits de chaque service de l’établissement", "Les résultats des évaluations et les actions d’amélioration qui en découlent", "Les noms des patients ayant déposé une plainte, afin de leur répondre directement et individuellement", "Uniquement le budget de l’établissement et de ses services"], ok: 1,
          why: "Ils participent à l’analyse des résultats et proposent des actions pour améliorer la vie quotidienne des patients et la qualité et la sécurité des soins. Ces résultats portent sur les plaintes, réclamations, médiations et questionnaires.", src: "Fiche HAS engagement p. 5 · critères 1.4-02, 1.4-06" }
      ]
    },
    exp2: {
      th: "experience", title: "Patients partenaires et proches",
      questions: [
        { id: "EXP-006", theme: "experience", q: "Qu’est-ce qu’un patient partenaire ?",
          opts: ["Un patient hospitalisé depuis longtemps, qui connaît bien le fonctionnement du service", "Une personne disposant d’une expertise de patient, en partenariat avec les professionnels", "Un soignant atteint d’une maladie, qui témoigne auprès des autres professionnels", "Un représentant de la direction chargé de relayer les attentes des patients"], ok: 1,
          why: "Les patients partenaires peuvent intervenir dans l’amélioration des pratiques, la co-construction des parcours, la formation des professionnels, la recherche, la relecture de documents destinés aux patients. Cette personne est engagée dans une démarche de partenariat en santé.", src: "Fiche HAS engagement pp. 2 et 5 · critère 1.4-04" },
        { id: "EXP-007", theme: "experience", q: "Le patient peut-il demander que son aidant continue à l’aider pour les actes de la vie quotidienne pendant l’hospitalisation ?",
          opts: ["Non, c’est interdit", "Oui, après un échange entre le patient, l’équipe et l’aidant", "Oui, sans aucune règle", "Seulement avec l’autorisation de la direction"], ok: 1,
          why: "Un cadre adéquat définit les modalités de présence de l’aidant et des aides possibles ; ce cadre est tracé dans le projet de soins. Cet échange aboutit à un cadre tracé au projet de soins.", src: "Fiche HAS engagement p. 3 · critère 1.3-11" },
        { id: "EXP-008", theme: "experience", q: "La présence des proches auprès du patient doit-elle être limitée aux heures de visite ?",
          opts: ["Oui, toujours, car les proches gênent les soins et la confidentialité des échanges", "Non : elle est proposée et facilitée, y compris en dehors des heures de visite", "Oui, sauf le dimanche, jour où les proches peuvent rester plus longtemps", "Seulement en fin de vie, la présence hors des heures de visite n’étant autorisée que dans ce cas"], ok: 1,
          why: "Les locaux permettent aussi des échanges avec les proches dans le respect de l’intimité et de la confidentialité. La présence des proches est proposée et facilitée par l’équipe.", src: "Fiche HAS engagement p. 5 · critère 1.3-11" },
        { id: "EXP-009", theme: "experience", q: "Quelles sont les formes de recueil du point de vue du patient attendues ?",
          opts: ["Uniquement la boîte à idées placée dans le hall d’accueil de l’établissement", "Questionnaires de satisfaction, plaintes et éloges, PREMs, PROMs et groupes de travail", "Uniquement des appels téléphoniques réalisés par la direction après la sortie", "Aucun recueil n’est attendu, la gouvernance décidant seule des priorités"], ok: 1,
          why: "La gouvernance utilise des outils variés pour recueillir le vécu, le ressenti et les idées des patients, afin d’en faire un acteur de sa prise en soin. Les formes de recueil incluent aussi les questionnaires d’expérience, les réclamations et les focus groups.", src: "Fiche HAS engagement p. 4 · critère 1.4-02" },
        { id: "EXP-010", theme: "experience", q: "Un patient interpelle un soignant au sujet d’une difficulté de communication. Que doit savoir le soignant ?",
          opts: ["Ignorer la demande, la difficulté relevant du seul patient", "Comment recourir aux médiateurs de l’établissement", "Appeler directement la police pour signaler la difficulté", "Attendre la fin du séjour pour en parler à l’encadrement"], ok: 1,
          why: "Le recours aux médiateurs médicaux et paramédicaux permet de prévenir les situations difficiles de communication. Demandez à votre encadrement comment les solliciter. Il doit aussi connaître leur rôle.", src: "Fiche HAS engagement pp. 4 et 6 · critère 1.2-06" }
      ]
    },
    age1: {
      th: "age", title: "Dépendance iatrogène",
      questions: [
        { id: "AGE-001", theme: "age", q: "À partir de quel âge le référentiel de certification considère-t-il un patient comme âgé ?",
          opts: ["60 ans", "Plus de 75 ans", "Plus de 90 ans", "Aucune limite : tout dépend de la fragilité"], ok: 1,
          why: "Dans le référentiel, un patient est âgé s’il a plus de 75 ans. La fiche précise que la fragilité aide aussi à cerner les personnes relevant de la gériatrie.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { id: "AGE-002", theme: "age", q: "Qu’est-ce que la dépendance iatrogène ?",
          opts: ["La dépendance durable due à la maladie d’Alzheimer et aux troubles cognitifs qui l’accompagnent", "Les décompensations fonctionnelles ou psychiques liées à l’hospitalisation", "La dépendance à l’alcool, installée avant l’hospitalisation et aggravée par le séjour", "Le besoin d’une aide à domicile après la sortie, du fait de la perte d’autonomie du patient"], ok: 1,
          why: "Ces causes peuvent parfois aller jusqu’au décès. L’évaluation à l’admission recherche les facteurs de risque de dépendance iatrogène. Il s’agit notamment de l’immobilisation, de la confusion, de la dénutrition, des chutes, de l’incontinence, des effets indésirables des médicaments et du risque suicidaire.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { id: "AGE-003", theme: "age", q: "Parmi ces facteurs, lequel favorise le syndrome d’immobilisation ?",
          opts: ["Une aide adaptée à la marche et aux transferts, qui maintient l’activité du patient", "Un alitement ou des restrictions d’activité non justifiés médicalement, une contention", "Un lever précoce au fauteuil, avec reprise progressive de la marche", "Un environnement adapté et sécurisé, favorable à la mobilité du patient"], ok: 1,
          why: "Le syndrome d’immobilisation entraîne perte rapide de masse musculaire, perte d’autonomie et réhospitalisations. Le patient est parfois alité alors que la restriction n’est pas médicalement justifiée. Une douleur non traitée et une sonde non justifiée favorisent aussi ce syndrome.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { id: "AGE-004", theme: "age", q: "Quels sont des facteurs de risque prédisposant à la confusion aiguë ?",
          opts: ["Démence ou troubles cognitifs, atteinte sensorielle, polymédication, dénutrition", "Avoir moins de 60 ans, sans aucun trouble cognitif ni atteinte sensorielle, avec une bonne autonomie", "Une chambre individuelle, calme et adaptée, avec un environnement sécurisé et familier", "Un bon état nutritionnel, associé à une absence de polymédication"], ok: 0,
          why: "La confusion aiguë augmente le risque de déclin fonctionnel, de chutes, la durée d’hospitalisation et l’entrée en institution. L’immobilisation aggravée par la contention est aussi un facteur de risque.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { id: "AGE-005", theme: "age", q: "Un patient âgé agité : que dit la fiche à propos des barrières de lit posées « par souci de sécurité » ?",
          opts: ["C’est une mesure de sécurité sans conséquence sur la mobilité ni sur la confusion du patient", "Éviter le recours inapproprié aux contentions physiques, y compris les barrières", "Elles sont obligatoires la nuit pour tout patient âgé agité, sans réévaluation", "Elles sont décidées par l’aide-soignant seul, sans avis de l’équipe"], ok: 1,
          why: "Les contentions aggravent l’immobilisation et la confusion. La fiche demande d’éviter leur recours inapproprié et de réévaluer toute mesure restrictive lorsqu’elle est nécessaire.", src: "Fiche HAS patients âgés p. 5 · critères 1.1-06, 1.1-10" },
        { id: "AGE-006", theme: "age", q: "Parmi ces mesures, laquelle prévient la dépendance iatrogène ?",
          opts: ["Laisser le patient au lit toute la journée par précaution, pour éviter les chutes et la fatigue", "Le mettre au fauteuil, lui proposer de marcher et préserver son autonomie pour aller aux toilettes", "Poser une protection urinaire systématique à l’entrée, pour faciliter les soins et la toilette", "Prescrire un sédatif pour la nuit à tous les patients, afin de limiter l’agitation"], ok: 1,
          why: "On évite aussi les médicaments potentiellement sédatifs, on est vigilant sur les apports alimentaires et hydriques, on surveille le poids, et on évite les protections ou sondes urinaires non justifiées en réévaluant régulièrement leur indication.", src: "Fiche HAS patients âgés p. 5 · critère 1.3-04" },
        { id: "AGE-007", theme: "age", q: "Quelle part des effets indésirables des médicaments chez le sujet âgé est prévisible et évitable ?",
          opts: ["Moins de 5 %, la quasi-totalité étant imprévisible", "Environ 10 %, le reste étant inévitable", "De 30 à 60 %", "Plus de 95 %"], ok: 2,
          why: "L’iatrogénie médicamenteuse est une cause d’hospitalisation en urgence des plus de 75 ans. La polymédication et les médicaments à marge thérapeutique étroite ou favorisant les chutes sont des facteurs de risque.", src: "Fiche HAS patients âgés p. 2 · critères 1.3-04, 2.1-04" },
        { id: "AGE-008", theme: "age", q: "Vrai ou faux : la dépression est un signe normal de vieillesse.",
          opts: ["Vrai", "Faux"], ok: 1,
          why: "C’est un trouble qui nécessite un traitement. Elle est souvent sous-diagnostiquée chez les personnes âgées, notamment à cause de présentations atypiques. La GDS (Geriatric Depression Scale) permet de la dépister.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" }
      ]
    },
    age2: {
      th: "age", title: "Projet de soins et entourage",
      questions: [
        { id: "AGE-009", theme: "age", q: "Que doit comporter l’évaluation d’un patient âgé dès l’admission ?",
          opts: ["Seulement le motif d’hospitalisation, le diagnostic médical et les résultats de l’examen d’entrée", "Besoins, capacités, préférences, conditions de vie, autonomie et facteurs de risque de dépendance iatrogène", "Uniquement le poids et la taille, mesurés à l’entrée du patient", "Uniquement les antécédents familiaux et la profession exercée avant la retraite"], ok: 1,
          why: "Besoins élémentaires : hydratation, nutrition, accompagnement aux toilettes, hygiène, marche. L’évaluation est revue selon l’évolution de l’état de santé. Le médecin s’assure aussi de la pertinence du traitement habituel.", src: "Fiche HAS patients âgés p. 4 · critère 1.3-04" },
        { id: "AGE-010", theme: "age", q: "Qu’informe-t-on le patient âgé, quels que soient son âge ou ses troubles sensoriels et cognitifs ?",
          opts: ["Rien, on informe uniquement la famille puisque le patient ne comprend pas", "Son état de santé, ses traitements, le risque de dépendance iatrogène", "Uniquement sa date de sortie et l’organisation de son retour à domicile", "Simplement le nom du médecin responsable et celui du cadre de santé"], ok: 1,
          why: "L’équipe évalue d’abord le niveau de compréhension et s’adapte à son degré de compréhension et de discernement, avec des outils de communication internes. Le patient est aussi informé de son droit de désigner une personne de confiance et une personne à prévenir.", src: "Fiche HAS patients âgés p. 4 · critères 1.2-02, 1.3-01" },
        { id: "AGE-011", theme: "age", q: "Un patient âgé n’a pas de directives anticipées dans son dossier. Que fait l’équipe ?",
          opts: ["Elle n’en cherche pas, le patient n’étant pas en état d’en rédiger", "Elle vérifie s’il en existe, et demande à l’entourage s’il en a connaissance", "Elle les rédige à sa place dès l’admission, d’après les souhaits supposés de la famille", "Elle attend la sortie du patient pour s’en préoccuper"], ok: 1,
          why: "L’équipe vérifie l’existence de directives anticipées et interroge l’entourage si elles ne sont pas retrouvées.", src: "Fiche HAS patients âgés p. 4 · critère 1.1-04" },
        { id: "AGE-012", theme: "age", q: "Un patient âgé est sous protection juridique. Qui l’équipe informe-t-elle de l’hospitalisation et de l’état de santé ?",
          opts: ["Personne", "Le tuteur ou le curateur", "Le voisin", "Seulement le médecin traitant"], ok: 1,
          why: "Pour les patients âgés sous protection juridique, le tuteur ou le curateur est informé de l’hospitalisation et de l’état de santé du patient.", src: "Fiche HAS patients âgés p. 4 · critère 1.2-02" },
        { id: "AGE-013", theme: "age", q: "À quelle condition l’équipe échange-t-elle avec les proches d’un patient âgé ?",
          opts: ["Toujours, sans condition, dès lors qu’ils se présentent comme proches du patient", "Avec l’accord du patient, dans le respect du secret médical", "Seulement avec les enfants majeurs du patient, quel que soit son avis", "Jamais, le secret médical interdisant tout échange avec l’entourage"], ok: 1,
          why: "Dès l’admission, l’équipe s’assure que le patient a donné son accord. Elle trace l’identité de la personne à prévenir et de la personne de confiance (co-signature du formulaire). Les échanges respectent aussi la confidentialité.", src: "Fiche HAS patients âgés p. 4 · critère 1.3-11" },
        { id: "AGE-014", theme: "age", q: "Pourquoi faciliter la présence des proches auprès du patient âgé ?",
          opts: ["Pour réduire le personnel nécessaire et alléger la charge de travail des soignants au quotidien", "C’est une ressource pour l’équipe et un moyen efficace de lutter contre la maltraitance", "Pour éviter la facturation des soins et des prestations hôtelières", "Ce n’est pas utile, leur présence perturbe les soins et l’organisation du service"], ok: 1,
          why: "Elle est facilitée dans les situations difficiles (admission en urgence, fin de vie), avec échange sur les habitudes et besoins de la personne âgée. La maltraitance visée est notamment l’infantilisation lors des soins.", src: "Fiche HAS patients âgés p. 4 · critères 1.1-06, 1.3-11" },
        { id: "AGE-015", theme: "age", q: "Pour éviter un passage inutile aux urgences d’un patient de plus de 75 ans, que doit pouvoir faire l’établissement ?",
          opts: ["Rien de particulier", "Solliciter rapidement un avis gériatrique ou spécialisé, y compris par télésanté", "Refuser toute admission non programmée", "Transférer systématiquement vers les urgences générales"], ok: 1,
          why: "Il identifie aussi l’établissement de recours à contacter. Si la situation clinique est complexe, le passage aux urgences peut être pertinent, avec l’appui d’une équipe mobile gériatrique. L’établissement doit aussi pouvoir faire appel à une équipe mobile gériatrique si besoin.", src: "Fiche HAS patients âgés p. 3 · critère 3.3-05 (impératif)" },
        { id: "AGE-016", theme: "age", q: "Quel indicateur de pratique suit-on pour évaluer la prise en charge des patients âgés ?",
          opts: ["Le taux d’escarres acquises et la prévalence de la dénutrition", "Uniquement le nombre de repas servis chaque jour dans l’unité de soins", "Seulement le nombre de visiteurs reçus par les patients âgés dans le service", "Aucun indicateur n’est attendu pour ces patients, la prise en charge n’étant pas mesurée"], ok: 0,
          why: "Autres exemples : réhospitalisation à 30 jours, durée moyenne de séjour des ≥ 75 ans, passages aux urgences, délais d’accès à une expertise gériatrique. Les équipes analysent leurs résultats et définissent des mesures d’amélioration. Sont aussi suivis le nombre moyen de jours alités et le taux de chutes avec traumatisme.", src: "Fiche HAS patients âgés p. 6 · critère 3.3-05" }
      ]
    },
    sortie1: {
      th: "sortie", title: "Préparer la sortie et prévenir la dénutrition",
      questions: [
        { id: "SOR-006", theme: "sortie", q: "Que contient le « volet médicamenteux » de la lettre de liaison de sortie ?",
          opts: ["Seulement les médicaments prescrits à la sortie, sans ceux pris avant", "Tous les médicaments pris avant l’hospitalisation et ceux à prendre après", "Le prix des médicaments et leur taux de remboursement", "La liste des médicaments du service et de leurs stocks"], ok: 1,
          why: "Il est complété et remis au patient ou à ses proches, et communiqué au médecin de ville avec la lettre de liaison. Il explique le devenir du traitement habituel.", src: "Fiche HAS patients âgés p. 6 · critère 2.1-14" },
        { id: "SOR-007", theme: "sortie", q: "Que doit avoir programmé l’équipe avant la sortie ?",
          opts: ["Rien de précis, le patient se débrouille seul une fois sorti", "Au minimum les premiers rendez-vous utiles au suivi", "Seulement le transport du patient jusqu’à son domicile", "Uniquement un rendez-vous avec l’assistante sociale, sans suivi médical"], ok: 1,
          why: "L’équipe remet aussi au patient ou à un aidant le traitement prescrit pour qu’il puisse se rendre à la pharmacie. L’équipe s’assure aussi que le patient sait à qui s’adresser en cas de difficulté.", src: "Fiche HAS patients âgés p. 6 · critères 1.2-04, 2.1-14" },
        { id: "SOR-008", theme: "sortie", q: "Sur quoi s’appuie-t-on pour organiser la sortie d’un patient âgé ?",
          opts: ["Les seules disponibilités de l’hôpital et de ses lits, sans tenir compte du patient", "Les conditions de vie habituelles exprimées par le patient et ses proches", "Le seul avis de la direction de l’établissement, sans consulter le patient", "Exclusivement le souhait de la famille, sans recueillir l’avis du patient"], ok: 1,
          why: "Le patient et ses proches sont informés des aides techniques, structures, personnes (assistante sociale), représentants des usagers et associations, et des modalités pour les contacter. Les options sont le retour à domicile, les aides à domicile ou le transfert vers une structure adaptée.", src: "Fiche HAS patients âgés p. 6 · critères 1.2-04, 2.1-14" },
        { id: "SOR-009", theme: "sortie", q: "À qui la lettre de liaison est-elle communiquée en plus du patient ?",
          opts: ["À personne d’autre que le patient, qui la conserve seul", "Au médecin de ville, avec le volet médicamenteux et les points de vigilance", "Uniquement à la mutuelle du patient, pour le remboursement des soins", "Uniquement à la pharmacie de ville, pour la délivrance du traitement"], ok: 1,
          why: "C’est ce qui assure la continuité du parcours de soins après l’hospitalisation. La lettre comprend aussi les examens à réaliser, les rendez-vous et les changements thérapeutiques.", src: "Fiche HAS patients âgés p. 6 · critère 2.1-14" },
        { id: "SOR-010", theme: "sortie", q: "Quelles complications la dénutrition du sujet âgé peut-elle entraîner ?",
          opts: ["Aucune complication notable, car la dénutrition est banale et sans conséquence chez le sujet âgé", "Confusion, infection, perte de masse musculaire, retard de cicatrisation, escarre", "Seulement une perte de poids, sans conséquence sur la santé du patient", "Seulement de la fatigue passagère, sans effet sur l’état général"], ok: 1,
          why: "On reste vigilant sur les apports alimentaires et hydriques et on surveille le poids. Les équipes se coordonnent pour prévenir les troubles nutritionnels. La dénutrition peut aussi entraîner une entrée en institution et une hausse de la mortalité.", src: "Fiche HAS patients âgés pp. 2 et 5 · critère 2.1-06" }
      ]
    },
    sse1: {
      th: "sse", title: "Plan blanc et situations sanitaires exceptionnelles",
      questions: [
        { id: "SSE-001", theme: "sse", q: "À quoi sert le plan blanc d’un établissement ?",
          opts: ["À organiser les congés d’été et la répartition du personnel entre les services de l’établissement", "À mobiliser tous les moyens en cas d’afflux de patients ou de situation exceptionnelle", "À gérer uniquement les incendies et les évacuations de bâtiments", "À planifier les travaux de rénovation des bâtiments de l’établissement"], ok: 1,
          why: "Tensions majeures sur les urgences et les lits, cyberattaque, épidémie, inondation, accident exceptionnel, panne électrique… Le plan blanc est révisé chaque année.", src: "Fiche HAS SSE pp. 1-2 · critère 3.1-05" },
        { id: "SSE-002", theme: "sse", q: "Qui peut déclencher le plan blanc d’un établissement ?",
          opts: ["Tout soignant qui estime que la situation l’exige, sans autre validation", "Le directeur ou le responsable de l’établissement", "Le patient ou ses proches, s’ils jugent la situation grave", "Le cadre de santé de l’unité concernée par l’afflux de patients"], ok: 1,
          why: "Le directeur général de l’ARS peut aussi le déclencher au niveau territorial, départemental ou régional. Il en informe sans délai le représentant de l’État.", src: "Fiche HAS SSE p. 2 · critère 3.1-05" },
        { id: "SSE-003", theme: "sse", q: "Que distinguent les deux niveaux de gestion du plan ?",
          opts: ["Niveau 1 : mobilisation interne pour un événement à impact limité ; niveau 2 : plan blanc pour un impact fort", "Niveau 1 : le fonctionnement de nuit ; niveau 2 : le fonctionnement de jour", "Niveau 1 : les urgences ; niveau 2 : la maternité", "Aucune différence"], ok: 0,
          why: "Au niveau 2, on active une cellule de crise, on réaffecte le personnel, on anticipe les sorties, on ouvre des lits et on communique. Le niveau 1 correspond par exemple à une épidémie saisonnière.", src: "Fiche HAS SSE pp. 1 et 3 · critère 3.1-05" },
        { id: "SSE-004", theme: "sse", q: "En combien de temps la cellule de crise doit-elle être opérationnelle après l’alerte ?",
          opts: ["Dans les 15 minutes", "45 minutes", "Au bout de 6 heures", "Au bout de 24 heures"], ok: 1,
          why: "Elle est pilotée par le chef d’établissement ou son représentant et composée de la direction, du président de la CME, de la direction des soins, du chef de service et du cadre des urgences, de l’anesthésiste-réanimateur…", src: "Fiche HAS SSE p. 4 · critère 3.1-05" },
        { id: "SSE-005", theme: "sse", q: "Que doit connaître chaque professionnel à propos des situations sanitaires exceptionnelles ?",
          opts: ["Rien de particulier : la gestion de crise relève de la seule direction, qui gère seule les alertes", "La gouvernance de gestion de crise, les modalités de l’alerte et où est stocké le matériel", "Uniquement le numéro du préfet à appeler en cas d’alerte dans l’établissement", "Uniquement le budget alloué à la gestion de crise dans l’établissement"], ok: 1,
          why: "Les professionnels sont formés, participent à des exercices et des retours d’expérience. Demandez à votre encadrement comment vous seriez alerté chez vous. Ils connaissent aussi les modalités de mise en œuvre et le matériel nécessaire.", src: "Fiche HAS SSE pp. 3 et 5 · critères 3.1-05, 3.2-03" },
        { id: "SSE-006", theme: "sse", q: "Que fait-on des enseignements d’un événement ayant déclenché un plan ?",
          opts: ["Rien, l’événement est clos une fois la situation revenue à la normale", "On réalise un retour d’expérience (RETEX) et on inscrit les actions d’amélioration au PAQSS", "On l’archive sans analyse ni action d’amélioration dans le programme qualité", "On le communique uniquement à la presse et aux autorités, sans analyse interne"], ok: 1,
          why: "Le suivi des actions d’amélioration dans le programme qualité et sécurité des soins de l’établissement est attendu.", src: "Fiche HAS SSE p. 4 · critères 3.1-01, 3.1-05" },
        { id: "SSE-007", theme: "sse", q: "Que couvre le dispositif ORSAN ?",
          opts: ["Uniquement la gestion des stocks de médicaments dans les établissements de la région", "L’organisation régionale des soins en situation exceptionnelle", "L’organisation des gardes de nuit des médecins et des soignants de la région", "Les autorisations d’ouverture de lits dans les établissements de santé"], ok: 1,
          why: "Il comprend 5 volets : AMAVI, MEDICO-PSY, EPI-CLIM, REB et NRC. Le plan blanc d’établissement en intègre les orientations. Il couvre l’accueil massif de victimes, les épidémies, la canicule, les risques biologiques et le risque NRC.", src: "Fiche HAS SSE p. 2 · critère 3.1-05" },
        { id: "SSE-008", theme: "sse", q: "Quel type de matériel doit être suffisant, opérationnel et accessible pour la conduite des soins en cas de déclenchement ?",
          opts: ["Uniquement des fournitures de bureau et du matériel informatique pour la direction", "Lits disponibles, équipements de protection individuelle et dispositifs médicaux", "Uniquement des véhicules pour le transport des patients vers d’autres établissements", "Aucun matériel spécifique n’est exigé en dehors des moyens habituels"], ok: 1,
          why: "Les capacités de diagnostic microbiologique et de biologie médicale sont aussi prévues. Les dispositifs médicaux comprennent respirateurs et pousse-seringues, et les capacités d’isolement sont aussi à prévoir.", src: "Fiche HAS SSE p. 3 · critère 3.1-05" }
      ]
    },
    cyber1: {
      th: "cyber", title: "Outils numériques et continuité d’activité",
      questions: [
        { id: "CYB-001", theme: "cyber", q: "Que doivent savoir faire les professionnels en cas d’indisponibilité d’un dispositif numérique ou du système d’information ?",
          opts: ["Attendre le retour du système", "Mettre en œuvre le PCA et le PRA", "Arrêter les soins", "Appeler le patient"], ok: 1,
          why: "Les dispositifs médicaux numériques à usage professionnel sont pris en compte dans les PRA/PCA pour éviter toute rupture d’activité.", src: "Fiche HAS numérique pp. 3-4 · critères 3.4-05, 3.4-06" },
        { id: "CYB-002", theme: "cyber", q: "Un outil d’aide à la décision utilisant l’intelligence artificielle propose un résultat. Que doit faire le professionnel ?",
          opts: ["Se fier systématiquement au résultat, l’outil étant plus fiable que le jugement du professionnel", "Interpréter le résultat et pouvoir décider de l’ignorer ou de le remplacer", "Ne jamais l’utiliser, quelle que soit la situation clinique du patient", "Le recopier sans le lire dans le dossier du patient"], ok: 1,
          why: "Le règlement européen sur l’IA demande de rester conscient du biais d’automatisation : la tendance à se fier excessivement aux sorties du système. Il doit aussi comprendre les limites de l’outil.", src: "Fiche HAS numérique p. 2 · critère 3.4-05" },
        { id: "CYB-003", theme: "cyber", q: "Que doit-on faire quand on utilise un dispositif médical numérique d’aide à la décision ?",
          opts: ["Rien de spécial, l’outil étant comparable à tout autre matériel de soins", "En informer le patient et, en cas de réutilisation de ses données, adapter l’information", "Le cacher au patient pour ne pas l’inquiéter ni compromettre sa confiance", "Demander au patient de choisir lui-même le dispositif qu’il préfère"], ok: 1,
          why: "Une procédure de recueil du consentement au traitement des données est mise à disposition par la gouvernance, le cas échéant.", src: "Fiche HAS numérique p. 4 · critères 3.4-05, 3.4-06" },
        { id: "CYB-004", theme: "cyber", q: "Un outil numérique donne un résultat inattendu ou dysfonctionne. Que fait-on ?",
          opts: ["On l’ignore tant qu’il ne provoque aucune conséquence visible pour un patient pris en charge", "On déclare le dysfonctionnement ; il est analysé et conduit à des actions correctives", "On le répare soi-même, sans le signaler, pour éviter toute interruption de l’activité", "On attend le prochain audit pour en parler, sans le déclarer entre-temps"], ok: 1,
          why: "Un processus de contrôle qualité des résultats en situation réelle d’utilisation est aussi attendu. La déclaration se fait en événement associé aux soins ou en matériovigilance.", src: "Fiche HAS numérique p. 4 · critères 3.4-05, 3.4-06" },
        { id: "CYB-005", theme: "cyber", q: "Que doit avoir reçu chaque utilisateur avant d’utiliser un dispositif médical numérique ?",
          opts: ["Rien, il apprend en l’utilisant, avec l’aide de ses collègues au fil des soins", "Une formation préalable, avec connaissance des conditions d’usage et des limites", "Une simple notice papier remise avec l’appareil, à lire à l’occasion de la première utilisation", "Une autorisation du patient"], ok: 1,
          why: "Les professionnels sont aussi sensibilisés à la responsabilité médicale et à l’usage du dispositif dans le respect de sa finalité médicale. La formation couvre aussi la connaissance des performances et des risques.", src: "Fiche HAS numérique p. 4 · critères 3.4-05, 3.4-06" }
      ]
    },
    eq1: {
      th: "equipes", title: "Ressources, compétences et formation",
      questions: [
        { id: "EQU-001", theme: "equipes", q: "Qu’est-ce que la maquette organisationnelle ?",
          opts: ["Un plan de l’unité en 3D", "Un outil de calcul des besoins en effectifs", "Un emploi du temps des patients", "Un budget annuel"], ok: 1,
          why: "Elle prend en compte l’obligation annuelle de travail, les effectifs requis et les ETP disponibles, les cycles de travail, le dimensionnement par lits (jour, week-end, nuit) et les règles de remplacement et d’affectation. Elle sert à calculer les besoins en effectifs, en l’absence de références réglementaires.", src: "Fiche HAS ressources p. 3 · critère 3.2-01" },
        { id: "EQU-002", theme: "equipes", q: "À quels moments l’écart entre l’organisation cible et l’organisation réelle est-il particulièrement surveillé ?",
          opts: ["Seulement le lundi matin", "La nuit, le week-end et les jours fériés", "Seulement pendant les audits", "Jamais"], ok: 1,
          why: "Lorsque des écarts imprévisibles sont constatés, un dispositif d’adaptation ressources/activité prévoit des mesures d’adaptation des activités (mode dégradé, réduction d’activité) et des dispositions transitoires. Les vacances scolaires sont aussi concernées.", src: "Fiche HAS ressources p. 4 · critère 3.2-01" },
        { id: "EQU-003", theme: "equipes", q: "Que doit savoir pouvoir faire un soignant à tout moment ?",
          opts: ["Joindre un médecin", "Contacter la direction générale", "Appeler un huissier", "Rien de particulier"], ok: 0,
          why: "Les soignants savent et peuvent joindre un médecin à tout moment, et connaissent le circuit de signalement des dysfonctionnements.", src: "Fiche HAS ressources p. 5 · critère 3.2-01" },
        { id: "EQU-004", theme: "equipes", q: "Que doit-on offrir à un professionnel temporaire (intérim, remplacement) ?",
          opts: ["Rien de particulier, puisqu’il est expérimenté et connaît déjà bien l’établissement", "Les informations et l’encadrement nécessaires à son activité", "Uniquement un badge d’accès aux locaux, sans information ni encadrement", "Uniquement un guide de visite des locaux, sans encadrement de son activité"], ok: 1,
          why: "L’équilibre doit être maintenu entre les personnels permanents et les personnels de remplacement qui ne connaissent pas l’établissement. Ces informations et cet encadrement s’offrent dans des conditions de qualité et de sécurité des soins.", src: "Fiche HAS ressources p. 4 · critère 3.2-01" },
        { id: "EQU-005", theme: "equipes", q: "Que permet la simulation en santé ?",
          opts: ["Seulement de jouer à des jeux vidéo pour se divertir pendant les pauses de l’équipe", "S’entraîner à des gestes, des procédures et au travail en équipe", "Remplacer tout stage, y compris les stages réalisés auprès des patients", "Évaluer uniquement les médecins, à l’exclusion des autres professionnels"], ok: 1,
          why: "C’est une méthode de formation, mais aussi d’évaluation des pratiques et de gestion des risques, conforme au guide HAS de simulation en santé. Elle permet aussi de s’entraîner au raisonnement clinique et de reproduire des événements indésirables ou des situations exceptionnelles.", src: "Fiche HAS ressources pp. 3 et 5 · critère 3.2-04" },
        { id: "EQU-006", theme: "equipes", q: "Quelle est la fréquence attendue pour l’entretien annuel d’un professionnel avec son encadrement ?",
          opts: ["Tous les 5 ans", "Une fois par an, pour évaluer les compétences", "Seulement en cas de problème constaté par l’encadrement", "Jamais, l’entretien n’est pas prévu pour les professionnels en poste"], ok: 1,
          why: "À défaut d’adéquation, l’encadrement met en œuvre les actions requises (formation, développement professionnel continu) et dispose d’un bilan annuel des formations de son équipe. Il évalue aussi l’adéquation des compétences avec les missions.", src: "Fiche HAS ressources p. 5 · critère 3.2-03" },
        { id: "EQU-007", theme: "equipes", q: "Quelle information doit avoir reçu chaque professionnel à propos des événements indésirables ?",
          opts: ["Aucune, la déclaration relève uniquement de l’encadrement du service", "Son devoir éthique, déontologique et professionnel de les déclarer", "Uniquement les sanctions possibles en cas d’oubli de déclaration d’un évènement", "Uniquement les statistiques de déclaration de l’établissement"], ok: 1,
          why: "Cette information fait partie des attendus de la maîtrise des compétences. Elle est reliée à la culture de déclaration. Le professionnel reçoit aussi les modalités de déclaration.", src: "Fiche HAS ressources p. 5 · critères 3.2-03, 3.1-02" }
      ]
    },
    eq2: {
      th: "equipes", title: "Vie au travail et sécurité des professionnels",
      questions: [
        { id: "EQU-008", theme: "equipes", q: "Qu’est-ce qu’une équipe au sens de la certification ?",
          opts: ["Un groupe de professionnels réunis par hasard dans un même service, sans projet commun ni objectif partagé", "Des professionnels aux compétences complémentaires, autour d’un projet centré sur le patient", "Uniquement les médecins d’un service, qui décident seuls de l’organisation des soins", "Uniquement les soignants de nuit, regroupés autour de leurs propres pratiques"], ok: 1,
          why: "L’équipe décline sur le terrain la politique qualité-sécurité des soins de l’établissement. Le travail en équipe agit directement sur la qualité de vie au travail et la qualité des soins. Les professionnels sont engagés autour d’un projet commun.", src: "Fiche HAS ressources p. 2 · critère 3.2-11" },
        { id: "EQU-009", theme: "equipes", q: "Comment la politique de qualité de vie au travail doit-elle être construite ?",
          opts: ["Par la direction seule, qui fixe les mesures sans consulter les professionnels", "À partir d’un diagnostic du terrain, avec les professionnels et leurs représentants", "À partir d’un modèle national appliqué tel quel, sans adaptation au terrain", "Sans évaluation ni ajustement, une fois la politique fixée"], ok: 1,
          why: "Exemples de diagnostic : baromètre social, enquêtes, analyse d’événements indésirables. Indicateurs : absentéisme, turnover, arrêts maladie. Elle est évaluée et ajustée. La politique comporte des objectifs mesurables et des indicateurs.", src: "Fiche HAS ressources p. 7 · critère 3.2-08" },
        { id: "EQU-010", theme: "equipes", q: "Quels espaces doivent exister pour les professionnels ?",
          opts: ["Aucun, les échanges sur le travail se font hors de l’établissement", "Des espaces d’expression de proximité sur leur expérience de travail", "Uniquement une boîte à idées annuelle, relevée par la direction pour les suggestions", "Uniquement des réunions de direction, réservées à l’encadrement"], ok: 1,
          why: "Les professionnels participent à la mise en œuvre de solutions pour améliorer ce qui altère la réalisation du travail, comme la charge de travail. Ces espaces permettent aussi de proposer des solutions.", src: "Fiche HAS ressources p. 7 · critères 3.2-08, 3.2-11" },
        { id: "EQU-011", theme: "equipes", q: "Quelle vaccination est obligatoire pour les professionnels de santé ?",
          opts: ["La vaccination contre la coqueluche", "L’hépatite B", "La grippe saisonnière", "La varicelle"], ok: 1,
          why: "L’hépatite B est obligatoire ; coqueluche, rougeole, varicelle, grippe saisonnière et Covid-19 sont recommandées. Le service de santé au travail et l’EOH participent aux modalités.", src: "Fiche HAS ressources p. 6 · critère 3.2-06" },
        { id: "EQU-012", theme: "equipes", q: "Qu’est-ce que le document unique d’évaluation des risques professionnels ?",
          opts: ["Le dossier patient, qui recense les soins délivrés", "Le document qui recense les risques professionnels", "Le planning des gardes et des astreintes des médecins", "Le règlement intérieur de l’établissement fixant les règles de vie"], ok: 1,
          why: "Les actions de prévention des risques professionnels y sont suivies. Les risques prioritaires nourrissent la politique de qualité de vie au travail. Il recense les risques physiques et psychosociaux ainsi que les actions de prévention.", src: "Fiche HAS ressources pp. 6-7 · critères 3.2-06, 3.2-08" },
        { id: "EQU-013", theme: "equipes", q: "Quel soutien est proposé à un professionnel affecté par un événement indésirable grave ?",
          opts: ["Aucun", "Un dispositif d’écoute et d’accompagnement", "Une sanction automatique", "Un changement de service obligatoire"], ok: 1,
          why: "Le professionnel est aussi informé de l’existence de ces dispositifs. Un professionnel en souffrance est plus à risque d’erreur. Ce soutien est un soutien psychologique.", src: "Fiche HAS ressources p. 6 · critère 3.2-06" },
        { id: "EQU-014", theme: "equipes", q: "Pour la prévention des violences sexistes et sexuelles entre professionnels, que doit-on retenir ?",
          opts: ["Ce n’est pas du ressort de l’établissement, les professionnels réglant ces situations entre eux", "Une politique active de prévention, de repérage, de signalement et de traitement", "Seules les victimes doivent agir, l’établissement n’intervenant qu’en cas de plainte", "Il suffit d’afficher une charte, sans dispositif de signalement ni suivi des situations"], ok: 1,
          why: "La fiche renvoie à une fiche pédagogique dédiée. Les managers sont aussi formés à la prévention et à la gestion du harcèlement, des violences sexistes et sexuelles et de la discrimination. L’établissement met cette politique en œuvre ; il s’agit du critère impératif 3.2-12.", src: "Fiche HAS ressources pp. 3 et 6 · critère 3.2-12" }
      ]
    },
    eq3: {
      th: "equipes", title: "Violences sexistes et sexuelles entre professionnels",
      questions: [
        { id: "EQU-015", theme: "equipes", q: "Quelles situations relèvent du « sexisme d’atmosphère » ?",
          opts: ["Regards insistants, messages sexuellement explicites ou remarques sexistes", "Uniquement les agressions physiques, à l’exclusion de toute parole ou attitude", "Uniquement les licenciements, décidés par la direction de l’établissement", "Uniquement les refus de congé, opposés par l’encadrement de l’équipe"], ok: 0,
          why: "Les violences sexistes créent un environnement de travail intimidant, hostile, dégradant, humiliant ou offensant. Aucun propos ou comportement sexiste ou sexuel n’est acceptable au regard des habitudes professionnelles ou des rapports hiérarchiques. Les images et les plaisanteries sexistes en relèvent aussi.", src: "Fiche HAS VSS p. 2 · critère 3.2-12" },
        { id: "EQU-016", theme: "equipes", q: "Quelles caractéristiques doit avoir un dispositif de signalement des violences sexistes et sexuelles ?",
          opts: ["Accessible, opérationnel, fiable et confidentiel", "Réservé aux cadres et à la direction de l’établissement", "Anonyme et sans suite donnée aux signalements reçus", "Verbal uniquement, sans aucune trace écrite"], ok: 0,
          why: "Accessible (connu, facile d’usage), opérationnel (référents identifiés, procédure), fiable (réponse systématique, suivi, traces) et confidentiel (protection de l’identité du déclarant, victime ou témoin).", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { id: "EQU-017", theme: "equipes", q: "Qui peut signaler une situation de violences sexistes et sexuelles ?",
          opts: ["Uniquement la victime elle-même", "La victime ou un témoin", "Uniquement un cadre de proximité", "Uniquement la médecine du travail"], ok: 1,
          why: "Les professionnels doivent savoir qu’un dispositif existe et connaître ses modalités d’utilisation, en cas de besoin.", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { id: "EQU-018", theme: "equipes", q: "Dans un établissement public, qui est le référent pour les situations de harcèlement ?",
          opts: ["Le référent égalité", "Le médecin du travail uniquement", "Le directeur des achats", "Le pharmacien"], ok: 0,
          why: "Dans le privé (plus de 11 salariés), c’est un référent harcèlement. D’autres acteurs peuvent intervenir : RH, médecine du travail, direction, syndicats, inspection du travail, ordres professionnels, instituts de formation ou université pour les étudiants.", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { id: "EQU-019", theme: "equipes", q: "Un étudiant ou un stagiaire est victime de violences sexistes ou sexuelles. Que doit faire l’établissement ?",
          opts: ["Ne rien faire, car il n’est pas salarié et que la situation relève exclusivement de son institut de formation", "Gérer la situation avec l’université ou l’institut de formation, pour protéger la personne", "Mettre fin au stage sans discussion, pour éloigner l’étudiant de la situation", "Attendre la fin de l’année avant d’en parler à l’institut de formation"], ok: 1,
          why: "La coordination avec l’institut de formation ou le CHU de rattachement (pour les internes) assure la protection de la personne et un soutien spécifique. La gestion vise aussi à prévenir la récurrence.", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { id: "EQU-020", theme: "equipes", q: "Quel accompagnement doit être proposé à une victime ?",
          opts: ["Aucun tant qu’il n’y a pas de plainte, l’établissement attendant une procédure formelle", "Un dispositif mobilisable dès les premiers signes, avec écoute et orientation", "Un seul entretien, sans suivi ni soutien dans la durée", "Un changement de service imposé, pour éloigner la victime de la situation"], ok: 1,
          why: "Les personnes missionnées savent écouter, accompagner et orienter. L’établissement peut aussi orienter vers un soutien externe, par exemple France victimes ou le CIDFF. Le soutien est effectif, tracé et activé dans la durée.", src: "Fiche HAS VSS p. 4 · critère 3.2-12" },
        { id: "EQU-021", theme: "equipes", q: "Que doit-il y avoir dans le plan de formation de l’établissement ?",
          opts: ["Rien sur les VSS", "Un axe sur la prévention et la prise en charge des VSS", "Seulement une affiche", "Uniquement une formation pour les médecins"], ok: 1,
          why: "Dans la fonction publique hospitalière, la formation de l’ensemble des professionnels est obligatoire et doit être effectuée pour 2027. Tous les professionnels, étudiants et nouveaux arrivants sont visés au minimum par une sensibilisation. La priorité est donnée à la formation des managers.", src: "Fiche HAS VSS p. 4 · critère 3.2-12" },
        { id: "EQU-022", theme: "equipes", q: "Que contient le bilan annuel présenté aux instances ?",
          opts: ["Les noms des personnes signalées et le détail de chaque situation traitée", "Les signalements reçus, de manière anonymisée, et les suites données", "Uniquement le budget consacré à la prévention dans l’établissement", "Rien, il est confidentiel et ne sort pas de la direction"], ok: 1,
          why: "Nombre de signalements, délai moyen de traitement, procédures disciplinaires, plaintes pénales, entretiens de recadrage. Le bilan aborde aussi les violences faites aux patients (critère 1.1-06). Il comprend aussi les actions de formation et les mesures d’accompagnement.", src: "Fiche HAS VSS p. 5 · critère 3.2-12" }
      ]
    },
    douleur1: {
      th: "douleur", title: "Définitions et types de douleur",
      questions: [
        { id: "DOU-001", theme: "douleur", q: "Selon l’IASP, à partir de quelle durée une douleur est-elle dite chronique ?",
          opts: ["Plus d’1 mois", "Plus de 6 semaines", "Plus de 3 mois", "Plus d’1 an"], ok: 2,
          why: "Une douleur chronique persiste ou se reproduit plus de 3 mois. La douleur aiguë dure en général moins de 6 semaines chez l’adulte.", src: "Fiche HAS Douleur p. 2 · critère 1.1-05" },
        { id: "DOU-002", theme: "douleur", q: "Une douleur ne répond pas aux traitements habituels bien conduits. Que faire ?",
          opts: ["Augmenter les doses jusqu’au soulagement", "Contacter une structure spécialisée (CLUD, centre de la douleur)", "Conclure qu’elle est psychogène et arrêter les traitements antalgiques", "Attendre la fin de l’hospitalisation pour réévaluer la prise en charge"], ok: 1,
          why: "C’est une douleur rebelle. Des solutions existent souvent, avec une prise en charge pluriprofessionnelle. Les professionnels doivent savoir qui contacter.", src: "Fiche HAS Douleur p. 2 et 4 · critère 1.1-05" },
        { id: "DOU-003", theme: "douleur", q: "Un patient ne peut pas s’exprimer verbalement. Peut-il ressentir de la douleur ?",
          opts: ["Non, sans plainte il n’y a pas de douleur", "Oui : l’incapacité à communiquer n’exclut pas la douleur", "Seulement s’il est âgé", "Seulement si un proche le confirme"], ok: 1,
          why: "La description verbale n’est qu’un des comportements d’expression de la douleur. Les équipes observent aussi les attitudes et signes algiques.", src: "Fiche HAS Douleur p. 2-3 · critère 1.1-05" },
        { id: "DOU-004", theme: "douleur", q: "Pansements, pose de sonde, mobilisation : que fait-on des situations qui provoquent une douleur liée aux soins ?",
          opts: ["On les considère comme inévitables", "On les identifie pour mettre en place des protocoles de prévention", "On les traite seulement si le patient le demande", "On les signale uniquement au médecin"], ok: 1,
          why: "Ces situations sont anticipées, par exemple par une prise d’antalgique avant le soin.", src: "Fiche HAS Douleur p. 2-3 · critère 1.1-05" }
      ]
    },
    douleur2: {
      th: "douleur", title: "Évaluer la douleur",
      questions: [
        { id: "DOU-005", theme: "douleur", q: "Quand évalue-t-on l’intensité de la douleur pour la première fois ?",
          opts: ["Dès l’arrivée du patient", "Après 24 heures", "À la première plainte", "Avant la sortie"], ok: 0,
          why: "Dès l’arrivée, avec une échelle validée adaptée à l’âge et à l’état cognitif, et l’évaluation est tracée dans le dossier.", src: "Fiche HAS Douleur p. 3 · critère 1.1-05" },
        { id: "DOU-006", theme: "douleur", q: "Quel type d’échelle pour un patient qui ne peut pas s’auto-évaluer ?",
          opts: ["Une échelle visuelle analogique", "Une échelle comportementale (hétéro-évaluation)", "Aucune échelle, le jugement suffit", "Une échelle verbale simple"], ok: 1,
          why: "L’échelle doit être adaptée à l’âge et à l’état cognitif. Pour un patient non communicant, on observe son comportement. Par exemple Algoplus.", src: "Fiche HAS Douleur p. 3 · critère 1.1-05" },
        { id: "DOU-007", theme: "douleur", q: "Au-delà de l’intensité, qu’évalue-t-on aussi ?",
          opts: ["La fréquence et la chronicité, et on recherche la cause", "Uniquement le moment de la journée où la douleur apparaît, sans chercher la cause", "La satisfaction du patient vis-à-vis de l’équipe, sans rechercher la cause", "Le coût du traitement antalgique prescrit pour le patient"], ok: 0,
          why: "On recherche aussi la cause (lésionnelle, psychogène…), on informe et on rassure le patient.", src: "Fiche HAS Douleur p. 3 · critère 1.1-05" },
        { id: "DOU-008", theme: "douleur", q: "Lors de l’examen somatique d’un patient hospitalisé en psychiatrie, que dit le référentiel de la douleur ?",
          opts: ["Elle est évaluée seulement si le patient est calme", "Une attention particulière lui est portée quel que soit l’état du patient", "Elle ne concerne pas la psychiatrie", "Elle est évaluée uniquement par le psychiatre"], ok: 1,
          why: "La douleur est mesurée et tracée lors de l’examen et du suivi somatique.", src: "Fiche HAS Douleur p. 3 et 6 · critère 2.1-12" }
      ]
    },
    douleur3: {
      th: "douleur", title: "Prendre en charge et réévaluer",
      questions: [
        { id: "DOU-009", theme: "douleur", q: "Que doit comporter une prescription conditionnelle d’antalgique ?",
          opts: ["Une valeur seuil qui déclenche l’administration", "Le nom de l’infirmier qui administrera", "Seulement la dose maximale", "Aucune précision"], ok: 0,
          why: "Une prescription conditionnelle est à dose variable selon l’évaluation d’un ou plusieurs paramètres. Les experts-visiteurs demandent comment le seuil est mentionné.", src: "Fiche HAS Douleur p. 4 et 6 · critère 2.2-02" },
        { id: "DOU-010", theme: "douleur", q: "Prescription conditionnelle : le seuil n’est pas atteint, donc pas d’administration. Faut-il tracer la non-administration ?",
          opts: ["Oui, toujours : chaque non-administration doit être tracée avec son motif", "Non : l’évaluation sous le seuil suffit à la justifier"], ok: 1,
          why: "Il est inutile de tracer la non-administration, mais l’évaluation de la douleur doit être tracée.", src: "Fiche HAS Douleur p. 4 · critère 2.2-02" },
        { id: "DOU-011", theme: "douleur", q: "La douleur persiste malgré le traitement. Que fait l’équipe ?",
          opts: ["Elle attend le prochain tour pour reprendre le même traitement sans le modifier", "Elle réévalue l’intensité, adapte le traitement et réinterroge la cause", "Elle arrête les antalgiques, la douleur étant jugée résistante au traitement", "Elle considère que le patient exagère et ne trace pas de nouvelle évaluation"], ok: 1,
          why: "Les réévaluations sont tracées dans le dossier. L’efficacité des traitements est objectivée par la réévaluation.", src: "Fiche HAS Douleur p. 4 · critère 1.1-05" },
        { id: "DOU-012", theme: "douleur", q: "Lequel de ces moyens est un traitement non médicamenteux de la douleur cité par la HAS ?",
          opts: ["Le tramadol", "L’hypnose", "La morphine", "Le paracétamol"], ok: 1,
          why: "Parmi les exemples : musicothérapie, hypnose, relaxation, cryothérapie, thermothérapie, toucher relationnel, réalité virtuelle. À proposer quand c’est pertinent et possible.", src: "Fiche HAS Douleur p. 4 · critère 1.3-03" }
      ]
    },
    identito1: {
      th: "identito", title: "Vérifier l’identité du patient",
      questions: [
        { id: "IDE-001", theme: "identito", q: "Comment vérifie-t-on l’identité d’un patient capable de répondre ?",
          opts: ["En se fiant au numéro de lit", "En lui demandant de décliner lui-même nom, prénom et date de naissance", "En lui demandant simplement « Vous êtes bien Madame Martin ? » pour confirmer", "En lisant le nom inscrit sur la porte de la chambre"], ok: 1,
          why: "La question ouverte évite les erreurs par acquiescement : c’est le patient qui donne son identité, on ne la lui suggère pas. La question est ouverte.", src: "Mémo CertiF p. 18 · critère 2.2-01" },
        { id: "IDE-002", theme: "identito", q: "Que signifie INS ?",
          opts: ["Identifiant Numérique du Séjour", "Information Nominative Sécurisée", "Identité Nationale de Santé", "Indice National de Soins"], ok: 2,
          why: "L’INS est l’identifiant unique et officiel attribué à chaque patient à partir de son état civil (nom, prénom, date de naissance, sexe, lieu de naissance).", src: "Mémo CertiF p. 18 · critère 2.2-01" },
        { id: "IDE-003", theme: "identito", q: "À quoi sert l’INS ?",
          opts: ["À facturer les séjours", "À remplacer le bracelet d’identification", "À attribuer un numéro de chambre", "À rattacher les données de santé au bon patient"], ok: 3,
          why: "Il permet de sécuriser la prise en charge. Les documents comportant une INS qualifiée se retrouvent dans le DMP du patient.", src: "Mémo CertiF p. 18 · critère 2.2-01" },
        { id: "IDE-004", theme: "identito", q: "Quels patients doivent porter un bracelet d’identification ?",
          opts: ["Tout patient hospitalisé, y compris en HDJ et ambulatoire", "Uniquement les patients désorientés, les plus exposés aux erreurs d’identité", "Seuls les patients de chirurgie hospitalisés", "Uniquement ceux qui le demandent"], ok: 0,
          why: "Tout patient hospitalisé doit être porteur d’un bracelet d’identification, y compris en HDJ et en ambulatoire.", src: "Mémo CertiF p. 17 · critère 2.2-01" },
        { id: "IDE-005", theme: "identito", q: "Un patient refuse le bracelet d’identification. Que fait-on ?",
          opts: ["On colle le bracelet sur le pied du lit du patient", "Son refus est tracé dans son dossier", "On le pose pendant qu’il dort", "On renonce sans rien noter"], ok: 1,
          why: "En cas de refus, il doit être tracé dans le dossier. La procédure de vérification de l’identité et de pose du bracelet est disponible dans la gestion documentaire.", src: "Mémo CertiF p. 17 · critère 2.2-01" },
        { id: "IDE-006", theme: "identito", q: "Quelle vigilance sanitaire concerne les anomalies d’identité ?",
          opts: ["La pharmacovigilance", "L’hémovigilance", "L’identitovigilance", "La matériovigilance"], ok: 2,
          why: "L’identitovigilance concerne les anomalies d’identité. Elle fait partie des vigilances sanitaires que les professionnels doivent connaître.", src: "Mémo CertiF p. 18 · critère 2.2-01" },
        { id: "IDE-007", theme: "identito", q: "Où retrouve-t-on les documents comportant une INS qualifiée ?",
          opts: ["Uniquement dans le dossier papier du service", "Dans le dossier du médecin traitant seulement", "Nulle part : l’INS n’apparaît pas sur les documents", "Dans le DMP du patient"], ok: 3,
          why: "Les documents comportant une INS (identité qualifiée et sécurisée) se retrouvent dans le DMP du patient, et sont disponibles dans Mon espace santé.", src: "Mémo CertiF p. 18 · critère 2.2-01" }
      ]
    },
    bien1: {
      th: "bientraitance", title: "Contention et maltraitance",
      questions: [
        { id: "BIE-001", theme: "bientraitance", q: "L’utilisation de 2 barrières (ou 4 demi-barrières) de lit est considérée comme…",
          opts: ["Une pratique interdite en toutes circonstances", "Une privation de liberté (droit d’aller et venir)", "Une simple mesure de confort pour le patient, sans incidence sur sa liberté", "Une mesure de sécurité sans formalité particulière ni prescription"], ok: 1,
          why: "Des barrières de lit bilatérales sont considérées comme une contention, donc une privation de la liberté d’aller et venir.", src: "Mémo CertiF p. 23 · critère 1.1-06" },
        { id: "BIE-002", theme: "bientraitance", q: "En cas de nécessité, que faut-il pour recourir à la contention mécanique ?",
          opts: ["L’accord oral de la famille uniquement", "Rien, si elle est temporaire et de courte durée", "Une prescription médicale", "L’avis de l’aide-soignant du poste"], ok: 2,
          why: "La contention mécanique doit faire l’objet d’une prescription médicale.", src: "Mémo CertiF p. 23 · critère 1.1-06" },
        { id: "BIE-003", theme: "bientraitance", q: "Pour quelles raisons peut-on, sans le vouloir, avoir des pratiques non respectueuses de la bientraitance ?",
          opts: ["Un excès de temps disponible auprès des patients et de l’équipe", "Un trop grand nombre de formations suivies par les soignants", "Une absence de patients dépendants dans le service", "Sous-effectifs, turnover, manque de moyens ou de matériel"], ok: 3,
          why: "La maltraitance institutionnelle est le plus souvent liée à l’organisation et aux moyens, d’où l’intérêt de la repérer et d’en parler en équipe.", src: "Mémo CertiF p. 24 · critère 1.1-06" },
        { id: "BIE-004", theme: "bientraitance", q: "Pour quels patients repère-t-on la maltraitance familiale à l’entrée ?",
          opts: ["Pour tous les patients", "Seulement les patients isolés, sans famille proche", "Les patients désorientés exclusivement", "Uniquement ceux qui se plaignent"], ok: 0,
          why: "Le repérage concerne tous les patients, et pas seulement ceux qui paraissent à risque.", src: "Mémo CertiF p. 24 · critère 1.1-07" },
        { id: "BIE-005", theme: "bientraitance", q: "Comment détecte-t-on une maltraitance familiale ?",
          opts: ["Uniquement lors de la visite d’un proche", "Par les questions posées à l’entrée, ou au cours d’un soin ou d’une toilette", "Uniquement par le signalement d’un voisin de chambre", "On ne peut pas la détecter à l’hôpital"], ok: 1,
          why: "Le repérage s’appuie sur les questions de l’entrée et sur l’observation lors des soins, notamment la toilette. Les questions posées à l’entrée sont tracées dans le dossier.", src: "Mémo CertiF p. 24 · critère 1.1-07" },
        { id: "BIE-006", theme: "bientraitance", q: "Vous suspectez une situation de maltraitance. Que faites-vous ?",
          opts: ["J’en parle uniquement au patient, sans en informer l’équipe ni le médecin", "J’interroge d’abord la personne suspectée avant d’en parler à quiconque dans l’équipe", "Je note la cible dans le dossier informatisé et j’appelle le médecin et l’assistante sociale", "J’attends de voir si cela se reproduit avant de prévenir qui que ce soit"], ok: 2,
          why: "La situation est tracée dans le dossier du patient, puis le médecin et l’assistante sociale sont sollicités.", src: "Mémo CertiF p. 24 · critère 1.1-07" }
      ]
    },
    trans1: {
      th: "transfusion", title: "Sécuriser la transfusion de PSL",
      questions: [
        { id: "TRA-001", theme: "transfusion", q: "Sur quoi repose la décision de prescrire une transfusion ?",
          opts: ["Sur la disponibilité des poches dans l’établissement", "Sur une analyse bénéfices/risques", "Sur le seul taux d’hémoglobine mesuré avant la transfusion", "Sur la demande de la famille, sans critère clinique ni biologique"], ok: 1,
          why: "La prescription d’un acte transfusionnel s’appuie sur une analyse bénéfices/risques évaluée selon les critères cliniques et biologiques. Cette analyse est évaluée selon des critères cliniques et biologiques.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-002", theme: "transfusion", q: "Comment informe-t-on le patient avant une transfusion ?",
          opts: ["Une signature sur un formulaire, sans explication orale ni fiche d’information", "Il est informé après la transfusion, au moment de son retour dans le service", "Information orale et fiche d’information dont la remise est tracée", "Une information orale seulement, sans fiche d’information ni trace écrite dans le dossier"], ok: 2,
          why: "Si le patient refuse, son refus est tracé dans le dossier. L’information orale porte sur les bénéfices et les risques.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-003", theme: "transfusion", q: "Quand commande-t-on le PSL au dépôt ?",
          opts: ["Dès la prescription, pour gagner du temps", "La veille, pour être sûr de l’avoir", "On garde une réserve dans le service", "Quand le patient est prêt à être transfusé"], ok: 3,
          why: "Le PSL ne doit pas être entreposé avant la transfusion : la commande est faite quand on est prêt à transfuser.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-004", theme: "transfusion", q: "Que contrôle-t-on à la réception d’un PSL ?",
          opts: ["Le colis, le PSL et l’identité (patient, prescription, délivrance)", "Uniquement la température du colis et son aspect extérieur à l’arrivée", "Uniquement le nom du patient inscrit sur l’étiquette du colis", "Rien : le dépôt a déjà tout contrôlé avant l’envoi du colis"], ok: 0,
          why: "La traçabilité se fait sur la feuille de contrôle à réception. On contrôle le colis (intégrité, hygiène, délai) et le PSL (nature, péremption, intégrité).", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-005", theme: "transfusion", q: "Quel contrôle est réalisé juste avant de transfuser ?",
          opts: ["Un contrôle par le laboratoire seul", "Au pied du lit, le contrôle ultime de compatibilité ABO", "Un coup d’œil à l’étiquette au poste de soins", "Aucun si la prescription est claire"], ok: 1,
          why: "Le contrôle ultime pré-transfusionnel (CUPT) se fait au pied du lit. Il comprend la concordance des documents.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-006", theme: "transfusion", q: "Comment surveille-t-on le patient pendant la transfusion ?",
          opts: ["Uniquement en fin de transfusion, quand la poche est vide", "Une surveillance toutes les 6 heures, sans présence auprès du patient au début", "Constantes avant, présence les 15 premières minutes, puis surveillance régulière ; après, jusqu’à 2 heures", "Aucune surveillance particulière tant que le patient ne signale pas de symptômes, et rien après"], ok: 2,
          why: "La surveillance est tracée à chaque étape. La présence auprès du patient est demandée les 15 premières minutes.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-007", theme: "transfusion", q: "Réaction transfusionnelle immédiate : quel est le premier réflexe ?",
          opts: ["Je ralentis le débit et j’observe l’évolution du patient avant de prévenir quiconque", "Je retire la voie veineuse dès les premiers signes, puis j’appelle le médecin", "J’attends la fin de la poche avant d’alerter le médecin", "J’arrête la transfusion, je garde la voie et j’alerte le médecin"], ok: 3,
          why: "La conduite à tenir est décrite dans les procédures d’effets indésirables transfusionnels. Je contacte aussi le dépôt de sang.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-008", theme: "transfusion", q: "Après un incident transfusionnel, une fois le patient stabilisé, que fait-on ?",
          opts: ["Fiche de déclaration, retour des produits au dépôt, traçabilité dans le dossier", "Rien si le patient va mieux et que ses constantes sont stabilisées, l’incident n’est pas déclaré", "On jette les poches sans les conserver, puis on note l’incident dans le dossier", "On informe seulement la famille, sans déclaration ni retour des produits"], ok: 0,
          why: "L’incident est déclaré (fiche simplifiée de déclaration d’incident transfusionnel, déclaration dans la GED) et tracé dans le dossier. Les produits transfusés sont retournés au dépôt et la traçabilité se fait dans le dossier transfusionnel.", src: "Mémo CertiF p. 28 · critère 2.2-11" },
        { id: "TRA-009", theme: "transfusion", q: "Quelle vigilance sanitaire concerne les produits sanguins labiles ?",
          opts: ["La radioprotection", "L’hémovigilance", "La matériovigilance", "La pharmacovigilance"], ok: 1,
          why: "L’hémovigilance concerne les produits sanguins labiles.", src: "Mémo CertiF p. 18 · critère 2.2-11" },
        { id: "TRA-010", theme: "transfusion", q: "Comment la transfusion est-elle évaluée lors de la visite de certification ?",
          opts: ["Uniquement par un questionnaire de satisfaction", "Uniquement sur dossier papier", "Par un traceur ciblé dédié", "Elle n’est pas évaluée"], ok: 2,
          why: "Les PSL sont encadrés par des protocoles stricts et font l’objet d’une évaluation dédiée (traceur ciblé).", src: "Mémo CertiF p. 27 · critère 2.2-11" }
      ]
    },
    dig2: {
      th: "dignite", title: "Respecter l’intimité au quotidien",
      questions: [
        { id: "DIG-006", theme: "dignite", q: "Lors de la visite, quelles observations peuvent porter sur la dignité des patients ?",
          opts: ["Uniquement les horaires de visite et leur affichage à l’entrée du service", "Portes de chambre fermées, paravents, nudité, attitude des professionnels", "La seule propreté des couloirs et des parties communes du service", "Seulement la tenue du personnel pendant la visite, hors situation de soin"], ok: 1,
          why: "Les experts-visiteurs observent les pratiques en situation, pas seulement les documents. Le bracelet d’identité fait aussi partie de ces observations.", src: "Mémo CertiF p. 9 · critère 1.1-01" },
        { id: "DIG-007", theme: "dignite", q: "Que fait-on avant d’entrer dans une chambre ?",
          opts: ["On ne frappe que la nuit", "On ouvre la porte pour demander la permission", "On frappe à la porte avant d’entrer", "On entre directement si l’on est pressé"], ok: 2,
          why: "Frapper avant d’entrer est un geste de respect de l’intimité du patient, observé lors de la visite.", src: "Mémo CertiF p. 9 · critère 1.1-01" },
        { id: "DIG-008", theme: "dignite", q: "Quelle attitude est à proscrire lors d’un soin ?",
          opts: ["Se présenter au patient avant de commencer le soin", "Lui expliquer le soin avant et pendant sa réalisation", "Fermer la porte et le paravent pendant la toilette pour préserver l’intimité du patient", "Discuter entre professionnels comme si le patient n’était pas là"], ok: 3,
          why: "Le patient doit rester un interlocuteur à part entière tout au long du soin.", src: "Mémo CertiF p. 9 · critère 1.1-01" },
        { id: "DIG-009", theme: "dignite", q: "Quels moyens permettent de préserver l’intimité pendant un soin ?",
          opts: ["Porte fermée, paravent, nudité limitée au strict nécessaire", "Laisser la porte ouverte pour surveiller", "Réaliser le soin en présence des proches sans demander l’avis du patient", "Laisser le patient découvert pendant l’attente"], ok: 0,
          why: "Ces mesures font partie des observations réalisées lors du passage des experts-visiteurs.", src: "Mémo CertiF p. 9 · critère 1.1-01" }
      ]
    },
    cyber2: {
      th: "cyber", title: "Réflexes face aux risques numériques",
      questions: [
        { id: "CYB-006", theme: "cyber", q: "Que faire face à un mail inconnu avec une pièce jointe ou un lien ?",
          opts: ["Cliquer sur le lien en cas d’alerte informatique", "Ne pas l’ouvrir et signaler tout mail indésirable", "L’ouvrir pour vérifier ce qu’il contient", "Le transférer à un collègue"], ok: 1,
          why: "Les mails inconnus, pièces jointes et liens sont une porte d’entrée classique des cyberattaques.", src: "Mémo CertiF p. 20 · critère 3.1-07" },
        { id: "CYB-007", theme: "cyber", q: "Quelle bonne pratique concerne le mot de passe ?",
          opts: ["Le noter sur le poste de soins", "Utiliser le même partout", "Le changer régulièrement", "Le partager avec l’équipe"], ok: 2,
          why: "Le changement régulier du mot de passe fait partie des conduites à tenir pour prévenir les risques numériques.", src: "Mémo CertiF p. 20 · critère 3.1-08" },
        { id: "CYB-008", theme: "cyber", q: "Que doit-on faire des codes et identifiants génériques ?",
          opts: ["Les afficher près du poste pour faciliter l’accès des remplaçants et des intérimaires", "Les écrire sur le poste de soins afin que toute l’équipe les retrouve", "Les donner oralement à chaque intérimaire sans les consigner nulle part", "Les rendre non visibles et/ou les ranger dans un classeur prévu à cet effet"], ok: 3,
          why: "Une vigilance particulière est à apporter aux codes et identifiants génériques laissés à la visibilité de tous (intérimaire, vacataire).", src: "Mémo CertiF p. 19 · critère 3.1-08" },
        { id: "CYB-009", theme: "cyber", q: "Vous suspectez une cyberattaque. Quelle conduite est correcte ?",
          opts: ["N’éteignez pas votre poste et ne branchez aucune clé USB, sauf demande de la DSI", "Éteindre immédiatement tous les postes du service afin de stopper la propagation du virus", "Brancher une clé USB pour sauvegarder les données avant que le poste ne soit bloqué", "Redémarrer le poste plusieurs fois pour tenter de supprimer l’intrusion"], ok: 0,
          why: "Éteindre le poste risque d’effacer des preuves numériques ; une clé USB ou un disque dur peut propager le virus. Il ne faut pas non plus allumer les postes éteints, sauf demande de la DSI.", src: "Mémo CertiF p. 20 · critère 3.1-07" },
        { id: "CYB-010", theme: "cyber", q: "Où trouve-t-on les procédures dégradées du dossier patient informatisé ?",
          opts: ["Elles n’existent pas : l’activité de soins s’interrompt tant que la panne dure", "Dans la gestion documentaire de l’établissement (BlueKanGo)", "Dans un classeur rangé dans le tiroir du médecin responsable", "Sur le poste informatique de la direction, accessible à elle seule"], ok: 1,
          why: "Elles permettent de continuer à prendre en charge les patients en cas de panne ou de cyberattaque.", src: "Mémo CertiF p. 20 · critère 3.1-07" },
        { id: "CYB-011", theme: "cyber", q: "Que signifie PCRA ?",
          opts: ["Protocole de Conduite en Réanimation Adulte", "Procédure Centrale de Réponse aux Alertes de sécurité informatique", "Plan de Continuité et de Reprise d’Activité", "Plan de Contrôle des Risques Associés aux logiciels du service"], ok: 2,
          why: "Le PCRA décrit les services essentiels et critiques et les fiches réflexes des logiciels en cas de cyberattaque.", src: "Mémo CertiF p. 20 · critère 3.1-07" }
      ]
    },
    sortie2: {
      th: "sortie", title: "DMP et partage d’informations",
      questions: [
        { id: "SOR-011", theme: "sortie", q: "Qu’est-ce que le DMP ?",
          opts: ["Un annuaire des médecins et des établissements de santé de la région", "Un espace de stockage personnel et sécurisé de données de santé", "Un dossier papier remis au patient à la sortie, sans version numérique", "Le dossier interne du service, accessible aux seuls soignants de l’unité"], ok: 1,
          why: "Le Dossier Médical Partagé doit être alimenté au fil du temps par les professionnels, sauf opposition légitime du patient. Il est alimenté au fur et à mesure par les professionnels.", src: "Mémo CertiF p. 16 · critère 2.1-02" },
        { id: "SOR-012", theme: "sortie", q: "Qu’est-ce que « Mon espace santé » ?",
          opts: ["Un site de prise de rendez-vous privé", "Le dossier interne de l’hôpital, réservé aux soignants", "Le DMP disponible gratuitement en France", "Un service payant proposé par les mutuelles"], ok: 2,
          why: "Mon espace santé donne accès au DMP et aux documents de santé du patient. Il a été mis en place en 2022 par l’Assurance Maladie.", src: "Mémo CertiF p. 16 · critère 2.1-02" },
        { id: "SOR-013", theme: "sortie", q: "Qui peut accéder au DMP d’un patient ?",
          opts: ["Tout agent de l’hôpital, dès lors qu’il travaille dans l’établissement", "Uniquement le médecin traitant, seul habilité à le consulter", "Les employeurs et les assureurs, pour vérifier l’état de santé", "Le patient et les professionnels de santé autorisés par lui"], ok: 3,
          why: "L’accès est limité au patient et aux professionnels qu’il autorise. Ce sont les professionnels de l’équipe de soins.", src: "Mémo CertiF p. 16 · critère 2.1-02" },
        { id: "SOR-014", theme: "sortie", q: "Le patient doit-il consentir à l’alimentation de son DMP ?",
          opts: ["Son consentement est présumé, mais il doit être informé", "Oui, il doit donner son accord par écrit à chaque nouvel ajout de document", "Non, il est inutile de l’informer de l’alimentation de son dossier", "Seulement pour les plus de 75 ans"], ok: 0,
          why: "Le consentement est considéré comme présumé, mais le patient doit être informé.", src: "Mémo CertiF p. 15 · critère 1.2-02" },
        { id: "SOR-015", theme: "sortie", q: "Quels documents verse-t-on dans le DMP ?",
          opts: ["Aucun : le patient le remplit seul, sans intervention des professionnels", "Compte rendu d’hospitalisation, lettre de liaison, ordonnance de sortie", "Uniquement les factures et les justificatifs administratifs de séjour", "Uniquement les photos du patient et ses données d’identité"], ok: 1,
          why: "À adapter à l’activité du service : ce sont les documents utiles à la continuité des soins après la sortie. On y verse aussi les résultats d’examens.", src: "Mémo CertiF p. 16 · critère 2.1-14" },
        { id: "SOR-016", theme: "sortie", q: "Quel moyen sécurisé pour échanger des données de santé avec un correspondant extérieur ?",
          opts: ["Un SMS envoyé sur le téléphone du correspondant", "Une messagerie grand public, dès lors que le correspondant la connaît", "La messagerie sécurisée de santé (MS Santé)", "Un mail personnel du soignant, envoyé depuis son domicile"], ok: 2,
          why: "La MS Santé est utilisée par les professionnels affiliés à un ordre ; un outil de partage peut compléter pour les fichiers trop volumineux.", src: "Mémo CertiF p. 16 · critère 3.3-06" }
      ]
    },
    ei4: {
      th: "ei", title: "Vigilances sanitaires",
      questions: [
        { id: "EIQ-023", theme: "ei", q: "Quelle vigilance concerne l’utilisation des dispositifs médicaux ?",
          opts: ["L’identitovigilance, vigilance relative à l’identité du patient", "La matériovigilance", "La pharmacovigilance, relative aux médicaments", "L’hémovigilance, relative aux produits sanguins labiles"], ok: 1,
          why: "Matériovigilance : dispositifs médicaux. Pharmacovigilance : médicaments. Hémovigilance : produits sanguins labiles.", src: "Mémo CertiF p. 18 · critère 3.1-02" },
        { id: "EIQ-024", theme: "ei", q: "Quelle vigilance concerne les infections associées aux soins ?",
          opts: ["La radioprotection", "La pharmacovigilance", "L’infectiovigilance", "La matériovigilance"], ok: 2,
          why: "Les vigilances sanitaires sont listées dans un tableau des vigilants disponible dans la gestion documentaire et affiché dans les services.", src: "Mémo CertiF p. 18 · critère 3.1-02" },
        { id: "EIQ-025", theme: "ei", q: "Comment signale-t-on une alerte de vigilance ?",
          opts: ["En l’écrivant dans les transmissions uniquement, sans autre démarche de déclaration", "En appelant le service technique", "Il n’est pas nécessaire de la signaler", "Par une fiche d’évènement indésirable (catégorie veille réglementaire)"], ok: 3,
          why: "Pour la transfusion, une fiche simplifiée de déclaration d’incident transfusionnel s’ajoute à la déclaration. Il s’agit d’une fiche de déclaration d’évènement indésirable.", src: "Mémo CertiF p. 18 · critère 3.1-02" },
        { id: "EIQ-026", theme: "ei", q: "Comment êtes-vous informé d’une nouvelle recommandation ou alerte ?",
          opts: ["Via les vigilants ou le cadre de proximité", "Par la presse spécialisée, qui relaie systématiquement les alertes", "Par les familles des patients, qui informent ensuite le service", "Uniquement par affichage dans le couloir du service"], ok: 0,
          why: "Le tableau des vigilants permet de savoir qui contacter pour chaque vigilance.", src: "Mémo CertiF p. 18 · critère 3.1-02" }
      ]
    },
    bien2: {
      th: "bientraitance", title: "La procédure contention de l’UGA/UGO",
      questions: [
        { id: "BIE-007", theme: "bientraitance", q: "Selon la procédure, que recouvre la contention physique ?",
          opts: ["Tout dispositif d’aide à la marche ou au transfert qui favorise la mobilisation volontaire du patient", "Tout moyen qui empêche ou limite la mobilisation volontaire de tout ou partie du corps", "Uniquement les barrières de lit, à l’exclusion de tout autre moyen d’immobilisation", "Uniquement les ceintures posées au lit ou au fauteuil, à l’exclusion des barrières"], ok: 1,
