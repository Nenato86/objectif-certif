          opts: ["La rougeole", "La coqueluche", "Le SARS-CoV-2", "Le VRS"], ok: 0,
          why: "Type B : tuberculose sensible, varicelle-zona (varicelle, zona disséminé) et rougeole.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 · affiche germes B et C" },
        { theme: "hygiene", q: "Quel est le pathogène de type C ?",
          opts: ["La varicelle", "Mycobacterium tuberculosis multi-résistante (MDR) ou ultra-résistante (XDR)", "La tuberculose sensible", "La grippe"], ok: 1,
          why: "Pour un type C, les précautions sont maximales quel que soit le niveau d’exposition.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 et 5" },
        { theme: "hygiene", q: "Qu’est-ce qu’une exposition faible ?",
          opts: ["Toute intubation", "Une visite de la famille", "Un patient qui porte un masque, ou un contact direct de moins de 15 minutes", "Un contact de plus de 15 minutes avec un patient sans masque"], ok: 2,
          why: "L’exposition modérée correspond à un contact direct de plus de 15 minutes avec un patient sans masque, ou à une procédure aérosolisante à risque modéré.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4" },
        { theme: "hygiene", q: "Laquelle de ces procédures génère des aérosols à risque élevé ?",
          opts: ["L’extubation", "La ventilation non invasive", "L’aspiration endotrachéale", "L’intubation"], ok: 3,
          why: "Risque élevé : intubation, réanimation cardio-pulmonaire, ventilation manuelle au masque, fibroscopie bronchique, trachéotomie, induction de crachats, aérosolthérapie.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4 · affiches" },
        { theme: "hygiene", q: "Laquelle de ces procédures génère des aérosols à risque modéré ?",
          opts: ["L’aspiration endotrachéale", "L’intubation", "L’aérosolthérapie", "La fibroscopie bronchique"], ok: 0,
          why: "Risque modéré : extubation, ventilation non invasive, aspiration des voies aériennes, gastroscopie avec aspiration, chirurgie dentaire avec appareil rotatif, procédure ORL proximale avec aspiration.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4 · affiches" },
        { theme: "hygiene", q: "Pathogène de type A et exposition faible : quel niveau de précautions ?",
          opts: ["Précautions renforcées", "Précautions respiratoires simples", "Précautions maximales", "Aucune précaution"], ok: 1,
          why: "Type A et exposition modérée ou forte : précautions renforcées.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 5" },
        { theme: "hygiene", q: "Pathogène de type B et exposition faible ou modérée : quel niveau ?",
          opts: ["Précautions maximales", "Aucune précaution", "Précautions respiratoires renforcées", "Précautions simples"], ok: 2,
          why: "Type B et exposition forte : précautions maximales.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 5" },
        { theme: "hygiene", q: "Quel type de chambre pour des précautions respiratoires ?",
          opts: ["Une chambre double si les patients ont le même germe", "Une chambre ouverte pour surveiller", "Le couloir, avec un paravent", "Une chambre individuelle, porte fermée"], ok: 3,
          why: "La porte fermée fait aussi partie des consignes sur les affiches.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6 · affiches" },
        { theme: "hygiene", q: "Quel masque porte le professionnel en précautions simples ?",
          opts: ["Un masque à usage médical", "Un masque FFP2", "Aucun masque", "Une visière seule"], ok: 0,
          why: "En précautions renforcées et maximales : masque FFP2.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6" },
        { theme: "hygiene", q: "Un patient en précautions maximales sort de sa chambre. Quel masque porte-t-il ?",
          opts: ["Un masque à usage médical", "Un masque FFP2", "Un masque en tissu", "Aucun masque"], ok: 1,
          why: "En précautions renforcées : FFP2, ou à défaut masque à usage médical. En précautions simples : masque à usage médical.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6" },
        { theme: "hygiene", q: "Comment sont organisées les visites en précautions renforcées ?",
          opts: ["Elles sont interdites", "Elles sont réservées à la nuit", "Elles sont limitées et encadrées", "Elles sont libres"], ok: 2,
          why: "Précautions simples : visites autorisées.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6" },
        { theme: "hygiene", q: "Quand réalise-t-on une friction hydroalcoolique en précautions complémentaires respiratoires ?",
          opts: ["Uniquement à la sortie", "Uniquement avant un geste invasif", "Une fois par service", "À l’entrée et à la sortie de la chambre"], ok: 3,
          why: "Cette consigne s’applique aux soignants comme aux visiteurs.", src: "Affiches germe A et germes B et C" },
        { theme: "hygiene", q: "Germe de catégorie A : quand le soignant porte-t-il un masque FFP2 ?",
          opts: ["Patient sans masque, soins de plus de 15 minutes ou procédure générant des aérosols", "Pour tout soin, quelle que soit la situation", "Uniquement la nuit", "Jamais"], ok: 0,
          why: "Pour les soins directs non aérosolisants de moins de 15 minutes, ou si le patient porte lui-même un masque : masque à usage médical.", src: "Affiche germe A" },
        { theme: "hygiene", q: "Un patient en précautions respiratoires doit se rendre à un examen. Que fait-on ?",
          opts: ["On annule systématiquement l’examen", "On prévient le service receveur et le service de brancardage, et le patient porte un masque", "On ne dit rien pour ne pas inquiéter", "Le patient y va sans masque"], ok: 1,
          why: "Un masque à usage médical dès que possible pendant les soins et lors des sorties de chambre ; FFP2 pour les germes B et C.", src: "Affiches germe A et germes B et C" },
        { theme: "hygiene", q: "Quel masque pour un visiteur d’un patient de catégorie B ou C ?",
          opts: ["Un masque en tissu", "Un masque à usage médical", "Un masque FFP2 dès l’entrée dans la chambre", "Aucun masque"], ok: 2,
          why: "Catégorie A : masque à usage médical pour une visite de moins de 15 minutes ou si le patient est masqué, FFP2 dans les autres cas.", src: "Affiches germe A et germes B et C" },
        { theme: "hygiene", q: "Qui contacter pour toute question sur les précautions respiratoires ?",
          opts: ["Le service technique", "La direction des soins uniquement", "Le service des admissions", "L’équipe de prévention du risque infectieux (EPRI / EOH)"], ok: 3,
          why: "Les coordonnées sont sur le diaporama et les affiches du service.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 7" }
      ]
    },
    trans2: {
      th: "transfusion", title: "Le guide transfusionnel de l’hôpital",
      questions: [
        { theme: "transfusion", q: "Quand une carte de groupe sanguin est-elle valide ?",
          opts: ["Quand elle a été remplie par l’infirmière du service", "Quand elle comporte deux déterminations réalisées par le laboratoire de l’hôpital ou d’un établissement de référence (EFS, CNRHP)", "Dès qu’elle comporte une seule détermination", "Quand le patient la présente, quelle que soit son origine"], ok: 1,
          why: "Toute autre carte est refusée, sauf en cas d’urgence vitale immédiate.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-2" },
        { theme: "transfusion", q: "Deux déterminations de groupe le même jour : comment les prélève-t-on ?",
          opts: ["Un seul tube divisé en deux", "Un tube le matin et la copie de la carte le soir", "Par deux infirmières différentes et deux abords différents, ou par la même infirmière à deux moments différents (heures notées sur les tubes)", "Deux tubes prélevés en même temps sur le même bras"], ok: 2,
          why: "Il est impératif de demander au patient de décliner son identité avant chaque prélèvement.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-2" },
        { theme: "transfusion", q: "Quand colle-t-on l’étiquette sur le tube de prélèvement ?",
          opts: ["Avant d’aller dans la chambre", "À la réception du tube au laboratoire", "Au poste de soins, avant la prescription", "Jamais avant le prélèvement"], ok: 3,
          why: "On remplit l’étiquette manuscrite après le prélèvement, en faisant relire l’identité par le patient si son état le permet.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-1" },
        { theme: "transfusion", q: "Quelle est la durée de validité d’une recherche d’agglutinines irrégulières (RAI) avant une transfusion ?",
          opts: ["72 heures", "24 heures", "7 jours", "1 mois"], ok: 0,
          why: "La RAI est obligatoire avant toute transfusion de CGR.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-2" },
        { theme: "transfusion", q: "Que doit comprendre l’information donnée par le médecin avant une transfusion ?",
          opts: ["Rien si le patient est âgé", "La justification de la transfusion, les bénéfices attendus, les risques transfusionnels et la recherche d’antécédents transfusionnels", "Uniquement le prix du produit", "Uniquement la durée de la transfusion"], ok: 1,
          why: "Le médecin trace l’information dans le dossier et remet un document d’information pré-transfusionnel.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1" },
        { theme: "transfusion", q: "Que fait l’infirmière pour informer le patient ?",
          opts: ["Elle informe uniquement la famille", "Elle informe le patient une fois la transfusion terminée", "Elle s’assure que la prescription du PSL et du débit est faite, explique les réactions possibles, vérifie que le patient a compris et trace l’information", "Elle laisse le médecin informer seul"], ok: 2,
          why: "Elle vérifie aussi la présence de deux déterminations de groupe sur la carte.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1" },
        { theme: "transfusion", q: "Quand informe-t-on un patient inconscient ?",
          opts: ["Jamais", "Avant, en informant le voisin de chambre", "Une semaine plus tard", "À postériori, après la transfusion"], ok: 3,
          why: "Cette règle est prévue par le guide pour les patients inconscients.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1" },
        { theme: "transfusion", q: "Comment transporte-t-on les PSL du dépôt vers l’unité de soins ?",
          opts: ["Dans un sac isotherme dédié au transport intra-hospitalier, un sac par patient et par type de produit", "Dans une poche plastique ordinaire", "Dans la poche de la blouse", "Plusieurs patients dans le même sac"], ok: 0,
          why: "L’agent remet le sac et les documents en mains propres à l’infirmière en charge de la transfusion.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-2" },
        { theme: "transfusion", q: "Un agent peut-il récupérer en même temps des PSL pour deux patients du même service ?",
          opts: ["Oui, à condition d’aller vite", "Non : un délai de 30 minutes est demandé entre les deux transports", "Oui, dans le même sac", "Oui, s’ils ont le même groupe"], ok: 1,
          why: "Cela limite le risque d’erreur de patient.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-2" },
        { theme: "transfusion", q: "Que vérifie-t-on lors de la concordance des documents à la réception ?",
          opts: ["Uniquement la date de péremption", "Rien, le dépôt a déjà vérifié", "L’identité du receveur sur la prescription, la fiche de délivrance, le groupage et la RAI, et la concordance avec l’étiquette du PSL", "Uniquement le nom du service"], ok: 2,
          why: "Toute discordance impose de contacter le dépôt.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-3" },
        { theme: "transfusion", q: "Pendant combien de temps un PSL peut-il être gardé dans l’unité de soins avant la transfusion ?",
          opts: ["24 heures au réfrigérateur du service", "Aussi longtemps que nécessaire", "30 secondes", "6 heures maximum, à température ambiante au lit du patient"], ok: 3,
          why: "Au-delà de 6 heures, aucun PSL ne doit être stocké dans les unités de soins.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4" },
        { theme: "transfusion", q: "Un PSL n’a pas été transfusé. Que fait-on ?",
          opts: ["On le retourne au dépôt avec les fiches de délivrance remplies : il est interdit de le détruire dans l’unité", "On le jette dans le sac DASRI", "On le met au réfrigérateur du service", "On le garde pour un autre patient"], ok: 0,
          why: "Le dépôt procède à la destruction pour assurer la traçabilité.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4" },
        { theme: "transfusion", q: "Dans quel délai un plasma frais congelé (PFC) doit-il être posé après décongélation ?",
          opts: ["Il peut être recongelé", "Moins de 6 heures, et il ne doit jamais être recongelé", "24 heures", "48 heures"], ok: 1,
          why: "La décongélation se fait uniquement au dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4" },
        { theme: "transfusion", q: "Où conserve-t-on un concentré plaquettaire ?",
          opts: ["Au congélateur", "Dans le frigo à médicaments", "À température ambiante : jamais au réfrigérateur", "Au réfrigérateur du service"], ok: 2,
          why: "Il est transfusé le plus rapidement possible.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-1 et §5-3-4" },
        { theme: "transfusion", q: "Qui effectue le contrôle ultime et pose la transfusion ?",
          opts: ["Deux soignants qui se partagent les étapes", "L’aide-soignante", "N’importe quel professionnel présent", "La même infirmière, du début à la fin"], ok: 3,
          why: "Le test est réalisé dans sa totalité et sans interruption au lit du malade (unité de lieu, de temps et d’action).", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 et §5-4-3" },
        { theme: "transfusion", q: "Le contrôle ultime pré-transfusionnel est-il obligatoire en urgence vitale ?",
          opts: ["Oui : il ne souffre aucune dérogation, même en urgence, en transfusion massive ou chez le nouveau-né", "Non, on le fait après", "Seulement pour le premier CGR", "Seulement si le médecin le demande"], ok: 0,
          why: "Les accidents mortels d’incompatibilité ABO sont toujours liés à une erreur dans la réalisation de ce contrôle.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 et §7" },
        { theme: "transfusion", q: "Combien de cartes de contrôle ultime pour trois CGR transfusés successivement ?",
          opts: ["Aucune pour les CGR suivants", "Une carte par CGR", "Une seule pour les trois", "Deux"], ok: 1,
          why: "Le contrôle est refait à chaque unité transfusée.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2" },
        { theme: "transfusion", q: "À l’issue du test, une agglutination est présente sur le culot mais absente chez le receveur. Que fait-on ?",
          opts: ["On refait le test jusqu’à obtenir un bon résultat", "On transfuse si le patient est stable", "On ne transfuse pas (risque vital) et on prévient le médecin et le dépôt de sang", "On transfuse lentement"], ok: 2,
          why: "En cas de doute ou de lecture difficile, l’IDE prévient aussi le médecin responsable et le dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2" },
        { theme: "transfusion", q: "Que peut-on injecter dans la tubulure de transfusion ?",
          opts: ["Un antibiotique", "Un antalgique", "Un autre produit compatible", "Uniquement du NaCl à 0,9 %"], ok: 3,
          why: "On utilise une tubulure spéciale avec filtre : 1 PSL, 1 transfuseur, 1 carte de contrôle ultime.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-1" },
        { theme: "transfusion", q: "Le patient doit-il être à jeun pour être transfusé ?",
          opts: ["Non : ce n’est pas nécessaire", "Oui, 6 heures", "Oui, pour les CGR uniquement", "Oui, et sans fièvre"], ok: 0,
          why: "La fièvre n’est pas une contre-indication à la transfusion.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3" },
        { theme: "transfusion", q: "Quelle est la durée maximale de transfusion d’un CGR ?",
          opts: ["Toute la nuit", "2 heures, sauf contre-indication médicale (affection cardiaque, sujet âgé)", "30 minutes", "6 heures"], ok: 1,
          why: "La durée est indiquée dans la prescription ; pour un sujet âgé, le médecin peut prévoir plus long.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3" },
        { theme: "transfusion", q: "Comment surveille-t-on le début de la transfusion ?",
          opts: ["On surveille seulement à la fin", "On laisse le patient seul pour le rassurer", "On reste auprès du patient les 15 premières minutes, avec les constantes toutes les 5 minutes pendant 15 minutes", "On revient au bout d’une heure"], ok: 2,
          why: "Constantes suivies : fréquence cardiaque, pression artérielle, température, saturation, fréquence respiratoire, conscience.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3" },
        { theme: "transfusion", q: "Jusqu’à quand surveille-t-on le patient après la transfusion ?",
          opts: ["30 minutes", "24 heures", "Il n’y a pas de surveillance après", "Jusqu’à 2 heures après"], ok: 3,
          why: "L’administration est notée dans le plan de soins (transmission ciblée).", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3" },
        { theme: "transfusion", q: "Combien de temps conserve-t-on la poche vide et la carte de contrôle ultime ?",
          opts: ["Au minimum 4 heures et au maximum 24 heures à température ambiante, dans l’unité, en l’absence d’incident", "On les jette immédiatement", "1 semaine au réfrigérateur", "Elles partent avec le patient"], ok: 0,
          why: "On les place dans un sac plastique avec le transfuseur, puis filière DASRI.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-5" },
        { theme: "transfusion", q: "Où déclare-t-on un incident transfusionnel ?",
          opts: ["Nulle part, le médecin s’en charge", "Dans BlueKanGo : catégorie « Vigilances réglementaires », sous-catégorie hémovigilance", "Uniquement dans les transmissions", "Dans Easily uniquement"], ok: 1,
          why: "On signale aussi immédiatement l’incident au dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §8" },
        { theme: "transfusion", q: "Premiers gestes face à une manifestation anormale pendant une transfusion ?",
          opts: ["Retirer la voie veineuse", "Attendre la fin de la poche", "Arrêt immédiat, maintien de l’abord veineux, prise en charge médicale, intensification de la surveillance", "Ralentir le débit"], ok: 2,
          why: "On surveille fréquence cardiaque, pression artérielle, fréquence respiratoire, température, couleur des téguments et des urines, douleurs et diurèse.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §8" },
        { theme: "transfusion", q: "Que remet-on au patient transfusé à sa sortie ?",
          opts: ["Rien de spécial", "Uniquement la facture", "Uniquement une ordonnance d’antalgique", "Sa carte de groupe, l’information écrite sur la transfusion et l’ordonnance de RAI à 1 à 3 mois"], ok: 3,
          why: "Le document d’information porte l’identité du patient, l’UF, la date du séjour, la nature et la quantité des produits et la signature du médecin.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §6-2" },
        { theme: "transfusion", q: "Une personne ayant reçu un produit sanguin labile peut-elle donner son sang ?",
          opts: ["Non, elle est définitivement exclue du don (sauf exception pour les groupes rares)", "Oui, après 6 mois", "Oui, après 1 an", "Oui, sans condition"], ok: 0,
          why: "Le patient doit en être informé.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §6-2" },
        { theme: "transfusion", q: "Urgence vitale immédiate chez un homme dont le groupe n’est pas connu : quels CGR transfuse-t-on ?",
          opts: ["Du plasma uniquement", "Des CGR O positif Kell négatif, sans attendre les résultats", "On attend le groupe", "Des CGR AB positif"], ok: 1,
          why: "Pour une femme de moins de 50 ans : O négatif ccddee Kell négatif. On prélève le patient avant la transfusion pour groupage et RAI.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §7" }
      ]
    },
    urg3: {
      th: "urgences", title: "Arrêt cardiaque et chariot d’urgence (HSV)",
      questions: [
        { theme: "urgences", q: "Comment constate-t-on un arrêt cardio-respiratoire ?",
          opts: ["Patient qui parle mais pâle", "Patient dont la tension est basse", "Patient inconscient qui ne respire plus (ou gasps), après libération des voies aériennes", "Patient endormi qui répond à l’appel"], ok: 2,
          why: "La recherche de respiration dure 10 secondes, après avoir mis la tête en arrière.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 1" },
        { theme: "urgences", q: "Quelles informations donne-t-on lors de l’alerte ?",
          opts: ["Uniquement le nom du patient", "Uniquement le service", "Rien, on rappelle plus tard", "Son nom, le service, l’étage, le numéro de chambre, le motif d’appel et l’heure de l’arrêt si elle est connue"], ok: 3,
          why: "L’heure de l’arrêt correspond au « no flow ».", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 1" },
        { theme: "urgences", q: "Quelle est la première action après avoir donné l’alerte ?",
          opts: ["Débuter le massage cardiaque externe", "Chercher le dossier patient", "Préparer l’adrénaline", "Poser une voie veineuse"], ok: 0,
          why: "Un tiers fait ramener le chariot d’urgence et pose le DSA le plus vite possible.", src: "10 commandements de l’ACR (fév. 2025) · commandements 3 et 4" },
        { theme: "urgences", q: "Quelles sont les caractéristiques d’un massage cardiaque efficace ?",
          opts: ["Compressions lentes, profondes de 10 cm", "Plan dur si possible, 100 à 120 compressions par minute, enfoncement de 5 à 6 cm, bras tendus", "60 compressions par minute, 2 cm", "200 compressions par minute, bras fléchis"], ok: 1,
          why: "Le temps de compression est égal au temps de décompression ; le talon de la main est au milieu du thorax.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 2" },
        { theme: "urgences", q: "Quel est le rythme de la réanimation avec un BAVU ?",
          opts: ["5 compressions pour 5 insufflations", "60 compressions pour 4 insufflations", "30 compressions pour 2 insufflations", "15 compressions pour 1 insufflation"], ok: 2,
          why: "Le BAVU est relié à 15 L/min d’oxygène ; les 2 insufflations durent au plus 5 secondes.", src: "10 commandements de l’ACR (fév. 2025) · commandements 5 et 6" },
        { theme: "urgences", q: "Qui réalise les insufflations quand le BAVU est tenu à deux personnes ?",
          opts: ["La personne qui tient le masque", "Le médecin uniquement", "Personne : on masse en continu", "La personne qui masse, en gardant une main sur le thorax"], ok: 3,
          why: "La personne au BAVU maintient le masque à deux mains.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 2" },
        { theme: "urgences", q: "Comment pose-t-on les électrodes du DSA ?",
          opts: ["L’une sous la clavicule droite, l’autre sur la partie gauche sous l’aisselle, collées à la peau", "Toutes deux sur l’abdomen", "Sur le dos uniquement", "Sur les cuisses"], ok: 0,
          why: "Si le patient est porteur d’un pace maker, on pose l’électrode 3 cm en dessous ; on retire les patchs médicamenteux et on évite l’eau.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 3" },
        { theme: "urgences", q: "Peut-on débrancher le DSA en cours de réanimation ?",
          opts: ["Oui, après 5 minutes", "Non, jamais sans avis médical", "Oui, dès que le patient bouge", "Oui, pour changer de personne"], ok: 1,
          why: "On met le DSA en place sans interrompre le massage, et on suit ses indications. La bouteille d’oxygène reste à 1 mètre du DSA.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 3" },
        { theme: "urgences", q: "Que prépare l’infirmière pendant la réanimation médicalisée ?",
          opts: ["Une perfusion de glucose uniquement", "Rien avant l’arrivée du médecin", "Une voie veineuse périphérique avec du sérum physiologique, le matériel d’aspiration et d’intubation, 10 mg d’adrénaline (2 ampoules de 5 mg)", "Un traitement antalgique"], ok: 2,
          why: "L’adrénaline n’est injectée qu’en présence d’un médecin (1 mg toutes les 4 minutes).", src: "10 commandements de l’ACR (fév. 2025) · commandements 7 à 9" },
        { theme: "urgences", q: "Que transmet-on au médecin à son arrivée ?",
          opts: ["Uniquement le nom du patient", "Uniquement l’heure d’arrivée du médecin", "Rien : le médecin lit le dossier", "L’heure de l’arrêt (no flow), le début de la réanimation, le nombre de chocs, les antécédents et les directives anticipées"], ok: 3,
          why: "Il faut aussi noter les horaires et récupérer le dossier patient.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 4" },
        { theme: "urgences", q: "Le chariot d’urgence est sous la responsabilité de…",
          opts: ["Vous, celle de votre cadre de santé, et elle est connue de tous", "Du seul cadre de santé", "De la pharmacie", "Du service biomédical"], ok: 0,
          why: "Il est accessible 24 h sur 24.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 1 et 2" },
        { theme: "urgences", q: "À chaque prise de service, que vérifie-t-on sur le chariot ?",
          opts: ["Rien si la vérification a été faite la veille", "Le scellé rouge intact, le DSA opérationnel (voyant vert), le BAVU protégé, la bouteille d’oxygène non vide", "Uniquement la date de péremption des médicaments", "Uniquement la propreté"], ok: 1,
          why: "Pour un défibrillateur manuel, le test est quotidien.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 3" },
        { theme: "urgences", q: "Peut-on recouvrir le chariot d’urgence d’un drap ?",
          opts: ["Oui, la nuit seulement", "Oui, avec un drap propre", "Non, il ne faut jamais le recouvrir", "Oui, pour le protéger de la poussière"], ok: 2,
          why: "Le chariot doit rester visible et accessible, et sa localisation est signalée par un affichage.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 4" },
        { theme: "urgences", q: "À quelle fréquence vérifie-t-on entièrement le chariot d’urgence ?",
          opts: ["Une fois par an", "Tous les 15 jours (2 fois par mois), idéalement une fois par l’équipe de nuit et une fois par l’équipe de jour", "Uniquement après chaque utilisation", "Chaque jour, avec contrôle de tous les tiroirs"], ok: 1,
          why: "La vérification complète se fait en plus du contrôle de l’extérieur à chaque prise de service et après chaque utilisation. Elle est réalisée en binôme et tracée.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 5" },
        { theme: "urgences", q: "Qui réalise la vérification complète du chariot ?",
          opts: ["L’infirmier seul", "Le médecin", "La pharmacie seule", "Un binôme (IDE, AS, AP), pour contrôler notamment les péremptions, et après chaque utilisation"], ok: 3,
          why: "Il faut respecter la check-list et entretenir le chariot à chaque vérification.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 5 à 7" },
        { theme: "urgences", q: "Pourquoi ne retire-t-on pas les injectables de leurs emballages reçus de la pharmacie ?",
          opts: ["Cela facilite la vérification mensuelle", "Pour gagner de la place", "Pour éviter les vols", "Parce que la pharmacie l’exige pour la facturation"], ok: 0,
          why: "Les emballages d’origine permettent de contrôler plus vite la péremption.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 8" },
        { theme: "urgences", q: "Un médicament du chariot est périmé ou a été utilisé. Que fait-on ?",
          opts: ["On le remplace par un produit du service", "On remplit la feuille prévue et on renvoie le sachet à la pharmacie", "On le jette sans rien noter", "On le garde jusqu’à la prochaine vérification"], ok: 1,
          why: "En attendant la réception des produits, le chariot est signalé par un scellé de couleur jaune.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 9 et 10" },
        { theme: "urgences", q: "Que trouve-t-on dans le classeur ou le lutin du chariot ?",
          opts: ["Le dossier de chaque patient", "Aucun document", "La procédure et la fiche de vérification en 10 points, le tableau journalier, la chaîne de survie, la fiche technique DSA et la fiche de traçabilité de l’ACR", "Uniquement le planning du service"], ok: 2,
          why: "Il contient aussi la fiche technique de l’aspirateur à mucosités et la chaîne de survie pédiatrique.", src: "Diaporama chariots d’urgence HSV (mai 2025) · diap. 6" },
        { theme: "urgences", q: "Que contrôle-t-on dans le tableau de vérification journalière ?",
          opts: ["Uniquement la température", "Uniquement le stock de médicaments", "Les clés du service", "Le scellé, le DSA, l’aspirateur à mucosités et la bouteille d’oxygène, de jour comme de nuit"], ok: 3,
          why: "Le tableau est signé par le vérificateur à chaque contrôle.", src: "Diaporama chariots d’urgence HSV (mai 2025) · diap. 9" },
        { theme: "urgences", q: "En EHPAD ou en CMP, qui alerte-t-on en cas d’arrêt cardio-respiratoire ?",
          opts: ["Le médecin traitant", "Le 18 (pompiers)", "Le 15 (SAMU)", "La famille du patient"], ok: 2,
          why: "La suite de la chaîne de survie est identique. On fait ramener le chariot ou le sac d’urgence.", src: "Chaîne de survie ACR en EHPAD et CMP (fév. 2025)" },
        { theme: "urgences", q: "Que doit-on faire avant de chercher le chariot d’urgence ?",
          opts: ["Appeler la famille", "Débuter le massage cardiaque et faire ramener le chariot par une tierce personne", "Aller chercher le chariot soi-même", "Attendre l’arrivée du médecin"], ok: 1,
          why: "La personne qui commence la réanimation ne quitte pas le patient.", src: "10 commandements de l’ACR (fév. 2025) · commandement 4" }
      ]
    },
    hyg6: {
      th: "hygiene", title: "Précautions contact, gale et AES (HSV)",
      questions: [
        { theme: "hygiene", q: "À quoi servent les précautions complémentaires contact (PCC) ?",
          opts: ["À isoler tous les patients hospitalisés", "À compléter les précautions standard pour prévenir les infections transmises par contact direct ou indirect", "À remplacer les précautions standard", "À prévenir les infections transmises par voie aérienne"], ok: 1,
          why: "Elles s’appliquent au personnel, aux intervenants extérieurs, aux étudiants et aux visiteurs.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §3" },
        { theme: "hygiene", q: "Qui décide de mettre en place et de lever les PCC ?",
          opts: ["Le cadre de santé seul", "Le patient ou sa famille", "Le médecin, par prescription médicale", "L’aide-soignant"], ok: 2,
          why: "L’information du patient (dépliant du CLIN sur les BMR) doit être faite et tracée.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §3" },
        { theme: "hygiene", q: "Quelles bactéries multirésistantes relèvent des PCC ?",
          opts: ["Uniquement le SARM", "Uniquement les BHRe", "Aucune : seulement les virus", "L’EBLSE, le SARM et l’Acinetobacter baumannii multirésistant"], ok: 3,
          why: "Les BHRe (ERG/ERV, EPC) relèvent d’une procédure spécifique.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4" },
        { theme: "hygiene", q: "Un patient est porteur d’une BHRe. Que fait-on ?",
          opts: ["On se réfère à la procédure spécifique (porteurs de BHRe, contacts à haut risque, contacts modérés)", "On applique les précautions standard seules", "On le traite comme un patient ordinaire", "On le transfère sans prévenir"], ok: 0,
          why: "Les BHRe : entérocoques résistants à la vancomycine et entérobactéries productrices de carbapénémase.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4" },
        { theme: "hygiene", q: "Laquelle de ces situations relève des PCC ?",
          opts: ["Une hypertension", "Une conjonctivite virale", "Une tuberculose pulmonaire", "Une fracture du col du fémur"], ok: 1,
          why: "Autres exemples : diarrhées infectieuses (rotavirus, salmonellose…), impétigo, varicelle, zona, hépatite A, bronchiolite, abcès drainé, poux. Une tuberculose relève des précautions respiratoires.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4" },
        { theme: "hygiene", q: "Comment signale-t-on les PCC ?",
          opts: ["Par une étiquette sur le lit du voisin", "Par aucun affichage, pour la confidentialité", "Dans le dossier médical et/ou informatisé, la planification et par un logo triangulaire bleu sur la porte", "Par une affiche dans le couloir"], ok: 2,
          why: "Le logo bleu signale les PCC à toute personne qui entre.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2" },
        { theme: "hygiene", q: "Quel type de chambre pour des PCC ?",
          opts: ["Une chambre double", "Une chambre commune avec rideau", "Le couloir", "Une chambre individuelle avec WC individuels"], ok: 3,
          why: "L’entretien se fait en fin de programme avec le produit détergent/désinfectant habituel.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2" },
        { theme: "hygiene", q: "Quelle protection porte le soignant en contact rapproché en PCC ?",
          opts: ["Un tablier à usage unique, avec friction hydroalcoolique ; le port de gants reste limité (précautions standard)", "Un masque FFP2 systématique", "Une charlotte et des surchaussures systématiques", "Aucune protection"], ok: 0,
          why: "Un masque chirurgical est ajouté en cas d’infection pulmonaire à SARM.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2" },
        { theme: "hygiene", q: "Quand peut-on admettre un nouveau patient dans une chambre où des PCC ont été appliquées ?",
          opts: ["Jamais dans la même chambre", "Immédiatement après l’entretien de la chambre", "Après 48 heures", "Après 15 jours"], ok: 1,
          why: "L’entretien se fait avec le produit détergent/désinfectant habituel.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2" },
        { theme: "hygiene", q: "Quel est l’agent responsable de la gale ?",
          opts: ["Une bactérie", "Un champignon", "Un ectoparasite, le sarcopte, qui pénètre la couche superficielle de la peau", "Un virus"], ok: 2,
          why: "La gale est une maladie contagieuse très prurigineuse.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2" },
        { theme: "hygiene", q: "Comment la gale se transmet-elle ?",
          opts: ["Par voie aérienne à distance", "Par l’eau du robinet", "Par l’alimentation", "Par contact direct étroit, prolongé ou répété, ou indirect (tissus, literie), plus rare sauf formes profuses ou hyperkératosiques"], ok: 3,
          why: "Le linge et la literie peuvent transmettre surtout dans les formes hyperkératosiques et profuses.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2" },
        { theme: "hygiene", q: "Quelle est la durée d’incubation de la gale ?",
          opts: ["De 1 à 6 semaines, en moyenne 3 semaines", "Quelques heures", "24 à 48 heures", "Plusieurs mois"], ok: 0,
          why: "Elle dépend de l’importance de l’infestation.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2" },
        { theme: "hygiene", q: "Qui pose le diagnostic de gale ?",
          opts: ["Le biologiste seul", "Un médecin ou un dermatologue, principalement sur la clinique", "L’aide-soignant qui a vu les lésions", "Le patient"], ok: 1,
          why: "Un prélèvement parasitologique peut le confirmer, notamment dans les formes atypiques.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5" },
        { theme: "hygiene", q: "Quels sont les signes de la gale commune ?",
          opts: ["Aucune démangeaison", "Fièvre élevée et toux", "Prurit intense à recrudescence nocturne, sillons et vésicules perlées, dos et visage habituellement épargnés", "Prurit uniquement diurne, lésions du visage"], ok: 2,
          why: "Localisations : espaces interdigitaux, poignets, coudes, aisselles, fesses, organes génitaux.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.1" },
        { theme: "hygiene", q: "Pourquoi la gale hyperkératosique est-elle un piège diagnostique ?",
          opts: ["Elle n’est jamais contagieuse", "Elle touche uniquement les enfants", "Elle ne touche que les mains", "Le prurit peut être absent ou modéré alors qu’elle est très contagieuse"], ok: 3,
          why: "Elle survient surtout en cas d’immunodépression ou chez des sujets âgés vivant en collectivité, et peut atteindre tout le corps, y compris visage, cuir chevelu, ongles.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.1 · check-list §1" },
        { theme: "hygiene", q: "Qu’est-ce qu’un cas probable de gale ?",
          opts: ["Un sujet avec un prurit ou des lésions hyperkératosiques, en contact avec un cas certain", "Un sujet qui a simplement entendu parler d’un cas", "Un sujet sans aucun symptôme ni contact", "Un sujet guéri depuis un an"], ok: 0,
          why: "Un cas certain a un prurit avec lésions caractéristiques et un diagnostic clinique posé par un médecin, ou des sarcoptes au prélèvement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.2" },
        { theme: "hygiene", q: "À quel cercle de contact appartient un soignant qui réalise des soins de nursing ?",
          opts: ["À aucun cercle", "Au 1er cercle", "Au 2e cercle", "Au 3e cercle"], ok: 1,
          why: "2e cercle : personnes vivant ou travaillant dans la même collectivité ; 3e cercle : visiteurs occasionnels.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.3" },
        { theme: "hygiene", q: "Quelles précautions met-on en place dès la suspicion de gale ?",
          opts: ["Un masque FFP2 seul", "Une chambre à pression négative", "Logo « Précautions contact + Ga » sur la porte, surblouse à manches longues et gants dès l’entrée, sorties limitées, marche en avant", "Aucune avant la confirmation"], ok: 2,
          why: "Une unité mobile de protection avec le matériel adéquat est installée.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1" },
        { theme: "hygiene", q: "Après retrait des gants, comment se désinfecte-t-on les mains en cas de gale ?",
          opts: ["Friction hydroalcoolique seule", "Aucun lavage nécessaire", "Lavage à l’eau seule", "Lavage à l’eau et au savon, puis friction hydroalcoolique"], ok: 3,
          why: "Les consignes de lavage sont spécifiques à la gale.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1" },
        { theme: "hygiene", q: "Jusqu’à quand maintient-on les précautions contact spécifiques gale ?",
          opts: ["Jusqu’à 48 heures après la prise du traitement du patient et de son environnement", "Jusqu’à la disparition des démangeaisons", "Pendant 1 semaine fixe", "Jusqu’à la sortie du patient"], ok: 0,
          why: "Les démangeaisons peuvent persister 2 à 4 semaines sans signifier un échec du traitement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 et §6.2.1" },
        { theme: "hygiene", q: "En cas de gale commune, quels contacts traite-t-on ?",
          opts: ["Les visiteurs uniquement", "Les contacts du 1er cercle", "Tous les patients du service", "Uniquement le patient atteint"], ok: 1,
          why: "En cas de gale profuse, hyperkératosique ou d’épidémie : 1er et 2e cercle, voire 3e.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2" },
        { theme: "hygiene", q: "Que fait-on des professionnels contacts ?",
          opts: ["Ils sont mis en arrêt sans évaluation", "Ils se traitent seuls", "Ils sont adressés à la médecine du travail pour évaluer la nécessité d’un traitement", "Ils continuent sans avis"], ok: 2,
          why: "En cas de gale avérée chez un soignant, les patients contacts rentrés à domicile reçoivent un courrier d’information et une ordonnance.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2" },
        { theme: "hygiene", q: "Comment administre-t-on l’ivermectine à J1 ?",
          opts: ["En continu pendant 1 mois", "À jeun uniquement", "En plusieurs prises quotidiennes", "En prise unique, au cours ou juste après le repas, de préférence le soir"], ok: 3,
          why: "La posologie dépend du poids ; elle est contre-indiquée chez l’enfant de moins de 15 kg ou en cas d’allergie.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.2" },
        { theme: "hygiene", q: "Comment applique-t-on un traitement local (topique) ?",
          opts: ["Après une douche, sur tout le corps sauf le visage, en insistant sur les plis ; il agit 8 à 24 h puis on rince", "Sur le visage uniquement", "On l’applique sans se laver au préalable puis on le rince tout de suite", "On le laisse 5 minutes"], ok: 0,
          why: "On met ensuite des sous-vêtements, vêtements et draps propres.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.2" },
        { theme: "hygiene", q: "Quand traite-t-on l’environnement et le linge ?",
          opts: ["Seulement en cas d’épidémie", "Le lendemain de la prise du traitement (J2), de façon synchrone pour les cas et les contacts", "Avant le traitement du patient", "Une semaine plus tard"], ok: 1,
          why: "Une synchronisation est indispensable pour éviter les récidives.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.1 et §6.2.3" },
        { theme: "hygiene", q: "Comment traite-t-on le linge d’un patient atteint de gale ?",
          opts: ["On le jette sans traitement", "On l’envoie directement en blanchisserie dans un sac classique", "Vaporisation d’acaricide dans un sac hydrosoluble fermé hermétiquement (3 h de contact), puis lavage à 60 °C", "Lavage à 30 °C sans préparation"], ok: 2,
          why: "Pour les surfaces absorbantes (matelas, siège en tissu) : acaricide et aération pendant 12 h, avec un masque lors de la vaporisation.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 et §6.2.3" },
        { theme: "hygiene", q: "À quel moment répète-t-on le traitement ?",
          opts: ["Il n’est jamais répété", "À J30", "Le lendemain", "Entre J8 et J10, au plus tard à J14"], ok: 3,
          why: "Les produits ne sont pas efficaces sur les œufs qui éclosent après le premier traitement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.4" },
        { theme: "hygiene", q: "Cas isolé de gale : qui prévient le service de soins ?",
          opts: ["La Direction des soins, l’EPRI et la médecine du travail", "La presse locale", "La famille uniquement", "Aucune alerte n’est nécessaire"], ok: 0,
          why: "En cas d’épidémie, la pharmacie est également prévenue.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.3" },
        { theme: "hygiene", q: "Qui signale une épidémie de gale à l’ARS et comment ?",
          opts: ["Le patient", "L’EPRI, via la plateforme E-sin", "Le cadre du service par téléphone", "Le médecin traitant"], ok: 1,
          why: "Si de nouveaux cas apparaissent, l’EPRI réévalue la situation.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.3" },
        { theme: "hygiene", q: "Quelle est la première règle en cas d’accident avec exposition au sang (AES) ?",
          opts: ["Déclarer l’accident avant tout soin", "Appliquer un pansement sans nettoyer", "Ne jamais faire saigner", "Faire saigner la plaie abondamment"], ok: 2,
          why: "Les 5 réflexes : ne jamais faire saigner, laver, désinfecter, signaler (+/- traiter), déclarer.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { theme: "hygiene", q: "Piqûre ou blessure : que fait-on ?",
          opts: ["On frotte à sec avec un mouchoir", "On presse la plaie pour faire saigner", "On ne fait rien si c’est superficiel", "On lave à l’eau et au savon, on rince abondamment, puis on immerge la plaie dans du Dakin pendant 5 minutes"], ok: 3,
          why: "L’immersion dans le Dakin dure 5 minutes.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { theme: "hygiene", q: "Projection dans les yeux : que fait-on ?",
          opts: ["On rince abondamment au sérum physiologique pendant 5 minutes", "On se frotte les yeux", "On attend de voir si cela pique", "On applique un collyre antibiotique"], ok: 0,
          why: "Il faut ensuite signaler et déclarer l’accident.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { theme: "hygiene", q: "Après les premiers soins, qui contacte-t-on ?",
          opts: ["La famille du patient", "Le cadre du service (liaison avec le médecin du service) et le service des urgences", "Uniquement un collègue", "La direction financière"], ok: 1,
          why: "On prélève aussi le patient source pour son statut sérologique.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { theme: "hygiene", q: "Qu’évalue-t-on avec le médecin des urgences ?",
          opts: ["La mise en quarantaine du soignant", "La vaccination contre la grippe", "La nécessité d’un traitement post-exposition au VIH, selon le statut du patient ou s’il n’a pu être prélevé", "La nécessité d’un arrêt de travail systématique"], ok: 2,
          why: "Si un traitement est prescrit, on prend rendez-vous à l’Escale dans les 4 jours.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { theme: "hygiene", q: "Dans quel délai adresse-t-on les documents administratifs après un AES ?",
          opts: ["Sous 1 mois", "À la fin de l’année", "Il n’y a pas de document à adresser", "Sous 24 heures, à la Direction du Personnel"], ok: 3,
          why: "Le certificat initial est remis par le médecin des urgences, la déclaration d’accident de travail par le cadre du service.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" }
      ]
    },
    ident2: {
      th: "identito", title: "Le quiz identitovigilance du DIM",
      questions: [
        { theme: "identito", q: "Qu’est-ce que l’identitovigilance ?",
          opts: ["La vérification annuelle des cartes vitales", "L’organisation qui fiabilise l’identification d’un usager à toutes les étapes de sa prise en charge", "La seule création du dossier administratif", "Un contrôle réalisé uniquement par le service des admissions"], ok: 1,
          why: "Elle comprend l’identitovigilance primaire (attribution d’une identité propre à la création du dossier) et secondaire (vérification tout au long de la prise en charge), ainsi que la surveillance et le signalement des erreurs.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q1" },
        { theme: "identito", q: "Qu’est-ce que l’identitovigilance secondaire ?",

  function renderBadges() {

    function card(id,title,desc,icon,metal){var got=badgeHas(id);return '<article class="award-card '+(got?'earned':'locked')+'"><div class="award-shield '+(metal||'special')+'">'+icon+'</div><div class="award-copy"><b>'+esc(title)+'</b><small>'+esc(desc)+'</small><span class="award-state">'+(got?'✓ Obtenu':'À débloquer')+(got?' · '+new Date(S.badges[id]).toLocaleDateString('fr-FR'):'')+'</span></div></article>';}
    var thematic='',global='',progress='',performance='',exception='';
    THEMES.forEach(function(t){metals.forEach(function(m){thematic+=card('theme_'+t.id+'_'+m.v,t.name+' · '+m.n,'Réussir '+m.v+' % des questions distinctes de cette thématique.',themeIcon(t.id),m.c);});});
    [{v:25,n:'Apprenti'},{v:50,n:'Confirmé'},{v:75,n:'Senior'},{v:100,n:'Transcendant'}].forEach(function(x,i){global+=card('global_'+x.v,x.n,'Réussir '+x.v+' % de toutes les questions distinctes de la banque.',['✦','★','✪','✧'][i],metals[i].c);});
    [['first_quiz','Premier pas','Terminer son premier quiz','➤'],['explorer_4','Explorateur','Découvrir 4 thématiques','⌖'],['explorer_8','Aventurier','Découvrir 8 thématiques','⚑'],['explorer_16','Voyageur','Découvrir les 16 thématiques','🌍'],['sessions_10','Assidu','Terminer 10 sessions','▣'],['sessions_25','Persévérant','Terminer 25 sessions','🏆']].forEach(function(x){progress+=card(x[0],x[1],x[2],x[3]);});
    [['perfect_quiz','Sans faute','Obtenir 100 % à un quiz','◎'],['streak_10','Série gagnante','Réussir 10 questions consécutives','🔥'],['improvement_30','Remontée fantastique','Améliorer son score de 30 points sur une thématique','↗'],['phoenix','Phénix','Passer de moins de 50 % à 100 % dans une thématique','♨'],['expert_8','Perfectionniste','Atteindre le Platine dans 8 thématiques','◆']].forEach(function(x){performance+=card(x[0],x[1],x[2],x[3]);});
    [['cartographer','Cartographe','Obtenir au moins le Bronze dans les 16 thématiques','⌖'],['absolute','Collectionneur absolu','Obtenir le Platine dans les 16 thématiques','♛']].forEach(function(x){exception+=card(x[0],x[1],x[2],x[3]);});
    var count=Object.keys(S.badges||{}).length;
    $('v-badges').innerHTML='<div class="head2"><h2>Ma collection de trophées</h2>'+chipHtml()+'</div><p class="lede">Chaque récompense obtenue reste définitivement dans votre collection. Les trophées thématiques et globaux se déclinent en bronze, argent, or et platine.</p><div class="award-summary"><strong>'+count+' / 81</strong><span>trophées obtenus</span><div class="bar"><span style="width:'+Math.min(100,count/81*100)+'%"></span></div></div>'+[['Trophées thématiques · 64',thematic],['Maîtrise globale · 4',global],['Progression · 6',progress],['Performance · 5',performance],['Trophées d’exception · 2',exception]].map(function(x){return '<section class="award-section"><h3>'+x[0]+'</h3><div class="award-grid">'+x[1]+'</div></section>';}).join('');
  }

  /* ---------- Équipe ---------- */
  function renderTeam() {
    var plan = [
      ["Participation", "Part des agents du service ayant joué au moins un quiz dans la semaine."],
      ["Thèmes à revoir", "Les thèmes où le score du service est le plus bas."],
      ["Questions les plus ratées", "Les questions qui posent le plus de difficultés, pour préparer les points qualité."],
      ["Classement des services", "Score et participation de chaque service."],
      ["Défi du point qualité", "Un défi en direct sur les téléphones, joué par équipes en réunion de service."]
    ];
    var h = '<div class="soon-banner" role="status"><b>À venir</b><span>Cette vue est en cours de développement. Elle ne contient pas encore de résultats.</span></div>' +
      '<h2>Équipe</h2><p class="lede">Vue pour les cadres et la direction. Les résultats seront regroupés par service, jamais par personne.</p>' +
      plan.map(function (x) { return '<div class="sect"><div class="sect-head"><h3>' + esc(x[0]) + '</h3><span>à venir</span></div><p class="note">' + esc(x[1]) + "</p></div>"; }).join("");
    $("v-team").innerHTML = h;
  }

  /* ---------- Quiz ---------- */
  function mixQs(list) {
    return list.map(function (q) {
      if (q.opts.length < 3) return q;
      var idx = q.opts.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
      return { theme: q.theme, q: q.q, opts: idx.map(function (i) { return q.opts[i]; }), ok: idx.indexOf(q.ok), why: q.why, src: q.src };
    });
  }
  var PICK = 5;
  function poolOf(id) { var a = []; setsOf(id).forEach(function (k) { a = a.concat(QUIZ[k].questions); }); return a; }
  /* ---------- Défi du jour ----------
     Tout est calculé à partir de la date et de la banque de questions : rien à mettre à jour quand on ajoute des questions ou des thèmes.
     - DEFI_START : jour n° 0, identique pour tout le monde (les 4 questions sont les mêmes pour tous, le même jour).
     - DEFI_THEMES : nombre de thèmes (= de questions) par jour.
     - Chaque thème sort une fois par « tour ». L'ordre des thèmes est mélangé à chaque tour.
     - Au tour n, un thème propose sa n-ième question, dans un ordre mélangé qui change quand toutes ont été vues. */
  var DEFI_START = Date.UTC(2026, 10, 1), DEFI_THEMES = 4;
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffled(arr, seed, keyOf) {
    return arr.map(function (x) { return [hash(seed + "|" + keyOf(x)), keyOf(x), x]; })
      .sort(function (a, b) { return a[0] - b[0] || (a[1] < b[1] ? -1 : 1); })
      .map(function (e) { return e[2]; });
  }
  function dailyDefi(date) {
    var d = date || new Date();
    var day = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DEFI_START) / 864e5);
    var ids = THEMES.filter(function (t) { return poolOf(t.id).length; }).map(function (t) { return t.id; });
    var N = ids.length, per = Math.min(DEFI_THEMES, N), out = [];
    for (var k = 0; k < per; k++) {
      var slot = day * per + k, cycle = Math.floor(slot / N), pos = slot - cycle * N;
      var id = shuffled(ids, "tour" + cycle, function (x) { return x; })[pos];
      var pool = poolOf(id), round = Math.floor(cycle / pool.length), n = cycle - round * pool.length;
      out.push(shuffled(pool, id + "|" + round, function (q) { return q.q; })[n]);
    }
    return out;
  }
  function startQuiz(key) {
    var list, title;
    if (key.indexOf("t:") === 0) {
      var id = key.slice(2), pool = poolOf(id).slice().sort(function () { return Math.random() - 0.5; });
      list = pool.slice(0, PICK); title = BYID[id].name;
    } else if (key === "defi") { list = dailyDefi(); title = "Défi du jour"; }
    else { list = QUIZ[key].questions; title = QUIZ[key].title; }
    quiz = { key: key, title: title, i: 0, picked: null, ok: 0, log: [], qs: mixQs(list) };
    show("quiz"); renderQuiz(); window.scrollTo(0, 0);
  }
  function renderQuiz() {
    var set = QUIZ[quiz.key], n = quiz.qs.length, q = quiz.qs[quiz.i], th = BYID[q.theme];
    var segs = quiz.qs.map(function (_, k) { return '<i class="' + (k < quiz.i || (k === quiz.i && quiz.picked !== null) ? "done" : k === quiz.i ? "now" : "") + '"></i>'; }).join("");
    var h = '<div class="qtop"><button class="linkbtn" type="button" id="quit">‹ Quitter</button><p class="eyebrow">' + esc(quiz.title) + " · " + (quiz.i + 1) + " / " + n + "</p></div>" +
      '<div class="segs" aria-hidden="true">' + segs + "</div>" +
      '<p class="eyebrow qtheme">' + esc(th.name) + "</p><p class=\"qtext\" id=\"qtext\">" + esc(q.q) + "</p><div class=\"opts\" role=\"group\" aria-labelledby=\"qtext\">";
    q.opts.forEach(function (o, k) {
      var cls = "opt", tag = "";
      if (quiz.picked !== null) {
        if (k === q.ok) { cls += " right"; tag = '<span class="tag">Bonne réponse</span>'; }
        else if (k === quiz.picked) { cls += " wrong"; tag = '<span class="tag">Votre réponse</span>'; }
      }
      h += '<button type="button" class="' + cls + '" data-k="' + k + '"' + (quiz.picked !== null ? " disabled" : "") + '><span class="l">' + "ABCD".charAt(k) + "</span><span>" + esc(o) + tag + "</span></button>";
    });
    h += "</div>";
    if (quiz.picked !== null) {
      var good = quiz.picked === q.ok, last = quiz.i === n - 1;
      h += '<div class="fb" role="status"><h3 class="' + (good ? "good" : "bad") + '">' + (good ? "Correct · +10 points" : "Pas tout à fait") + "</h3><p>" + esc(q.why) + '</p><p class="src">' + esc(q.src) + "</p>" +
        '<div class="actions"><button class="btn" type="button" id="next">' + (last ? "Voir le résultat" : "Question suivante") + "</button></div></div>";
    }
    $("v-quiz").innerHTML = h;
    $("quit").addEventListener("click", function () { quiz = null; show("play"); });
    Array.prototype.forEach.call($("v-quiz").querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        var k = +b.getAttribute("data-k"); quiz.picked = k;
        var ok = k === q.ok; if (ok) quiz.ok++;
        quiz.log.push({ q: q, ok: ok });
        renderQuiz();
        var nx = $("next"); if (nx) nx.focus();
      });
    });
    var nx = $("next");
    if (nx) nx.addEventListener("click", function () {
      if (quiz.i < n - 1) { quiz.i++; quiz.picked = null; renderQuiz(); window.scrollTo(0, 0); }
      else finishQuiz();
    });
  }
  function finishQuiz() {
    var set = QUIZ[quiz.key], n = quiz.qs.length, touched = {}, before = {};
    var sessionThemeScores = {}, sessionThemeCounts = {}, sessionThemeCorrect = {};
    quiz.log.forEach(function (e) {
      var id = e.q.theme, qid = questionKey(e.q);
      if (!(id in before)) before[id] = pct(id);
      var c = S.counters[id]; c[1] += 1; if (e.ok) c[0] += 1; touched[id] = 1;
      S.discoveredThemes[id] = true;
      sessionThemeCounts[id]=(sessionThemeCounts[id]||0)+1; if(e.ok)sessionThemeCorrect[id]=(sessionThemeCorrect[id]||0)+1;
      if(e.ok) S.correctDistinct[qid]=true;
      if(e.ok) S.consecutiveCorrect=(S.consecutiveCorrect||0)+1; else S.consecutiveCorrect=0;
    });
    Object.keys(sessionThemeCounts).forEach(function(id){sessionThemeScores[id]=sessionThemeCorrect[id] ? sessionThemeCorrect[id]/sessionThemeCounts[id]*100 : 0;});
    var pts = quiz.ok * 10; S.points += pts; S.sessionsCompleted=(S.sessionsCompleted||0)+1; (S.hist = S.hist || []).push(r(globalScore()));
    evaluateBadges(before,sessionThemeScores,quiz.ok===n);
    var d = new Date(), today = d.toISOString().slice(0, 10), yday = new Date(d.getTime() - 864e5).toISOString().slice(0, 10);
    if (S.last !== today) { S.streak = S.last === yday ? (S.streak || 0) + 1 : 1; S.last = today; }
    save();
    var missed = quiz.log.filter(function (e) { return !e.ok; });
    var h = '<div class="qtop"><button class="linkbtn" type="button" id="back">‹ Retour aux thèmes</button><p class="eyebrow">' + esc(quiz.title) + "</p></div>" +
      '<div class="res"><div class="big">' + quiz.ok + "<small>/" + n + "</small></div><p class=\"cap\" style=\"margin:0\">" + pts + " points gagnés</p></div>" +
      '<div class="sect"><div class="sect-head"><h3>Effet sur vos thèmes</h3></div>' +
      Object.keys(touched).map(function (id) {
        var a = before[id], b = pct(id);
        return '<div class="row" style="cursor:default"><div class="name">' + esc(BYID[id].name) + '</div><div class="pct"><b class="delta">' + (a === null ? "" : r(a) + " → ") + r(b) + "<small> %</small></b></div></div>";
      }).join("") + "</div>" +
      '<div class="sect"><div class="sect-head"><h3>À retenir</h3></div>' +
      (missed.length ? '<ul class="keep">' + missed.map(function (e) { return "<li><strong>" + esc(e.q.q) + "</strong><br>" + esc(e.q.why) + '<br><span class="src">' + esc(e.q.src) + "</span></li>"; }).join("") + "</ul>" : '<p class="note" style="font-size:16px;color:var(--ink)">Aucune erreur. Les ' + n + " points sont acquis.</p>") + "</div>" +
      '<div class="actions"><button class="btn" type="button" id="again">Rejouer</button><button class="btn ghost" type="button" id="back2">Retour aux thèmes</button></div>';
    var key = quiz.key; quiz = null;
    $("v-quiz").innerHTML = h;
    $("back").addEventListener("click", function () { show("play"); });
    $("back2").addEventListener("click", function () { show("play"); });
    $("again").addEventListener("click", function () { startQuiz(key); });
    window.scrollTo(0, 0);
  }

  /* ---------- Bienvenue ---------- */
  function genCode() { var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i = 0; i < 6; i++) { s += a.charAt(Math.floor(Math.random() * a.length)); if (i === 2) s += "-"; } return s; }
  function renderWelcome() {
    var P = profiles(), ks = Object.keys(P);
    var seen = {}, dups = 0;
    ks.forEach(function (k) { var n = (P[k].pseudo || "").toLowerCase(); if (seen[n]) dups++; seen[n] = 1; });
    var plist = ks.length ? '<div class="wform"><h3>Reprendre un profil</h3>' + ks.map(function (k) {
      return '<div style="display:flex;gap:8px;align-items:stretch"><div style="flex:1;min-width:0"><button class="row" type="button" data-resume="' + esc(k) + '"><div><div class="name">' + esc(P[k].pseudo) + '</div><div class="meta"><span class="refs">' + esc(P[k].service || "") + '</span></div></div><div class="pct"><b>' + (P[k].points || 0) + '</b><em>points</em></div></button></div><button class="btn ghost" type="button" data-del="' + esc(k) + '" aria-label="Supprimer le profil ' + esc(P[k].pseudo) + '" style="flex:none;padding:0 14px">Supprimer</button></div>';
    }).join("") + (dups ? '<button class="btn ghost" type="button" id="wdup" style="margin-top:10px">Supprimer les doublons (' + dups + ')</button>' : "") + '<h3 style="margin-top:28px">Nouveau profil</h3></div>' : "";
    var sv = ["UGA", "UGO", "Médecine", "SMR", "Autre service"].map(function (x) { return "<option>" + x + "</option>"; }).join("");
    $("v-welcome").innerHTML = '<p class="eyebrow">Visite de certification · préparation</p><h1>Objectif<br>CertiF</h1>' +
      '<p class="lede">Des quiz de trois minutes, un thème à la fois, pour arriver prêt le jour de la visite. Créez votre profil pour suivre votre progression.</p>' +
      plist + '<form id="wf" class="wform"><div class="field"><label for="wp">Choisissez un pseudo</label><input id="wp" maxlength="20" autocomplete="off" required placeholder="Ex. : Cyclope42"></div>' +
      '<div class="field"><label for="ws">Votre service</label><select id="ws">' + sv + '</select></div>' +
      '<p class="note">Ni nom ni matricule. Ne saisissez aucune donnée de patient. Votre profil reste enregistré sur cet appareil. Si ce pseudo existe déjà ici, vous retrouvez votre progression.</p>' +
      '<div class="actions"><button class="btn" type="submit">Commencer</button></div></form>';

    $("wf").addEventListener("submit", function (e) {
      e.preventDefault();
      var p = $("wp").value.trim(); if (!p) return;
      var P = profiles(), want = p.toLowerCase(), best = null;
      Object.keys(P).forEach(function (k) { if ((P[k].pseudo || "").toLowerCase() === want && (!best || (P[k].points || 0) > (best.points || 0))) best = P[k]; });
      if (best) { S = normalizeProfile(clone(best)); save(); show("play"); toast("Profil retrouvé : " + S.pseudo); return; }
      S = clone(FRESH); S.pseudo = p; S.service = $("ws").value; S.code = genCode(); S.onboarded = true; save(); show("play");
    });
    Array.prototype.forEach.call($("v-welcome").querySelectorAll("[data-resume]"), function (b) {
      b.addEventListener("click", function () { var p = profiles()[b.getAttribute("data-resume")]; if (p) { S = normalizeProfile(clone(p)); save(); show("play"); } });
    });
    function putProfiles(P) { try { localStorage.setItem(KEY + "-profils", JSON.stringify(P)); } catch (e) {} }
    Array.prototype.forEach.call($("v-welcome").querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        if (!b.getAttribute("data-sure")) { b.setAttribute("data-sure", "1"); b.textContent = "Confirmer ?"; setTimeout(function () { b.removeAttribute("data-sure"); b.textContent = "Supprimer"; }, 4000); return; }
        var P2 = profiles(); delete P2[b.getAttribute("data-del")]; putProfiles(P2); renderWelcome(); toast("Profil supprimé");
      });
    });
    var wd = $("wdup");
    if (wd) wd.addEventListener("click", function () {
      if (!wd.getAttribute("data-sure")) { wd.setAttribute("data-sure", "1"); wd.textContent = "Confirmer : garder le meilleur score de chaque pseudo"; return; }
      var P2 = profiles(), best = {};
      Object.keys(P2).forEach(function (k) { var n = (P2[k].pseudo || "").toLowerCase(); if (!best[n] || (P2[k].points || 0) > (P2[best[n]].points || 0)) best[n] = k; });
      var keep = {}; Object.keys(best).forEach(function (n) { keep[best[n]] = P2[best[n]]; });
      putProfiles(keep); renderWelcome(); toast("Doublons supprimés");
    });
  }

  /* ---------- Navigation ---------- */
  function show(name) {
    tab = name;
    ["play", "lib", "me", "team", "badges", "quiz", "welcome"].forEach(function (v) { $("v-" + v).hidden = v !== name; });
    $("tabs").hidden = name === "quiz" || name === "welcome";
    $("sidebar").style.display = (name === "quiz" || name === "welcome") ? "none" : "flex";
    $("shell").style.gridTemplateColumns = (name === "quiz" || name === "welcome") ? "1fr" : "280px minmax(0,1fr)";
    if (name === "welcome") renderWelcome();
    if (name === "play") renderPlay();
    if (name === "lib") renderLib();
    if (name === "me") renderMe();
    if (name === "team") renderTeam();
    if (name === "badges") renderBadges();
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      if (b.getAttribute("data-tab") === name && !b.hasAttribute("data-action")) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (name !== "quiz") window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab],[data-theme-id],[data-switch],[data-quiz],[data-action],#go-defi") : null;
    if (!t) return;
    if (t.hasAttribute("data-switch")) { switchProfile(); return; }
    if (t.getAttribute("data-action") === "challenge") { startQuiz("defi"); return; }
    if (t.getAttribute("data-action") === "badges") { show("badges"); return; }
    if (t.hasAttribute("data-quiz")) { startQuiz(t.getAttribute("data-quiz")); return; }
    if (t.hasAttribute("data-tab")) { show(t.getAttribute("data-tab")); return; }
    if (t.id === "go-defi") { startQuiz("defi"); return; }
    var id = t.getAttribute("data-theme-id"), ks = setsOf(id);
    if (ks.length) startQuiz("t:" + id);
    else toast("Quiz à venir pour ce thème.");
  });

  var themeBtn = $("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", function(){document.body.classList.toggle("light-ui");themeBtn.querySelector("span").textContent=document.body.classList.contains("light-ui")?"Passer en mode sombre":"Passer en mode clair";});
  var start = { jouer: "play", quiz: "lib", score: "me", equipe: "team" }[(location.hash || "").replace("#", "")] || "play";
  show(S.onboarded ? start : "welcome");
})();
</script>
