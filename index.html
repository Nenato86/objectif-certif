          why: "Définition de l’ANAES (2000) reprise par la procédure. Elle a pour seul but d’obtenir la sécurité.", src: "Procédure Contention UGA/UGO (sept. 2024) §3 · critère 1.1-10" },
        { id: "BIE-008", theme: "bientraitance", q: "Qu’est-ce que la contention chimique ?",
          opts: ["Un médicament pour dormir donné à la demande du patient", "Une solution antiseptique", "L’utilisation d’un médicament sédatif pour contrôler le comportement d’une personne", "Un traitement antalgique"], ok: 2,
          why: "La contention chimique fait partie des formes de contention, au même titre que la contention physique et environnementale. Exemples de médicaments sédatifs : tranquillisant, antipsychotique.", src: "Procédure Contention UGA/UGO (sept. 2024) §3 · critère 1.1-10" },
        { id: "BIE-009", theme: "bientraitance", q: "Qu’est-ce que la contention environnementale ?",
          opts: ["La pose d’une sonnette de lit pour alerter l’équipe en cas de besoin", "L’installation d’un lit bas, qui limite le risque de chute du patient", "Le port de chaussons adaptés à la marche, qui sécurisent les déplacements", "La restriction de la mobilité d’une personne en limitant l’espace où elle se déplace"], ok: 3,
          why: "Exemple : enfermer ou limiter l’accès à un espace.", src: "Procédure Contention UGA/UGO (sept. 2024) §3 · critère 1.1-10" },
        { id: "BIE-010", theme: "bientraitance", q: "Toute forme de contention doit faire l’objet de…",
          opts: ["Une réflexion en équipe pluri-professionnelle sur les bénéfices et les risques", "La décision de l’aide-soignant du poste, qui connaît le mieux le patient au quotidien", "Un accord oral de la famille seul, donné au moment de l’admission", "Aucune formalité si elle est brève et décidée pour la sécurité du patient"], ok: 0,
          why: "La contention constitue une atteinte au droit des libertés du patient.", src: "Procédure Contention UGA/UGO (sept. 2024) §3 · critère 1.1-10" },
        { id: "BIE-011", theme: "bientraitance", q: "Quelle doit être la nature de la contention ?",
          opts: ["Une mesure permanente, maintenue tant que le patient est hospitalisé pour garantir sa sécurité", "Une mesure d’exception, temporaire, pour assurer la sécurité de la personne", "Une mesure systématique la nuit, pour assurer la sécurité de tous les patients âgés", "Une mesure de confort pour l’équipe, afin de faciliter l’organisation des soins"], ok: 1,
          why: "Elle ne doit jamais devenir une routine. Elle vise la sécurité de la personne et de son environnement et prévient la rupture thérapeutique.", src: "Procédure Contention UGA/UGO (sept. 2024) §3 · critère 1.1-10" },
        { id: "BIE-012", theme: "bientraitance", q: "Peut-on utiliser le moyen de contention de son choix ?",
          opts: ["Oui, avec des draps noués en cas d’urgence, si aucun autre matériel n’est disponible", "Oui, si la famille l’accepte", "Non : seuls les moyens listés dans la procédure peuvent être utilisés", "Oui, tout matériel qui sécurise le patient"], ok: 2,
          why: "Moyens utilisés en UGA : les 2 barrières de lit, ceinture pelvienne et plastron, ceinture ventrale avec inter-jambe et fixation par clé magnétique, contention poignet et pied à clé magnétique.", src: "Procédure Contention UGA/UGO (sept. 2024) §4 · critère 1.1-10" },
        { id: "BIE-013", theme: "bientraitance", q: "Quel est un risque lié à la contention chez la personne âgée ?",
          opts: ["Une amélioration de l’autonomie et de la mobilité du patient contentionné, au fil du séjour", "Une diminution du risque de confusion et d’agitation chez le patient âgé", "Aucun risque tant que la contention est bien posée et prescrite par le médecin", "Le syndrome d’immobilisation : incontinence, escarres, perte d’autonomie"], ok: 3,
          why: "Autres risques : plaie cutanée, chute, troubles neuropsychiques (confusion, agitation, dépression, repli), maltraitance (privation de liberté). Le syndrome d’immobilisation comprend aussi les fausses routes.", src: "Procédure Contention UGA/UGO (sept. 2024) §5 · critère 1.1-10" },
        { id: "BIE-014", theme: "bientraitance", q: "Quelle est une alternative à la contention en cas de risque de chute ?",
          opts: ["Baisser le lit au maximum, voire mettre un matelas au sol", "Remonter le lit au maximum pour que le patient ne puisse pas descendre seul", "Retirer le déambulateur pour empêcher le patient de se lever sans aide", "Fermer la porte de la chambre pour limiter les déplacements du patient"], ok: 0,
          why: "Autres alternatives : chaussant adapté, déambulateur adapté, absence d’obstacle. Le lit peut aussi être installé contre un mur.", src: "Procédure Contention UGA/UGO (sept. 2024) §6 · critère 1.1-10" },
        { id: "BIE-015", theme: "bientraitance", q: "Quelles alternatives en cas de trouble du comportement ?",
          opts: ["Un traitement sédatif d’emblée, avant toute autre approche non médicamenteuse", "L’entretien thérapeutique et l’accompagnement avec la famille", "Une contention préventive", "Un isolement systématique"], ok: 1,
          why: "Les aidants peuvent être une alternative en étant présents auprès de leur proche ; ils informent l’équipe à leur départ.", src: "Procédure Contention UGA/UGO (sept. 2024) §6 · critère 1.1-10" },
        { id: "BIE-016", theme: "bientraitance", q: "Un patient déambulant doit-il être contentionné ?",
          opts: ["Oui, la nuit uniquement, pour éviter les sorties du service et les chutes", "Oui, dès que la famille le demande, sans réflexion de l’équipe", "Non : la déambulation ne présente pas de risque en elle-même", "Oui, systématiquement, dès que le patient commence à déambuler dans le service"], ok: 2,
          why: "Exception : un maintien en chambre pour isolement infectieux peut conduire à contentionner un patient déambulant. C’est vrai si l’environnement est sécurisé et les chaussants adaptés.", src: "Procédure Contention UGA/UGO (sept. 2024) · remarques · critère 1.1-10" },
        { id: "BIE-017", theme: "bientraitance", q: "En cas d’urgence, que fait-on ?",
          opts: ["On attend la visite du lendemain avant de mettre en place la moindre mesure", "On décide seul sans informer personne et sans rien noter dans le dossier", "On ne contentionne jamais en urgence", "Contention adaptée immédiate et appel du médecin pour prescription"], ok: 3,
          why: "Dans tous les cas, la traçabilité se fait dans le dossier du patient.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 · critère 1.1-10" },
        { id: "BIE-018", theme: "bientraitance", q: "Avant la mise en place, qui informe-t-on ?",
          opts: ["Le patient (recherche de son consentement) et la personne de confiance, l’entourage ou le tuteur", "Uniquement le cadre de santé, qui informe ensuite la famille si nécessaire", "Uniquement la famille, après la pose de la contention, par un appel téléphonique", "Personne si la contention est brève"], ok: 0,
          why: "Le motif de la contention est aussi inscrit dans le dossier du patient.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 · critère 1.1-10" },
        { id: "BIE-019", theme: "bientraitance", q: "Qui prescrit la contention ?",
          opts: ["Le cadre de santé, qui peut aussi demander des surveillances particulières", "Le médecin, qui peut aussi demander des surveillances", "L’infirmier du poste, selon son appréciation de l’état du patient", "L’aide-soignant, en fonction de ses observations auprès du patient"], ok: 1,
          why: "La prescription (et ses surveillances) est faite dans Easily ; la périodicité des surveillances est généralement quotidienne.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 et 8 · critère 1.1-10" },
        { id: "BIE-020", theme: "bientraitance", q: "Quel matériel pour un patient avec trouble du comportement installé au fauteuil ?",
          opts: ["Contention poignets et pieds d’emblée, avec fixation par clé magnétique", "Un drap noué autour du fauteuil, si aucun matériel n’est disponible", "Plastron si possible, sinon ceinture ventrale avec inter-jambes", "Barrières de lit, relevées de chaque côté, comme pour un patient chuteur"], ok: 2,
          why: "Au lit : ceinture ventrale avec inter-jambes. Un patient chuteur relève du plastron, de la ceinture pelvienne ou des barrières de lit.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 · critère 1.1-10" },
        { id: "BIE-021", theme: "bientraitance", q: "À quelle fréquence évalue-t-on le maintien de la contention ?",
          opts: ["Toutes les semaines, avec traçabilité hebdomadaire dans Easily", "Uniquement à la levée de la contention, lors de la décision de l’arrêter", "À chaque changement de médecin référent, lors de la relève", "Tous les jours (traçabilité et validation quotidiennes dans Easily)"], ok: 3,
          why: "L’évaluation quotidienne est tracée et validée par l’IDE et l’AS.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 · critère 1.1-10" },
        { id: "BIE-022", theme: "bientraitance", q: "Comment lève-t-on une contention ?",
          opts: ["On stoppe la prescription dans Easily, avec transmission ciblée et observation médicale", "On retire le matériel dès que le patient semble calme, sans rien noter dans le dossier ni prévenir le médecin", "On attend la fin du séjour pour retirer la contention en même temps que la sortie", "On informe seulement la famille, qui décide alors de la levée de la contention"], ok: 0,
          why: "La décision de levée est prise par l’IDE, l’AS et le médecin. Ces éléments justifient l’arrêt.", src: "Procédure Contention UGA/UGO (sept. 2024) §7 · critère 1.1-10" },
        { id: "BIE-023", theme: "bientraitance", q: "Que surveille-t-on chez un patient contentionné ?",
          opts: ["Rien de spécifique, le patient étant considéré comme sécurisé par la contention", "Fonction respiratoire, état cutané, hydratation, élimination", "Uniquement le poids, car c’est le seul paramètre qui évolue sous contention", "Uniquement la tension, car c’est le seul paramètre lié à la sécurité du patient"], ok: 1,
          why: "La surveillance est renseignée dans Easily (pancarte et transmissions ciblées). Sont aussi surveillés les paramètres psychologiques et environnementaux.", src: "Procédure Contention UGA/UGO (sept. 2024) §8 · critère 1.1-10" },
        { id: "BIE-024", theme: "bientraitance", q: "Comment organise-t-on l’élimination d’un patient contentionné ?",
          opts: ["On pose systématiquement une protection pour éviter de solliciter l’équipe", "On laisse la famille s’en charger, l’équipe n’intervenant pas dans l’élimination", "L’accompagnement aux toilettes ou le bassin est prévu dans l’organisation du service", "On attend que le patient demande"], ok: 2,
          why: "Le patient doit être installé de façon à respecter son intimité, sa dignité et sa pudeur. L’organisation prévoit tournées, sonnettes et sollicitation.", src: "Procédure Contention UGA/UGO (sept. 2024) §8 · critère 1.1-10" }
      ]
    },
    hyg5: {
      th: "hygiene", title: "Les précautions respiratoires",
      questions: [
        { id: "HYG-017", theme: "hygiene", q: "Par quoi les procédures « Air » et « Gouttelettes » sont-elles remplacées ?",
          opts: ["Par l’isolement géographique systématique de tous les patients, quel que soit le pathogène", "Par les précautions respiratoires, en 3 niveaux : simples, renforcées, maximales", "Par un isolement unique pour tous les germes, sans distinction de niveau", "Par le port du masque chirurgical seul, pour tous les patients et les soignants"], ok: 1,
          why: "Cela suit les recommandations de la SF2H sur la prévention de la transmission par voie respiratoire. Les 3 niveaux sont définis.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 2 · critère 2.2-09" },
        { id: "HYG-018", theme: "hygiene", q: "Quels sont les deux éléments qui déterminent le niveau de précautions respiratoires ?",
          opts: ["Le service d’hospitalisation et l’heure de la journée", "Le nombre de visiteurs et la taille de la chambre", "Le type de pathogène et le niveau d’exposition", "L’âge du patient et la durée du séjour"], ok: 2,
          why: "On définit d’abord le pathogène, puis l’exposition, puis le niveau de précautions. Le pathogène est de type A, B ou C ; l’exposition est faible, modérée ou forte.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 à 5 · critère 2.2-09" },
        { id: "HYG-019", theme: "hygiene", q: "Lequel de ces germes est un pathogène de type A ?",
          opts: ["La rougeole", "La varicelle-zona", "La tuberculose sensible", "Le virus de la grippe (Influenza)"], ok: 3,
          why: "Type A : coqueluche, méningocoque, pneumocoque, SARS-CoV-2, grippe, VRS, rhinovirus, oreillons, rubéole, etc.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 · affiche germe A · critère 2.2-09" },
        { id: "HYG-020", theme: "hygiene", q: "Lequel de ces germes est un pathogène de type B ?",
          opts: ["La rougeole", "La coqueluche, bactérie des voies respiratoires", "Le SARS-CoV-2, virus respiratoire", "Le VRS, responsable d’infections respiratoires"], ok: 0,
          why: "Type B : tuberculose sensible, varicelle-zona (varicelle, zona disséminé) et rougeole.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 · affiche germes B et C · critère 2.2-09" },
        { id: "HYG-021", theme: "hygiene", q: "Quel est le pathogène de type C ?",
          opts: ["La varicelle, y compris le zona disséminé", "Mycobacterium tuberculosis MDR ou XDR", "La tuberculose sensible, quel que soit le niveau d’exposition", "La grippe, quel que soit le niveau d’exposition"], ok: 1,
          why: "Pour un type C, les précautions sont maximales quel que soit le niveau d’exposition. Il s’agit de Mycobacterium tuberculosis multi-résistante (MDR) ou ultra-résistante (XDR).", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 3 et 5 · critère 2.2-09" },
        { id: "HYG-022", theme: "hygiene", q: "Qu’est-ce qu’une exposition faible ?",
          opts: ["Toute intubation, même avec un patient qui porte un masque", "Une visite de la famille auprès d’un patient sans masque", "Un patient masqué, ou un contact direct de moins de 15 minutes et un pathogène de type A", "Un contact direct de plus de 15 minutes avec un patient sans masque, quelle que soit la procédure"], ok: 2,
          why: "L’exposition modérée correspond à un contact direct de plus de 15 minutes avec un patient sans masque, ou à une procédure aérosolisante à risque modéré. L’exposition faible correspond à un patient qui porte un masque, ou à un contact direct de moins de 15 minutes avec un pathogène de type A.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4 · critère 2.2-09" },
        { id: "HYG-023", theme: "hygiene", q: "Laquelle de ces procédures génère des aérosols à risque élevé ?",
          opts: ["L’extubation", "La ventilation non invasive", "L’aspiration endotrachéale", "L’intubation"], ok: 3,
          why: "Risque élevé : intubation, réanimation cardio-pulmonaire, ventilation manuelle au masque, fibroscopie bronchique, trachéotomie, induction de crachats, aérosolthérapie.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4 · affiches · critère 2.2-09" },
        { id: "HYG-024", theme: "hygiene", q: "Laquelle de ces procédures génère des aérosols à risque modéré ?",
          opts: ["L’aspiration endotrachéale", "L’intubation", "L’aérosolthérapie", "La fibroscopie bronchique"], ok: 0,
          why: "Risque modéré : extubation, ventilation non invasive, aspiration des voies aériennes, gastroscopie avec aspiration, chirurgie dentaire avec appareil rotatif, procédure ORL proximale avec aspiration.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 4 · affiches · critère 2.2-09" },
        { id: "HYG-025", theme: "hygiene", q: "Pathogène de type A et exposition faible : quel niveau de précautions ?",
          opts: ["Précautions renforcées, quel que soit le niveau d’exposition", "Précautions respiratoires simples", "Précautions maximales, dès qu’un pathogène de type A est identifié", "Aucune précaution, l’exposition faible ne justifiant rien"], ok: 1,
          why: "Type A et exposition modérée ou forte : précautions renforcées.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 5 · critère 2.2-09" },
        { id: "HYG-026", theme: "hygiene", q: "Pathogène de type B et exposition faible ou modérée : quel niveau ?",
          opts: ["Précautions maximales", "Aucune précaution particulière, l’exposition étant faible ou modérée", "Précautions respiratoires renforcées", "Précautions simples"], ok: 2,
          why: "Type B et exposition forte : précautions maximales.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 5 · critère 2.2-09" },
        { id: "HYG-027", theme: "hygiene", q: "Quel type de chambre pour des précautions respiratoires ?",
          opts: ["Une chambre double si les patients ont le même germe", "Une chambre ouverte pour surveiller", "Le couloir, avec un paravent", "Une chambre individuelle, porte fermée"], ok: 3,
          why: "La porte fermée fait aussi partie des consignes sur les affiches.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6 · affiches · critère 2.2-09" },
        { id: "HYG-028", theme: "hygiene", q: "Quel masque porte le professionnel en précautions simples ?",
          opts: ["Un masque à usage médical", "Un masque FFP2, quel que soit le niveau de précautions", "Aucun masque, la porte fermée suffisant", "Une visière seule, sans aucun masque"], ok: 0,
          why: "En précautions renforcées et maximales : masque FFP2.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6 · critère 2.2-09" },
        { id: "HYG-029", theme: "hygiene", q: "Un patient porteur d’un germe de catégorie B ou C sort de sa chambre. Quel masque porte-t-il ?",
          opts: ["Un masque à usage médical", "Un masque FFP2", "Un masque en tissu", "Aucun masque"], ok: 1,
          why: "Germes B et C (précautions renforcées) : FFP2, ou à défaut masque à usage médical. En précautions simples : masque à usage médical.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6 · critère 2.2-09" },
        { id: "HYG-030", theme: "hygiene", q: "Comment sont organisées les visites en précautions renforcées ?",
          opts: ["Elles sont interdites", "Elles sont réservées à la nuit", "Elles sont limitées et encadrées", "Elles sont libres"], ok: 2,
          why: "Précautions simples : visites autorisées.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 6 · critère 2.2-09" },
        { id: "HYG-031", theme: "hygiene", q: "Quand réalise-t-on une friction hydroalcoolique en précautions complémentaires respiratoires ?",
          opts: ["Uniquement à la sortie", "Uniquement avant un geste invasif", "Une fois par service", "À l’entrée et à la sortie de la chambre"], ok: 3,
          why: "Cette consigne s’applique aux soignants comme aux visiteurs.", src: "Affiches germe A et germes B et C · critère 2.2-09" },
        { id: "HYG-032", theme: "hygiene", q: "Germe de catégorie A : quand le soignant porte-t-il un masque FFP2 ?",
          opts: ["Patient sans masque, soins de plus de 15 minutes ou procédure générant des aérosols", "Pour tout soin direct, même de moins de 15 minutes, dès lors que le patient porte lui-même un masque", "Uniquement la nuit, lorsque l’équipe est réduite", "Jamais, le masque à usage médical suffisant dans toutes les situations"], ok: 0,
          why: "Pour les soins directs non aérosolisants de moins de 15 minutes, ou si le patient porte lui-même un masque : masque à usage médical.", src: "Affiche germe A · critère 2.2-09" },
        { id: "HYG-033", theme: "hygiene", q: "Un patient en précautions respiratoires doit se rendre à un examen. Que fait-on ?",
          opts: ["On annule systématiquement l’examen, quel que soit son intérêt pour le patient", "On prévient le service receveur et le brancardage, et le patient porte un masque adapté à la catégorie du germe", "On ne dit rien au service receveur pour ne pas inquiéter le patient", "Le patient y va sans masque et sans prévenir personne"], ok: 1,
          why: "Un masque à usage médical dès que possible pendant les soins et lors des sorties de chambre ; FFP2 pour les germes B et C. Il s’agit du service de brancardage.", src: "Affiches germe A et germes B et C · critère 2.2-09" },
        { id: "HYG-034", theme: "hygiene", q: "Quel masque pour un visiteur d’un patient de catégorie B ou C ?",
          opts: ["Un masque en tissu, suffisant pour une courte visite", "Un masque à usage médical, quelle que soit la durée de la visite", "Un masque FFP2 dès l’entrée dans la chambre", "Aucun masque, si le visiteur reste à distance du patient"], ok: 2,
          why: "Catégorie A : masque à usage médical pour une visite de moins de 15 minutes ou si le patient est masqué, FFP2 dans les autres cas.", src: "Affiches germe A et germes B et C · critère 2.2-09" },
        { id: "HYG-035", theme: "hygiene", q: "Qui contacter pour toute question sur les précautions respiratoires ?",
          opts: ["Le service technique", "La direction des soins uniquement", "Le service des admissions", "L’équipe de prévention du risque infectieux"], ok: 3,
          why: "Les coordonnées sont sur le diaporama et les affiches du service. Il s’agit de l’EPRI / EOH.", src: "Diaporama EPRI précautions respiratoires (09/2026) diap. 7 · critère 2.2-09" }
      ]
    },
    trans2: {
      th: "transfusion", title: "Le guide transfusionnel de l’hôpital",
      questions: [
        { id: "TRA-011", theme: "transfusion", q: "Quand une carte de groupe sanguin est-elle valide ?",
          opts: ["Quand elle a été remplie par l’infirmière du service et signée par le médecin, même sans contrôle du laboratoire", "Quand elle comporte deux déterminations du laboratoire de l’hôpital ou de référence (EFS, CNRHP)", "Dès qu’elle comporte une seule détermination réalisée par un laboratoire de référence", "Quand le patient la présente, quelle que soit son origine, sans autre vérification de l’équipe"], ok: 1,
          why: "Toute autre carte est refusée, sauf en cas d’urgence vitale immédiate. Les deux déterminations sont réalisées par le laboratoire de l’hôpital ou d’un établissement de référence (EFS, CNRHP).", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-2 · critère 2.2-11" },
        { id: "TRA-012", theme: "transfusion", q: "Deux déterminations de groupe le même jour : comment les prélève-t-on ?",
          opts: ["Un seul tube prélevé une fois puis divisé en deux, avec une seule heure notée sur chaque tube", "Un tube le matin et la copie de la carte du patient le soir, sans second prélèvement", "Par deux infirmières et deux abords différents, ou par la même infirmière à deux moments différents", "Deux tubes prélevés en même temps sur le même bras par la même infirmière, avec une seule heure notée"], ok: 2,
          why: "Il est impératif de demander au patient de décliner son identité avant chaque prélèvement. Les heures sont notées sur les tubes.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-2 · critère 2.2-11" },
        { id: "TRA-013", theme: "transfusion", q: "Quand colle-t-on l’étiquette sur le tube de prélèvement ?",
          opts: ["Avant d’aller dans la chambre, pour gagner du temps", "À la réception du tube au laboratoire", "Au poste de soins, avant la prescription", "Jamais avant le prélèvement"], ok: 3,
          why: "On remplit l’étiquette manuscrite après le prélèvement, en faisant relire l’identité par le patient si son état le permet.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-1-1 · critère 2.2-11" },
        { id: "TRA-014", theme: "transfusion", q: "Quelle est la durée de validité d’une recherche d’agglutinines irrégulières (RAI) avant une transfusion ?",
          opts: ["72 heures", "24 heures après le prélèvement", "7 jours, quelle que soit la situation du patient", "1 mois, sans nouvelle détermination"], ok: 0,
          why: "La RAI est obligatoire avant toute transfusion de CGR.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §2-2 · critère 2.2-11" },
        { id: "TRA-015", theme: "transfusion", q: "Que doit comprendre l’information donnée par le médecin avant une transfusion ?",
          opts: ["Rien si le patient est âgé, l’information étant donnée à la famille", "La justification de la transfusion, les bénéfices attendus et les risques transfusionnels", "Uniquement le prix du produit et l’organisation de la transfusion dans le service", "Uniquement la durée de la transfusion et le nombre de poches prévues"], ok: 1,
          why: "Le médecin trace l’information dans le dossier et remet un document d’information pré-transfusionnel. L’information comprend aussi la recherche d’antécédents transfusionnels.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1 · critère 2.2-11" },
        { id: "TRA-016", theme: "transfusion", q: "Que fait l’infirmière pour informer le patient ?",
          opts: ["Elle informe uniquement la famille et laisse le patient sans explication sur les réactions possibles", "Elle informe le patient une fois la transfusion terminée, en traçant l’information après coup", "Elle explique les réactions possibles, vérifie que le patient a compris et trace l’information", "Elle laisse le médecin informer seul, sans vérifier la compréhension du patient ni tracer"], ok: 2,
          why: "Elle vérifie aussi la présence de deux déterminations de groupe sur la carte. Elle s’assure aussi que la prescription du PSL et du débit est faite.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1 · critère 2.2-11" },
        { id: "TRA-017", theme: "transfusion", q: "Quand informe-t-on un patient inconscient ?",
          opts: ["Jamais, car il ne peut pas comprendre l’information", "Avant, en informant le voisin de chambre", "Une semaine plus tard, une fois sorti du service", "À postériori, après la transfusion"], ok: 3,
          why: "Cette règle est prévue par le guide pour les patients inconscients.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-1 · critère 2.2-11" },
        { id: "TRA-018", theme: "transfusion", q: "Comment transporte-t-on les PSL du dépôt vers l’unité de soins ?",
          opts: ["Dans un sac isotherme dédié, un sac par patient et par type de produit", "Dans une poche plastique ordinaire, sans conditionnement particulier", "Dans la poche de la blouse de l’agent, pour aller plus vite", "Plusieurs patients dans le même sac isotherme pour limiter les trajets"], ok: 0,
          why: "L’agent remet le sac et les documents en mains propres à l’infirmière en charge de la transfusion. Le sac est dédié au transport intra-hospitalier.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-2 · critère 2.2-11" },
        { id: "TRA-019", theme: "transfusion", q: "Un agent peut-il récupérer en même temps des PSL pour deux patients du même service ?",
          opts: ["Oui, à condition d’aller vite et de prévenir le dépôt", "Non : un délai de 30 minutes entre les deux transports", "Oui, dans le même sac isotherme pour limiter les trajets", "Oui, s’ils ont le même groupe sanguin et appartiennent au même service"], ok: 1,
          why: "Cela limite le risque d’erreur de patient.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-2 · critère 2.2-11" },
        { id: "TRA-020", theme: "transfusion", q: "Que vérifie-t-on lors de la concordance des documents à la réception ?",
          opts: ["Uniquement la date de péremption et l’aspect de la poche, sans contrôle des documents ni de l’étiquette", "Rien, le dépôt a déjà vérifié tous les documents avant la délivrance", "La concordance de l’identité du receveur entre les documents et l’étiquette du PSL", "Uniquement le nom du service demandeur, indiqué sur la fiche de délivrance"], ok: 2,
          why: "Toute discordance impose de contacter le dépôt. Les documents concernés sont la prescription, la fiche de délivrance, le groupage et la RAI.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-3 · critère 2.2-11" },
        { id: "TRA-021", theme: "transfusion", q: "Pendant combien de temps un PSL peut-il être gardé dans l’unité de soins avant la transfusion ?",
          opts: ["24 heures au réfrigérateur du service", "Aussi longtemps que nécessaire", "30 secondes", "6 heures maximum, à température ambiante au lit du patient"], ok: 3,
          why: "Au-delà de 6 heures, aucun PSL ne doit être stocké dans les unités de soins.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4 · critère 2.2-11" },
        { id: "TRA-022", theme: "transfusion", q: "Un PSL n’a pas été transfusé. Que fait-on ?",
          opts: ["On le retourne au dépôt avec les fiches de délivrance remplies", "On le jette dans le sac DASRI de l’unité, en le traçant dans le dossier", "On le met au réfrigérateur du service en attendant une prochaine utilisation", "On le garde pour un autre patient du même service ayant le même groupe"], ok: 0,
          why: "Le dépôt procède à la destruction pour assurer la traçabilité. Il est interdit de le détruire dans l’unité.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4 · critère 2.2-11" },
        { id: "TRA-023", theme: "transfusion", q: "Dans quel délai un plasma frais congelé (PFC) doit-il être posé après décongélation ?",
          opts: ["Il peut être recongelé tant que la poche n’a pas été ouverte", "Moins de 6 heures, et il ne doit jamais être recongelé", "24 heures", "48 heures"], ok: 1,
          why: "La décongélation se fait uniquement au dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-4 · critère 2.2-11" },
        { id: "TRA-024", theme: "transfusion", q: "Où conserve-t-on un concentré plaquettaire ?",
          opts: ["Au congélateur du dépôt, jusqu’au moment de la pose", "Dans le frigo à médicaments, à côté des autres produits du service", "À température ambiante : jamais au réfrigérateur", "Au réfrigérateur du service, dans un bac réservé aux produits sanguins"], ok: 2,
          why: "Il est transfusé le plus rapidement possible.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-3-1 et §5-3-4 · critère 2.2-11" },
        { id: "TRA-025", theme: "transfusion", q: "Qui effectue le contrôle ultime et pose la transfusion ?",
          opts: ["Deux soignants qui se partagent les étapes", "L’aide-soignante", "N’importe quel professionnel présent", "La même infirmière, du début à la fin"], ok: 3,
          why: "Le test est réalisé dans sa totalité et sans interruption au lit du malade (unité de lieu, de temps et d’action).", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 et §5-4-3 · critère 2.2-11" },
        { id: "TRA-026", theme: "transfusion", q: "Le contrôle ultime pré-transfusionnel est-il obligatoire en urgence vitale ?",
          opts: ["Oui : aucune dérogation, même en urgence, en transfusion massive ou chez le nouveau-né", "Non, en urgence vitale on le fait après la transfusion, une fois le patient stabilisé et le médecin prévenu", "Seulement pour le premier CGR, les suivants étant contrôlés à l’œil", "Seulement si le médecin le demande expressément dans la prescription"], ok: 0,
          why: "Les accidents mortels d’incompatibilité ABO sont toujours liés à une erreur dans la réalisation de ce contrôle.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 et §7 · critère 2.2-11" },
        { id: "TRA-027", theme: "transfusion", q: "Combien de cartes de contrôle ultime pour trois CGR transfusés successivement ?",
          opts: ["Aucune pour les CGR suivants", "Une carte par CGR", "Une seule pour les trois", "Deux"], ok: 1,
          why: "Le contrôle est refait à chaque unité transfusée.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 · critère 2.2-11" },
        { id: "TRA-028", theme: "transfusion", q: "À l’issue du test, une agglutination est présente sur le culot mais absente chez le receveur. Que fait-on ?",
          opts: ["On refait le test jusqu’à obtenir un bon résultat, puis on transfuse", "On transfuse si le patient est stable et que la prescription est claire", "On ne transfuse pas (risque vital) et on prévient le médecin", "On transfuse lentement en surveillant le patient de près"], ok: 2,
          why: "En cas de doute ou de lecture difficile, l’IDE prévient aussi le médecin responsable et le dépôt de sang. On prévient aussi le dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-2 · critère 2.2-11" },
        { id: "TRA-029", theme: "transfusion", q: "Que peut-on injecter dans la tubulure de transfusion ?",
          opts: ["Un antibiotique, injecté en même temps que le produit", "Un antalgique en cas de douleur pendant la transfusion", "Un autre produit compatible avec le produit sanguin", "Uniquement du NaCl à 0,9 %"], ok: 3,
          why: "On utilise une tubulure spéciale avec filtre : 1 PSL, 1 transfuseur, 1 carte de contrôle ultime.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-1 · critère 2.2-11" },
        { id: "TRA-030", theme: "transfusion", q: "Le patient doit-il être à jeun pour être transfusé ?",
          opts: ["Non : ce n’est pas nécessaire", "Oui, 6 heures", "Oui, pour les CGR uniquement", "Oui, et sans fièvre"], ok: 0,
          why: "La fièvre n’est pas une contre-indication à la transfusion.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3 · critère 2.2-11" },
        { id: "TRA-031", theme: "transfusion", q: "Quelle est la durée maximale de transfusion d’un CGR ?",
          opts: ["Toute la nuit, afin de ménager le repos du patient", "2 heures, sauf contre-indication médicale", "30 minutes, quel que soit l’état du patient", "6 heures, quelle que soit la prescription"], ok: 1,
          why: "La durée est indiquée dans la prescription ; pour un sujet âgé, le médecin peut prévoir plus long. Contre-indications médicales : affection cardiaque, sujet âgé.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3 · critère 2.2-11" },
        { id: "TRA-032", theme: "transfusion", q: "Comment surveille-t-on le début de la transfusion ?",
          opts: ["On surveille seulement à la fin, quand la poche est terminée, pour ne pas déranger le patient", "On laisse le patient seul pour le rassurer", "Présence auprès du patient 15 minutes, constantes toutes les 5 minutes", "On revient au bout d’une heure"], ok: 2,
          why: "Constantes suivies : fréquence cardiaque, pression artérielle, température, saturation, fréquence respiratoire, conscience.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3 · critère 2.2-11" },
        { id: "TRA-033", theme: "transfusion", q: "Jusqu’à quand surveille-t-on le patient après la transfusion ?",
          opts: ["30 minutes", "24 heures", "Il n’y a pas de surveillance après", "Jusqu’à 2 heures après"], ok: 3,
          why: "L’administration est notée dans le plan de soins (transmission ciblée).", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-3 · critère 2.2-11" },
        { id: "TRA-034", theme: "transfusion", q: "Combien de temps conserve-t-on la poche vide et la carte de contrôle ultime ?",
          opts: ["Au minimum 4 heures et au maximum 24 heures à température ambiante", "On les jette immédiatement", "1 semaine au réfrigérateur, dans le service, quel que soit le déroulement de la transfusion", "Elles partent avec le patient"], ok: 0,
          why: "On les place dans un sac plastique avec le transfuseur, puis filière DASRI. On les conserve dans l’unité, en l’absence d’incident.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §5-4-5 · critère 2.2-11" },
        { id: "TRA-035", theme: "transfusion", q: "Où déclare-t-on un incident transfusionnel ?",
          opts: ["Nulle part, le médecin prescripteur s’en charge seul sans autre signalement dans l’établissement", "BlueKanGo : catégorie « Vigilances réglementaires », sous-catégorie hémovigilance", "Uniquement dans les transmissions du dossier de soins du patient", "Dans Easily uniquement, à la rubrique des évènements du dossier patient"], ok: 1,
          why: "On signale aussi immédiatement l’incident au dépôt de sang.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §8 · critère 2.2-11" },
        { id: "TRA-036", theme: "transfusion", q: "Premiers gestes face à une manifestation anormale pendant une transfusion ?",
          opts: ["Retirer immédiatement la voie veineuse et la poche sans prévenir le médecin", "Attendre la fin de la poche pour évaluer ensuite la tolérance du patient", "Arrêt immédiat, maintien de l’abord veineux, prise en charge médicale", "Ralentir le débit de la perfusion et poursuivre la transfusion"], ok: 2,
          why: "On surveille fréquence cardiaque, pression artérielle, fréquence respiratoire, température, couleur des téguments et des urines, douleurs et diurèse. La surveillance du patient est intensifiée.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §8 · critère 2.2-11" },
        { id: "TRA-037", theme: "transfusion", q: "Que remet-on au patient transfusé à sa sortie ?",
          opts: ["Rien de spécial : la sortie se déroule comme pour tout autre patient, sans document ni ordonnance", "Uniquement la facture de son séjour, sans document lié à la transfusion", "Uniquement une ordonnance d’antalgique pour les suites de la transfusion", "Sa carte de groupe, l’information écrite sur la transfusion et l’ordonnance de RAI"], ok: 3,
          why: "Le document d’information porte l’identité du patient, l’UF, la date du séjour, la nature et la quantité des produits et la signature du médecin. L’ordonnance de RAI est à réaliser à 1 à 3 mois.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §6-2 · critère 2.2-11" },
        { id: "TRA-038", theme: "transfusion", q: "Une personne ayant reçu un produit sanguin labile peut-elle donner son sang ?",
          opts: ["Non, elle est définitivement exclue du don", "Oui, après 6 mois", "Oui, après 1 an", "Oui, sans condition"], ok: 0,
          why: "Le patient doit en être informé. Une exception existe pour les groupes rares.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §6-2 · critère 2.2-11" },
        { id: "TRA-039", theme: "transfusion", q: "Urgence vitale immédiate chez un homme dont le groupe n’est pas connu : quels CGR transfuse-t-on ?",
          opts: ["Du plasma uniquement, en attendant le groupe du patient", "Des CGR O positif Kell négatif, sans attendre les résultats", "On attend le résultat du groupe avant toute transfusion", "Des CGR AB positif, quel que soit le sexe du patient"], ok: 1,
          why: "Pour une femme de moins de 50 ans : O négatif ccddee Kell négatif. On prélève le patient avant la transfusion pour groupage et RAI.", src: "Guide des pratiques transfusionnelles HSV (août 2023) §7 · critère 2.2-11" }
      ]
    },
    urg3: {
      th: "urgences", title: "Arrêt cardiaque et chariot d’urgence (HSV)",
      questions: [
        { id: "URG-015", theme: "urgences", q: "Comment constate-t-on un arrêt cardio-respiratoire ?",
          opts: ["Patient qui parle mais pâle", "Patient dont la tension est basse", "Patient inconscient qui ne respire plus (ou gasps)", "Patient endormi qui répond à l’appel"], ok: 2,
          why: "La recherche de respiration dure 10 secondes, après avoir mis la tête en arrière. La constatation se fait après libération des voies aériennes.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 1 · critère 2.2-12" },
        { id: "URG-016", theme: "urgences", q: "Quelles informations donne-t-on lors de l’alerte ?",
          opts: ["Uniquement le nom du patient, le reste sera précisé plus tard par téléphone", "Uniquement le service, sans préciser l’étage ni la chambre du patient", "Rien, on rappelle plus tard, une fois le patient pris en charge", "Son nom, le service, l’étage, le numéro de chambre et le motif d’appel"], ok: 3,
          why: "L’heure de l’arrêt correspond au « no flow ». L’heure de l’arrêt, si elle est connue, est aussi donnée.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 1 · critère 2.2-12" },
        { id: "URG-017", theme: "urgences", q: "Quelle est la première action après avoir donné l’alerte ?",
          opts: ["Débuter le massage cardiaque externe", "Chercher le dossier patient", "Préparer l’adrénaline", "Poser une voie veineuse"], ok: 0,
          why: "Un tiers fait ramener le chariot d’urgence et pose le DSA le plus vite possible.", src: "10 commandements de l’ACR (fév. 2025) · commandements 3 et 4 · critère 2.2-12" },
        { id: "URG-018", theme: "urgences", q: "Quelles sont les caractéristiques d’un massage cardiaque efficace ?",
          opts: ["Compressions lentes, enfoncement de 10 cm, sur un plan mou pour amortir le geste", "100 à 120 compressions par minute, enfoncement de 5 à 6 cm, bras tendus", "60 compressions par minute, enfoncement de 2 cm, en alternant les mains", "200 compressions par minute, bras fléchis, pour comprimer plus profondément"], ok: 1,
          why: "Le temps de compression est égal au temps de décompression ; le talon de la main est au milieu du thorax. Le massage se fait sur un plan dur si possible.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 2 · critère 2.2-12" },
        { id: "URG-019", theme: "urgences", q: "Quel est le rythme de la réanimation avec un BAVU ?",
          opts: ["5 compressions pour 5 insufflations, en alternance continue", "60 compressions pour 4 insufflations", "30 compressions pour 2 insufflations", "15 compressions pour 1 insufflation"], ok: 2,
          why: "Le BAVU est relié à 15 L/min d’oxygène ; les 2 insufflations durent au plus 5 secondes.", src: "10 commandements de l’ACR (fév. 2025) · commandements 5 et 6 · critère 2.2-12" },
        { id: "URG-020", theme: "urgences", q: "Qui réalise les insufflations quand le BAVU est tenu à deux personnes ?",
          opts: ["La personne qui tient le masque", "Le médecin uniquement", "Personne : on masse en continu", "La personne qui masse, une main sur le thorax"], ok: 3,
          why: "La personne au BAVU maintient le masque à deux mains.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 2 · critère 2.2-12" },
        { id: "URG-021", theme: "urgences", q: "Comment pose-t-on les électrodes du DSA ?",
          opts: ["L’une sous la clavicule droite, l’autre sur la partie gauche sous l’aisselle", "Toutes deux sur l’abdomen, de part et d’autre du nombril, bien collées à la peau", "Sur le dos uniquement, l’une sous chaque omoplate, bien collées à la peau", "Sur les cuisses, une sur chaque cuisse, collées à la peau"], ok: 0,
          why: "Si le patient est porteur d’un pace maker, on pose l’électrode 3 cm en dessous ; on retire les patchs médicamenteux et on évite l’eau. Les électrodes sont collées à la peau.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 3 · critère 2.2-12" },
        { id: "URG-022", theme: "urgences", q: "Peut-on débrancher le DSA en cours de réanimation ?",
          opts: ["Oui, après 5 minutes de réanimation sans résultat", "Non, jamais sans avis médical", "Oui, dès que le patient bouge ou semble reprendre conscience", "Oui, pour changer de personne qui réalise le massage"], ok: 1,
          why: "On met le DSA en place sans interrompre le massage, et on suit ses indications. La bouteille d’oxygène reste à 1 mètre du DSA.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 3 · critère 2.2-12" },
        { id: "URG-023", theme: "urgences", q: "Que prépare l’infirmière pendant la réanimation médicalisée ?",
          opts: ["Une perfusion de glucose uniquement, sans autre matériel avant la décision du médecin de garde", "Rien avant l’arrivée du médecin, qui apporte lui-même tout le matériel nécessaire", "Une voie veineuse périphérique, le matériel d’aspiration et d’intubation, l’adrénaline", "Un traitement antalgique en prévision de la prise en charge de la douleur"], ok: 2,
          why: "L’adrénaline n’est injectée qu’en présence d’un médecin (1 mg toutes les 4 minutes). Elle prépare une voie veineuse périphérique avec du sérum physiologique, et 10 mg d’adrénaline (2 ampoules de 5 mg).", src: "10 commandements de l’ACR (fév. 2025) · commandements 7 à 9 · critère 2.2-12" },
        { id: "URG-024", theme: "urgences", q: "Que transmet-on au médecin à son arrivée ?",
          opts: ["Uniquement le nom du patient, sans détail sur le déroulement de la réanimation", "Uniquement l’heure d’arrivée du médecin, puis il reprend la conduite des opérations", "Rien : le médecin lit le dossier du patient avant de reprendre la réanimation", "L’heure de l’arrêt, le début de la réanimation, le nombre de chocs et les antécédents"], ok: 3,
          why: "Il faut aussi noter les horaires et récupérer le dossier patient. On transmet aussi les directives anticipées.", src: "Chaîne de survie ACR adulte (fév. 2025) · maillon 4 · critère 2.2-12" },
        { id: "URG-025", theme: "urgences", q: "Le chariot d’urgence est sous la responsabilité de…",
          opts: ["Vous, celle de votre cadre de santé", "Du seul cadre de santé, qui en répond seul devant l’équipe", "De la pharmacie, qui en assume seule la responsabilité", "Du service biomédical, qui en assume seul la responsabilité"], ok: 0,
          why: "Il est accessible 24 h sur 24. Cette responsabilité est connue de tous.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 1 et 2 · critère 2.2-12" },
        { id: "URG-026", theme: "urgences", q: "À chaque prise de service, que vérifie-t-on sur le chariot ?",
          opts: ["Rien si la vérification a été faite la veille par l’équipe de nuit ou de jour, sauf alarme", "Le scellé rouge intact, le DSA opérationnel, le BAVU protégé, la bouteille d’oxygène", "Uniquement la date de péremption des médicaments, les autres éléments étant vérifiés plus tard", "Uniquement la propreté du chariot et le rangement des tiroirs"], ok: 1,
          why: "Pour un défibrillateur manuel, le test est quotidien. Le DSA est opérationnel quand le voyant est vert, et la bouteille d’oxygène doit être non vide.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 3 · critère 2.2-12" },
        { id: "URG-027", theme: "urgences", q: "Peut-on recouvrir le chariot d’urgence d’un drap ?",
          opts: ["Oui, la nuit seulement", "Oui, avec un drap propre", "Non, il ne faut jamais le recouvrir", "Oui, pour le protéger de la poussière"], ok: 2,
          why: "Le chariot doit rester visible et accessible, et sa localisation est signalée par un affichage.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 4 · critère 2.2-12" },
        { id: "URG-029", theme: "urgences", q: "Qui réalise la vérification complète du chariot ?",
          opts: ["L’infirmier seul, qui trace ensuite sa vérification dans le classeur du chariot", "Le médecin, qui contrôle seul les péremptions et le matériel du chariot", "La pharmacie seule, qui contrôle les péremptions lors de ses passages", "Un binôme (IDE, AS, AP), notamment pour contrôler les péremptions"], ok: 3,
          why: "Il faut respecter la check-list et entretenir le chariot à chaque vérification. La vérification est aussi faite après chaque utilisation.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 5 à 7 · critère 2.2-12" },
        { id: "URG-030", theme: "urgences", q: "Pourquoi ne retire-t-on pas les injectables de leurs emballages reçus de la pharmacie ?",
          opts: ["Cela facilite la vérification mensuelle", "Pour gagner de la place", "Pour éviter les vols", "Parce que la pharmacie l’exige pour la facturation"], ok: 0,
          why: "Les emballages d’origine permettent de contrôler plus vite la péremption.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · point 8 · critère 2.2-12" },
        { id: "URG-031", theme: "urgences", q: "Un médicament du chariot est périmé ou a été utilisé. Que fait-on ?",
          opts: ["On le remplace par un produit du service", "On remplit la feuille prévue et on renvoie le sachet à la pharmacie", "On le jette sans rien noter", "On le garde jusqu’à la prochaine vérification"], ok: 1,
          why: "En attendant la réception des produits, le chariot est signalé par un scellé de couleur jaune.", src: "Fiche chariot d’urgence en 10 points (nov. 2024) · points 9 et 10 · critère 2.2-12" },
        { id: "URG-032", theme: "urgences", q: "Que trouve-t-on dans le classeur ou le lutin du chariot ?",
          opts: ["Le dossier de chaque patient de l’unité, avec ses prescriptions en cours et ses transmissions", "Aucun document : le chariot ne contient que le matériel et les médicaments d’urgence", "La procédure, la fiche en 10 points, le tableau journalier, la chaîne de survie", "Uniquement le planning du service et la liste du personnel formé aux gestes d’urgence"], ok: 2,
          why: "Il contient aussi la fiche technique de l’aspirateur à mucosités et la chaîne de survie pédiatrique. Il contient aussi la fiche technique DSA et la fiche de traçabilité de l’ACR.", src: "Diaporama chariots d’urgence HSV (mai 2025) · diap. 6 · critère 2.2-12" },
        { id: "URG-033", theme: "urgences", q: "Que contrôle-t-on dans le tableau de vérification journalière ?",
          opts: ["Uniquement la température de la pièce où le chariot est rangé", "Uniquement le stock de médicaments, avec leurs dates de péremption", "Les clés du service, le téléphone et le cahier de transmissions", "Le scellé, le DSA, l’aspirateur à mucosités et la bouteille d’oxygène"], ok: 3,
          why: "Le tableau est signé par le vérificateur à chaque contrôle. Le contrôle se fait de jour comme de nuit.", src: "Diaporama chariots d’urgence HSV (mai 2025) · diap. 9 · critère 2.2-12" },
        { id: "URG-034", theme: "urgences", q: "En EHPAD ou en CMP, qui alerte-t-on en cas d’arrêt cardio-respiratoire ?",
          opts: ["Le médecin traitant", "Le 18 (pompiers)", "Le 15 (SAMU)", "La famille du patient"], ok: 2,
          why: "La suite de la chaîne de survie est identique. On fait ramener le chariot ou le sac d’urgence.", src: "Chaîne de survie ACR en EHPAD et CMP (fév. 2025) · critère 2.2-12" },
        { id: "URG-035", theme: "urgences", q: "Que doit-on faire avant de chercher le chariot d’urgence ?",
          opts: ["Appeler la famille pour l’informer de la dégradation de l’état du patient", "Débuter le massage cardiaque et faire ramener le chariot", "Aller chercher le chariot soi-même, puis revenir débuter le massage", "Attendre l’arrivée du médecin avant de débuter le massage cardiaque"], ok: 1,
          why: "La personne qui commence la réanimation ne quitte pas le patient. Le chariot est ramené par une tierce personne.", src: "10 commandements de l’ACR (fév. 2025) · commandement 4 · critère 2.2-12" }
      ]
    },
    hyg6: {
      th: "hygiene", title: "Précautions contact, gale et AES (HSV)",
      questions: [
        { id: "HYG-036", theme: "hygiene", q: "À quoi servent les précautions complémentaires contact (PCC) ?",
          opts: ["À isoler tous les patients hospitalisés", "À compléter les précautions standard, pour les infections transmises par contact", "À remplacer les précautions standard", "À prévenir les infections transmises par voie aérienne"], ok: 1,
          why: "Elles s’appliquent au personnel, aux intervenants extérieurs, aux étudiants et aux visiteurs. Le contact peut être direct ou indirect.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §3 · critère 2.2-09" },
        { id: "HYG-037", theme: "hygiene", q: "Qui décide de mettre en place et de lever les PCC ?",
          opts: ["Le cadre de santé seul, sans prescription médicale", "Le patient ou sa famille, selon leur souhait", "Le médecin, par prescription médicale, ou l’EPRI pour les BHRe", "L’aide-soignant, selon ce qu’il observe au chevet"], ok: 2,
          why: "Pour les BHRe, l’EPRI peut aussi décider de ces précautions. L’information du patient (dépliant du CLIN sur les BMR) doit être faite et tracée.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §3 · critère 2.2-09" },
        { id: "HYG-038", theme: "hygiene", q: "Quelles bactéries multirésistantes relèvent des PCC ?",
          opts: ["Uniquement le SARM, seule bactérie multirésistante concernée", "Uniquement les BHRe, qui relèvent seules des PCC", "Aucune : seulement les virus, les bactéries n’étant pas concernées", "L’EBLSE, le SARM et l’Acinetobacter baumannii"], ok: 3,
          why: "Les BHRe (ERG/ERV, EPC) relèvent d’une procédure spécifique. L’Acinetobacter baumannii concerné est multirésistant.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4 · critère 2.2-09" },
        { id: "HYG-039", theme: "hygiene", q: "Un patient est porteur d’une BHRe. Que fait-on ?",
          opts: ["On se réfère à la procédure spécifique", "On applique les précautions standard seules", "On le traite comme un patient ordinaire", "On le transfère sans prévenir"], ok: 0,
          why: "Les BHRe : entérocoques résistants à la vancomycine et entérobactéries productrices de carbapénémase. La procédure spécifique distingue les porteurs de BHRe, les contacts à haut risque et les contacts modérés.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4 · critère 2.2-09" },
        { id: "HYG-040", theme: "hygiene", q: "Laquelle de ces situations relève des PCC ?",
          opts: ["Une hypertension artérielle sans infection associée", "Une conjonctivite virale", "Une tuberculose pulmonaire, suivie en précautions contact", "Une fracture du col du fémur sans plaie"], ok: 1,
          why: "Autres exemples : diarrhées infectieuses (rotavirus, salmonellose…), impétigo, varicelle, zona, hépatite A, bronchiolite, abcès drainé, poux. Une tuberculose relève des précautions respiratoires.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §4 · critère 2.2-09" },
        { id: "HYG-041", theme: "hygiene", q: "Comment signale-t-on les PCC ?",
          opts: ["Par une étiquette sur le lit du voisin, visible uniquement du personnel soignant", "Par aucun affichage, pour la confidentialité, ni dans le dossier du patient", "Dans le dossier médical et par un logo triangulaire bleu sur la porte", "Par une affiche dans le couloir, visible de tous les visiteurs et des patients"], ok: 2,
          why: "Le logo bleu signale les PCC à toute personne qui entre. Le dossier peut être médical et/ou informatisé, et la planification est aussi concernée.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2 · critère 2.2-09" },
        { id: "HYG-042", theme: "hygiene", q: "Quel type de chambre pour des PCC ?",
          opts: ["Une chambre double", "Une chambre commune avec rideau", "Le couloir", "Une chambre individuelle avec WC individuels"], ok: 3,
          why: "L’entretien se fait en fin de programme avec le produit détergent/désinfectant habituel.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2 · critère 2.2-09" },
        { id: "HYG-043", theme: "hygiene", q: "Quelle protection porte le soignant en contact rapproché en PCC ?",
          opts: ["Un tablier à usage unique, avec friction hydroalcoolique", "Un masque FFP2 systématique", "Une charlotte et des surchaussures systématiques", "Aucune protection"], ok: 0,
          why: "Un masque chirurgical est ajouté en cas d’infection pulmonaire à SARM. Le port de gants reste limité (précautions standard).", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2 · critère 2.2-09" },
        { id: "HYG-044", theme: "hygiene", q: "Quand peut-on admettre un nouveau patient dans une chambre où des PCC ont été appliquées ?",
          opts: ["Jamais dans la même chambre, même après entretien et désinfection", "Immédiatement après l’entretien de la chambre", "Après 48 heures, quel que soit l’entretien réalisé", "Après 15 jours, une fois la chambre entièrement vidée"], ok: 1,
          why: "L’entretien se fait avec le produit détergent/désinfectant habituel.", src: "Procédure Précautions Complémentaires Contact (HSV-EPRI-PRO-0464) · §5.2 · critère 2.2-09" },
        { id: "HYG-045", theme: "hygiene", q: "Quel est l’agent responsable de la gale ?",
          opts: ["Une bactérie qui colonise la peau", "Un champignon de la peau", "Un ectoparasite, le sarcopte", "Un virus à transmission cutanée"], ok: 2,
          why: "La gale est une maladie contagieuse très prurigineuse. Il pénètre la couche superficielle de la peau.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2 · critère 2.2-09" },
        { id: "HYG-046", theme: "hygiene", q: "Comment la gale se transmet-elle ?",
          opts: ["Par voie aérienne à distance, sans contact avec le patient ni avec ses affaires", "Par l’eau du robinet, lors de la toilette quotidienne des patients", "Par l’alimentation, lors du partage des repas", "Par contact direct étroit, prolongé ou répété, ou indirect"], ok: 3,
          why: "Le linge et la literie peuvent transmettre surtout dans les formes hyperkératosiques et profuses. Le contact indirect passe par les tissus et la literie ; il est plus rare, sauf formes profuses ou hyperkératosiques.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2 · critère 2.2-09" },
        { id: "HYG-047", theme: "hygiene", q: "Quelle est la durée d’incubation de la gale ?",
          opts: ["De 1 à 6 semaines, en moyenne 3 semaines", "Quelques heures seulement après le contact", "24 à 48 heures, quelle que soit l’infestation", "Plusieurs mois, selon l’importance de l’infestation"], ok: 0,
          why: "Elle dépend de l’importance de l’infestation.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §2 · critère 2.2-09" },
        { id: "HYG-048", theme: "hygiene", q: "Qui pose le diagnostic de gale ?",
          opts: ["Le biologiste seul, sans examen clinique", "Un médecin ou un dermatologue", "L’aide-soignant qui a vu les lésions", "Le patient, d’après ses démangeaisons"], ok: 1,
          why: "Un prélèvement parasitologique peut le confirmer, notamment dans les formes atypiques. Le diagnostic repose principalement sur la clinique.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5 · critère 2.2-09" },
        { id: "HYG-049", theme: "hygiene", q: "Quels sont les signes de la gale commune ?",
          opts: ["Aucune démangeaison, mais des lésions étendues du visage", "Fièvre élevée et toux persistante, sans démangeaison cutanée", "Prurit intense à recrudescence nocturne, sillons et vésicules perlées", "Prurit uniquement diurne, avec des lésions du visage et du dos dès le début"], ok: 2,
          why: "Localisations : espaces interdigitaux, poignets, coudes, aisselles, fesses, organes génitaux. Le dos et le visage sont habituellement épargnés.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.1 · critère 2.2-09" },
        { id: "HYG-050", theme: "hygiene", q: "Pourquoi la gale hyperkératosique est-elle un piège diagnostique ?",
          opts: ["Elle n’est jamais contagieuse, ce qui explique qu’on la néglige", "Elle touche uniquement les enfants, qui sont rarement examinés", "Elle ne touche que les mains, ce qui la rend facile à repérer", "Prurit absent ou modéré alors qu’elle est très contagieuse"], ok: 3,
          why: "Elle survient surtout en cas d’immunodépression ou chez des sujets âgés vivant en collectivité, et peut atteindre tout le corps, y compris visage, cuir chevelu, ongles.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.1 · check-list §1 · critère 2.2-09" },
        { id: "HYG-051", theme: "hygiene", q: "Qu’est-ce qu’un cas probable de gale ?",
          opts: ["Un sujet avec prurit ou lésions hyperkératosiques, au contact d’un cas certain", "Un sujet qui a simplement entendu parler d’un cas", "Un sujet sans aucun symptôme ni contact", "Un sujet guéri depuis un an"], ok: 0,
          why: "Un cas certain a un prurit avec lésions caractéristiques et un diagnostic clinique posé par un médecin, ou des sarcoptes au prélèvement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.2 · critère 2.2-09" },
        { id: "HYG-052", theme: "hygiene", q: "À quel cercle de contact appartient un soignant qui réalise des soins de nursing ?",
          opts: ["À aucun cercle, les soins de nursing n’exposant pas", "Au 1er cercle", "Au 2e cercle, avec les personnes de la collectivité", "Au 3e cercle, comme les visiteurs occasionnels"], ok: 1,
          why: "2e cercle : personnes vivant ou travaillant dans la même collectivité ; 3e cercle : visiteurs occasionnels.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §5.3 · critère 2.2-09" },
        { id: "HYG-053", theme: "hygiene", q: "Quelles précautions met-on en place dès la suspicion de gale ?",
          opts: ["Un masque FFP2 seul, sans autre protection ni signalisation sur la porte", "Une chambre à pression négative, avec masque FFP2 pour tout professionnel qui entre dans la chambre", "Logo « Précautions contact + Ga » sur la porte, surblouse à manches longues et gants", "Aucune précaution particulière avant la confirmation du diagnostic par un médecin"], ok: 2,
          why: "Une unité mobile de protection avec le matériel adéquat est installée. Surblouse et gants sont portés dès l’entrée. Les sorties sont limitées et la marche en avant est respectée.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 · critère 2.2-09" },
        { id: "HYG-054", theme: "hygiene", q: "Après retrait des gants, comment se désinfecte-t-on les mains en cas de gale ?",
          opts: ["Friction hydroalcoolique seule, sans lavage préalable à l’eau", "Aucun lavage nécessaire si les gants n’ont pas été souillés", "Lavage à l’eau seule, sans savon ni friction hydroalcoolique", "Lavage à l’eau et au savon, puis friction hydroalcoolique"], ok: 3,
          why: "Les consignes de lavage sont spécifiques à la gale.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 · critère 2.2-09" },
        { id: "HYG-055", theme: "hygiene", q: "Jusqu’à quand maintient-on les précautions contact spécifiques gale ?",
          opts: ["Jusqu’à 48 heures après le traitement du patient et de l’environnement", "Jusqu’à la disparition des démangeaisons, même si le traitement a été pris correctement", "Pendant 1 semaine fixe, quelle que soit la date de prise du traitement", "Jusqu’à la sortie du patient, même après le traitement de son environnement"], ok: 0,
          why: "Les démangeaisons peuvent persister 2 à 4 semaines sans signifier un échec du traitement. Le traitement concerne le patient et son environnement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 et §6.2.1 · critère 2.2-09" },
        { id: "HYG-056", theme: "hygiene", q: "En cas de gale commune, quels contacts traite-t-on ?",
          opts: ["Les visiteurs uniquement, quel que soit leur contact", "Les contacts du 1er cercle", "Tous les patients du service, qu’ils aient été en contact ou non", "Uniquement le patient atteint, sans traiter son entourage"], ok: 1,
          why: "En cas de gale profuse, hyperkératosique ou d’épidémie : 1er et 2e cercle, voire 3e.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2 · critère 2.2-09" },
        { id: "HYG-057", theme: "hygiene", q: "Que fait-on des professionnels contacts ?",
          opts: ["Ils sont mis en arrêt sans évaluation", "Ils se traitent seuls", "Ils sont adressés à la médecine du travail", "Ils continuent sans avis"], ok: 2,
          why: "En cas de gale avérée chez un soignant, les patients contacts rentrés à domicile reçoivent un courrier d’information et une ordonnance. C’est pour évaluer la nécessité d’un traitement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2 · critère 2.2-09" },
        { id: "HYG-058", theme: "hygiene", q: "Comment administre-t-on l’ivermectine à J1 ?",
          opts: ["En continu pendant 1 mois, au rythme des repas quotidiens", "À jeun uniquement, sans aucune prise alimentaire associée", "En plusieurs prises quotidiennes, réparties au cours de la journée", "En prise unique, au cours ou juste après le repas"], ok: 3,
          why: "La posologie dépend du poids ; elle est contre-indiquée chez l’enfant de moins de 15 kg ou en cas d’allergie. De préférence le soir.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.2 · critère 2.2-09" },
        { id: "HYG-059", theme: "hygiene", q: "Comment applique-t-on un traitement local (topique) ?",
          opts: ["Après une douche, sur tout le corps sauf le visage, en insistant sur les plis", "Sur le visage uniquement, en insistant sur les plis, sans douche préalable", "On l’applique sans se laver au préalable, sur tout le corps, puis on le rince tout de suite", "On le laisse 5 minutes sur le corps entier puis on rince"], ok: 0,
          why: "On met ensuite des sous-vêtements, vêtements et draps propres. Il agit 8 à 24 h puis on rince.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.2 · critère 2.2-09" },
        { id: "HYG-060", theme: "hygiene", q: "Quand traite-t-on l’environnement et le linge ?",
          opts: ["Seulement en cas d’épidémie, une fois les contacts identifiés", "Le lendemain de la prise du traitement (J2), de façon synchrone", "Avant le traitement du patient, pour éviter toute réinfestation", "Une semaine plus tard, une fois le patient guéri"], ok: 1,
          why: "Une synchronisation est indispensable pour éviter les récidives. Le traitement est synchrone pour les cas et les contacts.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.1 et §6.2.3 · critère 2.2-09" },
        { id: "HYG-061", theme: "hygiene", q: "Comment traite-t-on le linge d’un patient atteint de gale ?",
          opts: ["On le jette sans traitement ni lavage préalable", "On l’envoie directement en blanchisserie dans un sac classique", "Acaricide dans un sac hydrosoluble fermé (3 h de contact), puis lavage à 60 °C", "Lavage à 30 °C sans préparation, dans le sac habituel du service, avec le linge courant"], ok: 2,
          why: "Pour les surfaces absorbantes (matelas, siège en tissu) : acaricide et aération pendant 12 h, avec un masque lors de la vaporisation. L’acaricide est vaporisé dans le sac, fermé hermétiquement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.1 et §6.2.3 · critère 2.2-09" },
        { id: "HYG-062", theme: "hygiene", q: "À quel moment répète-t-on le traitement ?",
          opts: ["Il n’est jamais répété, une seule prise suffisant toujours", "À J30, une fois les démangeaisons disparues", "Le lendemain, dès la fin du premier traitement", "Entre J8 et J10, au plus tard à J14"], ok: 3,
          why: "Les produits ne sont pas efficaces sur les œufs qui éclosent après le premier traitement.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.2.4 · critère 2.2-09" },
        { id: "HYG-063", theme: "hygiene", q: "Cas isolé de gale : qui prévient le service de soins ?",
          opts: ["La Direction des soins, l’EPRI et la médecine du travail", "La presse locale", "La famille uniquement", "Aucune alerte n’est nécessaire pour un cas isolé de gale"], ok: 0,
          why: "En cas d’épidémie, la pharmacie est également prévenue.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.3 · critère 2.2-09" },
        { id: "HYG-064", theme: "hygiene", q: "Qui signale une épidémie de gale à l’ARS et comment ?",
          opts: ["Le patient lui-même, dès l’apparition des cas", "L’EPRI, via la plateforme E-sin", "Le cadre du service, par téléphone à l’ARS", "Le médecin traitant"], ok: 1,
          why: "Si de nouveaux cas apparaissent, l’EPRI réévalue la situation.", src: "Mode opératoire gale (HSV-EPRI-MO-0205) · §6.3 · critère 2.2-09" },
        { id: "HYG-065", theme: "hygiene", q: "Quelle est la première règle en cas d’accident avec exposition au sang (AES) ?",
          opts: ["Déclarer l’accident avant tout soin", "Appliquer un pansement sans nettoyer", "Ne jamais faire saigner", "Faire saigner la plaie abondamment"], ok: 2,
          why: "Les 5 réflexes : ne jamais faire saigner, laver, désinfecter, signaler (+/- traiter), déclarer.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { id: "HYG-066", theme: "hygiene", q: "Piqûre ou blessure : que fait-on ?",
          opts: ["On frotte à sec avec un mouchoir jusqu’à ce que la plaie soit propre", "On presse la plaie pour faire saigner, puis on la recouvre d’un pansement", "On ne fait rien si c’est superficiel, sans laver ni désinfecter la plaie", "On lave à l’eau et au savon, puis on immerge la plaie dans du Dakin 5 minutes"], ok: 3,
          why: "L’immersion dans le Dakin dure 5 minutes. On rince abondamment après le lavage.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { id: "HYG-067", theme: "hygiene", q: "Projection dans les yeux : que fait-on ?",
          opts: ["On rince abondamment au sérum physiologique (1 L)", "On se frotte les yeux", "On attend de voir si cela pique avant de décider d’agir", "On applique un collyre antibiotique sans rincer au préalable"], ok: 0,
          why: "Il faut ensuite signaler et déclarer l’accident. Le rinçage dure 5 minutes.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { id: "HYG-068", theme: "hygiene", q: "Après les premiers soins, qui contacte-t-on ?",
          opts: ["La famille du patient, pour l’informer de l’accident", "Le cadre du service et le service des urgences", "Uniquement un collègue, sans prévenir le cadre du service", "La direction financière"], ok: 1,
          why: "On prélève aussi le patient source pour son statut sérologique. Le cadre du service fait la liaison avec le médecin du service.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { id: "HYG-069", theme: "hygiene", q: "Qu’évalue-t-on avec le médecin des urgences ?",
          opts: ["La mise en quarantaine du soignant", "La vaccination contre la grippe", "La nécessité d’un traitement post-exposition au VIH, selon le statut du patient source, celui du soignant et le type d’AES", "La nécessité d’un arrêt de travail systématique"], ok: 2,
          why: "Si un traitement est prescrit, on prend rendez-vous à l’Escale dans les 4 jours. On évalue le statut du patient source (ou l’impossibilité de le prélever), le statut du soignant et le type d’AES.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" },
        { id: "HYG-070", theme: "hygiene", q: "Dans quel délai adresse-t-on les documents administratifs après un AES ?",
          opts: ["Sous 1 mois, par courrier à la Direction du Personnel", "À la fin de l’année", "Il n’y a pas de document à adresser", "Sous 24 heures, à la Direction du Personnel"], ok: 3,
          why: "Le certificat initial est remis par le médecin des urgences, la déclaration d’accident de travail par le cadre du service.", src: "Affiche AES : les bons réflexes (HSV-EPRI-AUT-0692, juillet 2024)" }
      ]
    },
    ident2: {
      th: "identito", title: "Le quiz identitovigilance du DIM",
      questions: [
        { id: "IDE-008", theme: "identito", q: "Qu’est-ce que l’identitovigilance ?",
          opts: ["La vérification annuelle des cartes vitales", "L’organisation qui fiabilise l’identification de l’usager à toutes les étapes", "La seule création du dossier administratif", "Un contrôle réalisé uniquement par le service des admissions lors de l’arrivée de l’usager"], ok: 1,
          why: "Elle comprend l’identitovigilance primaire (attribution d’une identité propre à la création du dossier) et secondaire (vérification tout au long de la prise en charge), ainsi que la surveillance et le signalement des erreurs. Cette organisation concerne la prise en charge de l’usager.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q1 · critère 2.2-01" },
        { id: "IDE-009", theme: "identito", q: "Qu’est-ce que l’identitovigilance secondaire ?",
          opts: ["La fusion des doublons par le DIM", "La demande de la carte vitale", "La vérification de l’identité du patient avant tout acte", "La création de l’identité du patient à l’admission"], ok: 2,
          why: "Elle s’applique à toutes les spécialités, quel que soit le métier. Elle est réalisée tout au long de la prise en charge, par tous les professionnels.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q1 · critère 2.2-01" },
        { id: "IDE-010", theme: "identito", q: "La vérification de l’identité du patient est…",
          opts: ["Réservée aux infirmiers", "Réservée à l’accueil administratif", "Facultative si le patient est connu du service et déjà identifié par un collègue", "Le premier acte de soin, à réaliser par tous les professionnels"], ok: 3,
          why: "Il s’agit de vérifier que le patient qui bénéficie de l’acte (soin, radio, transfert…) est celui pour lequel il a été prescrit. Cela vaut quel que soit leur métier.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q2 · critère 2.2-01" },
        { id: "IDE-011", theme: "identito", q: "Dans quelles situations vérifie-t-on l’identité d’un patient ?",
          opts: ["Dans toutes : à chaque étape de la prise en charge", "Uniquement à l’admission", "Uniquement avant un geste invasif", "Uniquement la nuit"], ok: 0,
          why: "L’identité doit être vérifiée à chaque soin, chaque examen, chaque transfert. Elle est faite par chaque professionnel.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q3 · critère 2.2-01" },
        { id: "IDE-012", theme: "identito", q: "Pourquoi éviter la question fermée « Vous êtes bien Monsieur Martin ? » ?",
          opts: ["Elle est interdite par la loi en pédiatrie", "Elle expose à une erreur : le patient peut acquiescer à tort", "Elle est trop longue", "Elle est réservée aux médecins"], ok: 1,
          why: "On pose une question ouverte : « Pouvez-vous me donner vos nom, prénom et date de naissance ? ».", src: "Quiz identitovigilance DIM (22 mai 2025) · Q4 · critère 2.2-01" },
        { id: "IDE-013", theme: "identito", q: "Un patient confus, inconscient ou ne parlant pas français : comment vérifie-t-on son identité ?",
          opts: ["On demande à un voisin de chambre ou à un autre patient du service", "On se fie au numéro de chambre inscrit sur la porte", "À l’aide du bracelet ou de tout autre moyen disponible", "On ne vérifie pas, le patient ne pouvant répondre"], ok: 2,
          why: "Le bracelet permet de pallier les difficultés de communication.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q4 · critère 2.2-01" },
        { id: "IDE-014", theme: "identito", q: "Un collègue a déjà vérifié l’identité du patient. Faut-il la vérifier à nouveau ?",
          opts: ["Non, c’est inutile : la vérification d’un collègue fait foi pour toute l’équipe", "Seulement la nuit", "Seulement si le patient est agité", "Oui : chaque vérification récupère les erreurs faites en amont"], ok: 3,
          why: "Attention au faux sentiment de sécurité apporté par les vérifications faites avant ou après votre intervention : la récupération des erreurs évite les accidents.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q5 · critère 2.2-01" },
        { id: "IDE-015", theme: "identito", q: "Deux patients du service ont le même nom de naissance. Que faites-vous ?",
          opts: ["Je mets tout en œuvre pour éviter l’erreur de patient", "Rien : c’est le rôle de l’accueil administratif", "Je ne vérifie que le prénom", "J’inverse les chambres"], ok: 0,
          why: "Réponse retenue par le quiz du DIM : vigilance maximale à chaque vérification d’identité.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q7 · critère 2.2-01" },
        { id: "IDE-016", theme: "identito", q: "Que signifie INS et à quoi sert-elle ?",
          opts: ["Information Nominative Sécurisée, valable un an et renouvelée à chaque séjour", "Identité Nationale de Santé : un identifiant unique et pérenne", "Indice National de Soins, utilisé pour la facturation des séjours par chaque établissement", "Identifiant Numérique du Séjour, propre à chaque établissement"], ok: 1,
          why: "Le référentiel national d’identitovigilance (RNIV) définit les exigences et recommandations de bonnes pratiques. Cet identifiant est utilisé par tous les acteurs de santé qui prennent en charge le patient.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q9 · critère 2.2-01" },
        { id: "IDE-017", theme: "identito", q: "Quel élément ne figure PAS dans l’INS ?",
          opts: ["Le premier prénom de naissance", "Le lieu de naissance", "Le nom d’usage (nom usuel)", "Le nom de naissance"], ok: 2,
          why: "L’INS comprend le matricule INS, les 5 traits stricts (date de naissance, genre, nom de naissance, premier prénom de naissance, lieu de naissance) et l’identifiant de la structure (OID). Le nom usuel peut changer (mariage, divorce…).", src: "Quiz identitovigilance DIM (22 mai 2025) · Q10 · critère 2.2-01" },
        { id: "IDE-018", theme: "identito", q: "Qu’est-ce qui permet d’intégrer les données de santé d’un patient dans le DMP ?",
          opts: ["Le numéro de chambre", "L’identifiant de séjour", "Le numéro de téléphone du patient", "Une INS qualifiée"], ok: 3,
          why: "Il faut aussi s’assurer de la cohérence entre les traits INS renvoyés par le téléservice et ceux de la personne prise en charge. Elle suppose la vérification d’une pièce d’identité à haut niveau de confiance.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q11 · critère 2.2-01" },
        { id: "IDE-019", theme: "identito", q: "Qu’est-ce qu’un doublon d’identités ?",
          opts: ["Une même personne enregistrée sous deux IPP différents (ou plus)", "Deux personnes différentes enregistrées sous le même IPP, avec un seul dossier", "Deux patients homonymes dans le même service", "Un patient qui change de service"], ok: 0,
          why: "Le patient a alors plusieurs dossiers qui ne communiquent pas entre eux : des informations utiles à la décision médicale peuvent manquer.", src: "Quiz identitovigilance DIM (22 mai 2025) · Q15 · critère 2.2-01" },
        { id: "IDE-020", theme: "identito", q: "Qu’est-ce qu’une collision d’identités et quel est son risque ?",
          opts: ["Une erreur de facturation sans conséquence", "Un même IPP attribué à deux personnes : on peut décider sur les données d’une autre", "Une même personne sous deux IPP : un dossier incomplet qui ne communique pas avec l’autre", "Un patient qui refuse son bracelet"], ok: 1,
          why: "Origines possibles : erreur d’identification primaire (erreur de saisie à l’admission, fiche pompier erronée) ou secondaire (mauvais choix de l’IPP à la création de la venue).", src: "Quiz identitovigilance DIM (22 mai 2025) · Q15 · critère 2.2-01" }
      ]
    },
    sse2: {
      th: "sse", title: "Canicule, grand froid et plan bleu",
      questions: [
        { id: "SSE-009", theme: "sse", q: "Sur quoi s’appuie le plan canicule de l’hôpital ?",
          opts: ["Sur le nombre de climatiseurs disponibles", "Sur la vigilance Météo-France et la surveillance sanitaire de l’ARS", "Uniquement sur la température relevée dans le service", "Sur les décisions du service des urgences seul"], ok: 1,
          why: "Le plan s’appuie sur deux sources : la vigilance Météo-France et la surveillance sanitaire de l’ARS (urgences, hospitalisations, mortalité).", src: "Plan interne canicule (HSV-PB-PRO-0481) · Contexte · critère 3.1-05" },
        { id: "SSE-010", theme: "sse", q: "Combien de niveaux de vigilance météorologique canicule distingue-t-on, et quels sont-ils ?",
