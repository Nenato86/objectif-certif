<style>
/* Layout: une colonne, trois onglets (Jouer, Mon score, Équipe). Les thèmes sont des lignes notées, groupées par chapitre HAS, avec la cible à 100 %. Le quiz prend tout l’écran. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #0E2233;
  --ink-2: #4A5D6C;
  --line: #D5DDE3;
  --track: #E3E9ED;
  --accent: #FBC52A;
  --on-accent: #0E2233;
  --good: #1B7F4B;
  --warn: #A85F00;
  --bad: #B3261E;
  --good-bg: #E3F3EA;
  --bad-bg: #FBE6E4;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1824; --surface: #112437; --ink: #EAF1F6; --ink-2: #9FB2C2; --line: #223A50; --track: #1B3247;
    --accent: #FBC52A; --on-accent: #0E2233; --good: #4CC38A; --warn: #F0A93B; --bad: #FF7A70;
    --good-bg: #12372A; --bad-bg: #3F1D1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1824; --surface: #112437; --ink: #EAF1F6; --ink-2: #9FB2C2; --line: #223A50; --track: #1B3247;
  --accent: #FBC52A; --on-accent: #0E2233; --good: #4CC38A; --warn: #F0A93B; --bad: #FF7A70;
  --good-bg: #12372A; --bad-bg: #3F1D1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band { background: var(--accent); color: var(--on-accent); font-size: 13px; }
.band .wrap { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; padding-block: 8px; }
.band b { font-family: var(--f-mono); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: inherit; font-size: 13px; }
.app { padding-block: 20px 110px; }
.eyebrow { font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; margin: 0; text-wrap: balance; line-height: 1; }
h1 { font-size: clamp(54px, 15vw, 88px); text-transform: uppercase; letter-spacing: -.01em; }
h2 { font-size: 28px; text-transform: uppercase; }
h3 { font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { margin-top: 8px; }
.lede { margin: 12px 0 0; color: var(--ink-2); max-width: 46ch; }
.chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px 6px 6px; border-radius: 999px; font-size: 14px; }
.chip i { font-style: normal; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 800; font-size: 14px; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 20px 28px; align-items: center; margin-top: 24px; padding-block: 20px; border-block: 1px solid var(--line); }
.big { font-family: var(--f-display); font-stretch: 70%; font-weight: 900; font-size: 84px; line-height: .85; font-variant-numeric: tabular-nums; }
.big small { font-size: 34px; margin-left: 2px; }
.cap { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.chmini { display: grid; gap: 10px; min-width: 0; }
.chmini div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.chmini b { font-variant-numeric: tabular-nums; }
.chmini .bar { grid-column: 1 / -1; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.bar.good > span { background: var(--good); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.defi { margin-top: 24px; background: var(--accent); color: var(--on-accent); padding: 18px; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.defi h2 { font-size: 32px; }
.defi p { margin: 6px 0 0; font-size: 15px; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 12px 22px; font-weight: 700; font-size: 16px; min-height: 48px; }
.defi .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); }
.sect { margin-top: 32px; }
.sect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.sect-head span { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; max-width: 62ch; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px 14px 0; align-items: start; }
.row:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.row .name { font-weight: 700; font-size: 17px; line-height: 1.25; min-width: 0; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 6px; }
.refs { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.refs b { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 2px; font-weight: 500; }
.pill { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--ink-2); color: var(--ink-2); white-space: nowrap; }
.pill.imp { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pct { text-align: right; min-width: 74px; }
.pct b { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; display: block; }
.pct b small { font-size: 15px; }
.pct em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.pct em.good { color: var(--good); } .pct em.warn { color: var(--warn); } .pct em.bad { color: var(--bad); }
.row .bar { grid-column: 1 / -1; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 3px; font-size: 13px; color: var(--ink-2); font-weight: 700; border-top: 3px solid transparent; margin-top: -1px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.panel { margin-top: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.stat { border-left: 3px solid var(--accent); padding-left: 10px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-2); }
.field { margin-top: 20px; display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input { border: 1px solid var(--ink-2); background: var(--surface); border-radius: 8px; padding: 12px; min-height: 48px; max-width: 320px; }
.code { font-family: var(--f-mono); font-weight: 500; background: var(--track); padding: 1px 6px; border-radius: 4px; }
.chart { width: 100%; height: auto; display: block; margin-top: 12px; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-2); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .target { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .area { fill: var(--accent); opacity: .3; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
.chart .end { fill: var(--ink); stroke: var(--accent); stroke-width: 3; }
.chart .endlbl { fill: var(--ink); font-size: 12px; font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--ink); }
.tbl td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
.scroll { overflow-x: auto; }
.duel { display: grid; gap: 10px; margin-top: 12px; }
.duel div { display: grid; grid-template-columns: 90px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
.duel .bar { height: 14px; border-radius: 3px; }
.duel .bar span { background: var(--accent); border-radius: 0; }
.duel b { text-align: right; font-variant-numeric: tabular-nums; }
.room { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 12px; }
.room .code { font-size: 28px; letter-spacing: .12em; padding: 4px 12px; }
.quiz { padding-block: 16px 40px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.qtop .linkbtn { font-size: 15px; color: var(--ink); min-height: 44px; }
.qtop .eyebrow { text-align: right; }
.segs { display: flex; gap: 6px; margin-top: 8px; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); }
.segs i.done { background: var(--ink); }
.segs i.now { background: var(--accent); }
.qtheme { margin-top: 24px; }
.qtext { font-size: 22px; line-height: 1.3; font-weight: 700; margin: 8px 0 0; max-width: 40ch; text-wrap: pretty; }
.opts { display: grid; gap: 10px; margin-top: 20px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 56px; font-size: 16px; }
.opt .l { font-family: var(--f-mono); font-weight: 500; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--ink-2); border-radius: 4px; font-size: 13px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .tag { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.opt.right .tag { color: var(--good); } .opt.wrong .tag { color: var(--bad); }
.fb { margin-top: 20px; border-top: 2px solid var(--ink); padding-top: 14px; }
.fb h3 { font-size: 24px; }
.fb h3.good { color: var(--good); } .fb h3.bad { color: var(--bad); }
.fb p { margin: 8px 0 0; max-width: 60ch; }
.src { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.res { margin-top: 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.keep { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.keep li { border-left: 3px solid var(--accent); padding-left: 12px; max-width: 60ch; }
.delta { font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }
@media (max-width: 420px) {
  .score { grid-template-columns: 1fr; }
  .duel div { grid-template-columns: 70px 1fr 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > span { transition: width .5s ease; }
}
/* Palette plus vive : fond crème, indigo, un accent par chapitre (corail, turquoise, violet). */
:root { --bg:#FFF7EA; --surface:#FFFFFF; --ink:#1E1B4B; --ink-2:#5E5A85; --line:#EBDDC6; --track:#F1E6D3; --accent:#FFC233; --on-accent:#1E1B4B; --good:#0B8A5F; --warn:#C45F00; --bad:#D1163F; --good-bg:#DDF7EA; --bad-bg:#FFE3E8; --c1:#FF5A6E; --c2:#0B8F88; --c3:#7C5CFA; }

.band { background:#1E1B4B; color:#FFE9A8; }
.sect-head { border-bottom-color: var(--c, var(--ink)); }

          opts: ["On libère ses voies aériennes et on la place en position latérale de sécurité", "On commence immédiatement les compressions thoraciques", "On la laisse allongée sur le dos", "On l’assoit pour faciliter sa respiration"], ok: 0,
          why: "Une réanimation cardiopulmonaire n’est pas nécessaire tant que la respiration est normale. On libère les voies aériennes et on met en PLS.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { theme: "urgences", q: "Une personne est inconsciente et ne respire pas normalement. Que fait-on ?",
          opts: ["PLS et attendre le médecin", "Compressions thoraciques et insufflations, jusqu’à la reprise d’une respiration normale ou l’arrivée des secours", "Surveiller sa respiration toutes les 10 minutes", "Lui faire respirer de l’oxygène seul"], ok: 1,
          why: "C’est l’arrêt cardiaque : on alerte, on effectue compressions thoraciques et insufflations, et on poursuit jusqu’à la reprise d’une respiration normale ou l’arrivée des secours.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { theme: "urgences", q: "Un patient se plaint d’une douleur qui serre la poitrine, avec sueurs et nausées. Pourquoi faut-il le questionner ?",
          opts: ["Pour remplir le dossier", "Pour que le SAMU puisse juger le degré d’urgence", "Pour le rassurer uniquement", "Ce n’est pas nécessaire, on attend le médecin"], ok: 1,
          why: "Un malaise cardiaque peut aussi comporter des difficultés respiratoires, des sueurs, des nausées. Les informations recueillies permettent au SAMU d’évaluer l’urgence.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" },
        { theme: "urgences", q: "Quelle différence y a-t-il entre une urgence relative et une urgence vitale ?",
          opts: ["Aucune", "L’urgence relative n’engage pas la vie à l’instant T, mais peut se dégrader brutalement et impose une surveillance régulière", "L’urgence relative ne concerne que les enfants", "L’urgence relative se règle toujours sans médecin"], ok: 1,
          why: "Dans l’urgence relative, le facteur temps n’est pas prédominant. C’est le reflet d’une évaluation à un instant T : l’état peut passer en urgence vitale.", src: "Fiche HAS urgences vitales p. 2 · critère 2.2-12" }
      ]
    },
    urg2: {
      th: "urgences", title: "Alerte, chariot et formation",
      questions: [
        { theme: "urgences", q: "Que doit être le numéro d’appel pour une urgence vitale dans l’établissement ?",
          opts: ["Un numéro unique et dédié, joignable 24 h sur 24, affiché dans tous les postes de soins", "Le standard, aux heures ouvrables", "Le téléphone portable du médecin de garde, noté sur un papier", "Un numéro différent selon l’infirmier présent"], ok: 0,
          why: "Un numéro et non une référence (« appeler le réanimateur de garde »). Le médecin qui répond sait tout de suite qu’il s’agit d’une urgence vitale. Chaque professionnel doit connaître ce numéro : posez-vous la question maintenant.", src: "Fiche HAS urgences vitales p. 3 · critère 2.2-12" },
        { theme: "urgences", q: "À quelle fréquence minimale vérifie-t-on le chariot ou le sac d’urgence ?",
          opts: ["Une fois par an", "Au minimum une fois par mois, selon les risques du secteur", "Seulement après utilisation", "Une fois tous les 3 ans"], ok: 1,
          why: "Vérification régulière, au minimum mensuelle. La traçabilité précise la date, le nom du vérificateur, les dates de péremption et l’intégrité des emballages.", src: "Fiche HAS urgences vitales pp. 3-4 · critère 2.2-12" },
        { theme: "urgences", q: "Que doit-on faire après chaque utilisation du chariot d’urgence ?",
          opts: ["Rien, le chariot reste ouvert pour le prochain besoin", "Le vérifier, le compléter et le sceller", "Le remettre sans vérifier, faute de temps", "Le ranger à la pharmacie sans contrôle"], ok: 1,
          why: "Après utilisation, le chariot ou le sac d’urgence est vérifié, complété et scellé. Il est aussi scellé après chaque vérification périodique.", src: "Fiche HAS urgences vitales p. 4 · critère 2.2-12" },
        { theme: "urgences", q: "Qui doit pouvoir connaître la composition du chariot d’urgence de l’unité ?",
          opts: ["Seulement la pharmacie", "Les professionnels qui l’utilisent : elle est définie et adaptée aux profils des patients de l’unité", "Seulement le cadre", "Personne, elle est confidentielle"], ok: 1,
          why: "La composition est définie avec les professionnels habilités à l’utiliser et adaptée aux profils de patients ; les professionnels y ont accès.", src: "Fiche HAS urgences vitales p. 3 · critère 2.2-12" },
        { theme: "urgences", q: "Quelle formation est prioritairement attendue pour les gestes et soins d’urgence ?",
          opts: ["Une formation maison de 15 minutes", "L’AFGSU, avec le niveau 2 obligatoire pour les professionnels du soin, recyclé tous les 4 ans", "Aucune, les médecins s’en chargent", "Uniquement une vidéo à regarder"], ok: 1,
          why: "AFGSU niveau 1 recommandé pour tout le personnel, niveau 2 obligatoire pour les professionnels du soin et recyclé tous les 4 ans. Pensez à vérifier la date de votre dernière formation.", src: "Fiche HAS urgences vitales p. 4 · critère 2.2-12" },
        { theme: "urgences", q: "À quoi servent les exercices de mise en situation in situ ?",
          opts: ["À remplir un tableau de formation", "À évaluer l’ensemble du processus, des premiers symptômes et de l’appel jusqu’à la prise en charge médicale", "À tester seulement le défibrillateur", "À remplacer toute formation"], ok: 1,
          why: "Ces exercices dans le service évaluent toute la chaîne : symptômes, éléments à communiquer lors de l’appel, intervention, résultats.", src: "Fiche HAS urgences vitales pp. 4-5 · critère 2.2-12" },
        { theme: "urgences", q: "Environ quelle proportion des patients survit sans séquelle après un arrêt cardiaque intrahospitalier ?",
          opts: ["80 %", "50 %", "20 %", "5 %"], ok: 2,
          why: "Environ 20 % en moyenne, d’où l’importance d’une organisation rigoureuse : chaque minute compte pour maximiser les chances de survie.", src: "Fiche HAS urgences vitales p. 1 · critère 2.2-12" }
      ]
    },
    ei1: {
      th: "ei", title: "Déclarer et comprendre",
      questions: [
        { theme: "ei", q: "Un soignant évite une erreur de patient juste avant d’administrer un traitement. Faut-il le déclarer ?",
          opts: ["Non, il n’y a pas eu de conséquence", "Oui : un presque accident est un événement porteur de risque à déclarer", "Seulement si le médecin le demande", "Seulement si le patient s’en est aperçu"], ok: 1,
          why: "Le presque accident est un événement indésirable associé aux soins sans conséquence, ou dont les conséquences ont été évitées ou limitées. Il fait partie de ce qu’on attend en déclaration interne : c’est une opportunité d’analyse.", src: "Fiche HAS EIAS pp. 1-2 · critère 1.2-07" },
        { theme: "ei", q: "Quelle situation correspond à un événement indésirable associé aux soins (EIAS) ?",
          opts: ["Une aggravation due à l’évolution naturelle de la maladie", "Un événement défavorable pour le patient, associé aux soins, qui s’écarte des résultats escomptés", "Un retard de livraison de repas sans effet sur le patient", "Une opinion du patient sur la décoration du service"], ok: 1,
          why: "Un EIAS n’est pas lié à l’évolution naturelle de la maladie, est défavorable au patient, associé aux soins, a ou aurait pu avoir des conséquences et s’écarte des attentes du soin.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { theme: "ei", q: "Quelles conséquences font d’un EIAS un événement indésirable grave (EIGS) ?",
          opts: ["Un simple retard de soin", "Le décès, la mise en jeu du pronostic vital ou la survenue probable d’un déficit fonctionnel permanent", "Une réclamation écrite du patient", "Une augmentation de la durée de séjour de 1 jour"], ok: 1,
          why: "Les EIGS ont des conséquences graves : décès, pronostic vital, déficit fonctionnel permanent probable. Ils sont tous à déclarer en interne ; ceux de la définition réglementaire vont aussi au portail national.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { theme: "ei", q: "Un EIGS répond à la définition réglementaire. Que faut-il faire ?",
          opts: ["Attendre le bilan annuel", "Le déclarer systématiquement et sans délai sur le portail national de signalement", "Le traiter seulement dans le service", "Le déclarer seulement si la famille le demande"], ok: 1,
          why: "Il est déclaré sans délai par la gouvernance ou par les professionnels eux-mêmes via le portail national. Si le professionnel l’a déclaré en interne, c’est à la gouvernance de faire la déclaration sur le portail.", src: "Fiche HAS EIAS p. 5 · critère 1.2-07" },
        { theme: "ei", q: "Que révèle l’absence totale de déclaration d’EIGS dans un établissement ?",
          opts: ["Que les soins y sont parfaitement sûrs", "Un possible défaut de culture de sécurité des soins", "Qu’il n’y a aucun risque", "Rien de particulier"], ok: 1,
          why: "L’enquête ENEIS estime environ 4 EIGS par mois dans un service de 30 lits, dont plus de la moitié évitable, avec une sous-déclaration persistante. L’absence de déclaration est donc un indicateur révélateur.", src: "Fiche HAS EIAS p. 1 · critère 1.2-07" },
        { theme: "ei", q: "Vrai ou faux : un patient peut lui-même déclarer un événement indésirable qui le concerne.",
          opts: ["Vrai", "Faux"], ok: 0,
          why: "Il peut le déclarer à l’établissement et à l’ARS via un accès spécifique du portail national. Il doit être informé de cette possibilité et des modalités.", src: "Fiche HAS EIAS p. 5 · critère 1.2-07" },
        { theme: "ei", q: "Comment la HAS distingue-t-elle l’erreur de la faute professionnelle ?",
          opts: ["Il n’y a aucune différence", "L’erreur est généralement involontaire et analysée pour apprendre ; la faute est un manquement délibéré à une règle connue", "La faute est une erreur grave sans conséquence", "L’erreur est toujours sanctionnée"], ok: 1,
          why: "L’erreur est analysée dans une logique d’apprentissage collectif. La faute justifie des mesures disciplinaires. Une charte de non-punition soutient cette culture juste.", src: "Fiche HAS EIAS p. 2 · critère 1.2-07" },
        { theme: "ei", q: "Sur quoi repose la déclaration en interne d’un événement indésirable ?",
          opts: ["Une obligation légale uniquement, sans valeur éthique", "Un devoir éthique, déontologique et professionnel, au-delà des obligations légales", "Une simple recommandation facultative", "Une obligation réservée aux cadres"], ok: 1,
          why: "Les professionnels, y compris nouveaux et étudiants, sont informés qu’ils ont un devoir éthique, déontologique et professionnel de déclarer tout EIAS, et des modalités de déclaration.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" }
      ]
    },
    ei2: {
      th: "ei", title: "Informer, analyser, accompagner",
      questions: [
        { theme: "ei", q: "Un patient a subi un dommage lié aux soins, même non grave. Dans quel délai l’informer ?",
          opts: ["Dans un délai de 3 mois", "De préférence dans les 24 heures, sans excéder 15 jours", "Seulement s’il pose la question", "À la fin de l’hospitalisation, quelle que soit la durée"], ok: 1,
          why: "L’information du patient, de sa famille, de ses proches ou de sa personne de confiance est une obligation légale, que l’EIAS soit grave ou non : de préférence dans les 24 h, sans excéder 15 jours.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { theme: "ei", q: "Que doit comporter l’annonce d’un dommage associé aux soins ?",
          opts: ["Uniquement des excuses", "La nature de l’événement, ses conséquences prévisibles, les faits établis, les actions correctives, le plan de soins et les mesures de soutien", "Uniquement le nom du soignant concerné", "Le détail des sanctions"], ok: 1,
          why: "L’annonce peut se faire en une fois ou en plusieurs. Les professionnels qui annoncent, prioritairement les médecins, sont formés aux bonnes pratiques d’annonce.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { theme: "ei", q: "Pourquoi recueillir le récit du patient lors d’un EIGS ?",
          opts: ["Pour constituer un dossier juridique", "Pour obtenir sa vision, compléter l’analyse et rétablir le lien de confiance avec l’équipe", "Pour éviter qu’il saisisse la CDU", "Ce n’est pas attendu"], ok: 1,
          why: "Le récit apporte des informations utiles à l’analyse, renforce la confiance et fait partie de l’analyse collective.", src: "Fiche HAS EIAS p. 4 · critère 1.2-07" },
        { theme: "ei", q: "Dans quel délai les analyses approfondies d’un EIGS doivent-elles être réalisées et reportées sur le portail national ?",
          opts: ["Dans les 48 heures", "Dans un délai de 3 mois après l’événement", "Dans les 2 ans", "Aucun délai"], ok: 1,
          why: "Le volet 2 de la déclaration, l’analyse approfondie, est attendu dans les 3 mois, avec les professionnels concernés, la chronologie des faits, plusieurs causes dont profondes, les barrières et les actions à échéances réalistes.", src: "Fiche HAS EIAS p. 6 · critère 1.2-07" },
        { theme: "ei", q: "Un EIGS peut-il être causé uniquement par des facteurs liés au patient ?",
          opts: ["Oui, c’est fréquent", "Non : il est toujours causé par un ensemble de facteurs favorisants, jamais uniquement par le patient", "Oui, quand il est âgé", "Cela dépend du service"], ok: 1,
          why: "L’analyse identifie plusieurs causes, immédiates et profondes. Elle s’appuie sur une méthode de retour d’expérience (CREX, RMM, REMED) et un outil comme ALARM.", src: "Fiche HAS EIAS p. 6 · critère 1.2-07" },
        { theme: "ei", q: "Qu’entend-on par « seconde victime » ?",
          opts: ["Le deuxième patient concerné par un événement", "Un professionnel impliqué dans un EIAS et affecté psychologiquement, émotionnellement ou professionnellement", "L’établissement qui subit une sanction", "La famille du patient"], ok: 1,
          why: "Culpabilité, honte, anxiété, perte de confiance, troubles du sommeil, retrait… Il doit exister un parcours d’accompagnement connu de l’encadrement : entretien et mise en relation avec un pair formé.", src: "Fiche HAS EIAS pp. 2 et 7 · critère 1.2-07" },
        { theme: "ei", q: "Que doit-on présenter aux représentants des usagers à chaque commission des usagers (CDU) ?",
          opts: ["Rien sur les événements indésirables", "Une synthèse des événements indésirables : causes profondes et plans d’actions", "Le nom des soignants impliqués", "Uniquement le nombre de lits"], ok: 1,
          why: "Les représentants des usagers sont informés et participent à l’évaluation des actions. La synthèse des plans d’actions est aussi diffusée aux équipes, pour démontrer l’intérêt de déclarer.", src: "Fiche HAS EIAS p. 7 · critères 1.2-07, 1.4-06" }
      ]
    },
    ei3: {
      th: "ei", title: "Politique qualité et gestion des risques",
      questions: [
        { theme: "ei", q: "Quel est le principe du cycle PDCA d’amélioration continue ?",
          opts: ["Prévoir, Déclarer, Corriger, Archiver", "Planifier, Faire, Vérifier, Agir", "Prescrire, Délivrer, Contrôler, Administrer", "Publier, Diffuser, Classer, Auditer"], ok: 1,
          why: "Le management par la qualité s’inscrit dans un cycle : planification, mise en œuvre, exploitation, analyse des résultats et amélioration continue.", src: "Fiche HAS management p. 3 · critères 3.1-01, 3.1-02" },
        { theme: "ei", q: "Que contient un plan d’actions qualité structuré ?",
          opts: ["Un titre et un budget", "Pour chaque action : un pilote, un calendrier, des indicateurs de suivi avec une cible et un état d’avancement", "Uniquement la liste des audits", "Seulement les actions déjà terminées"], ok: 1,
          why: "Le plan est unique, pertinent, décliné par pôle ou service, connu des professionnels pour les actions qui les concernent, et évalué chaque année.", src: "Fiche HAS management pp. 3-4 · critère 3.1-01" },
        { theme: "ei", q: "Qu’est-ce qu’une rencontre sécurité ?",
          opts: ["Une visite de la sécurité incendie", "Un échange entre la gouvernance et les équipes pluriprofessionnelles sur un problème de sécurité ou un événement indésirable", "Une réunion de planning", "Un contrôle de la CDU"], ok: 1,
          why: "Elle montre l’engagement de la gouvernance. La culture de sécurité est aussi évaluée par une enquête auprès des professionnels.", src: "Fiche HAS management p. 3 · critère 3.1-02" },
        { theme: "ei", q: "Comment hiérarchise-t-on les risques a priori ?",
          opts: ["Selon l’ordre alphabétique", "Selon leur gravité potentielle et leur probabilité de survenue", "Selon le coût des équipements", "Selon l’ancienneté du service"], ok: 1,
          why: "Les dangers connus sont recensés (cartographie), priorisés par gravité et probabilité, et chaque risque est associé à des mesures préventives (barrières) et à des actions réactives si l’événement survient.", src: "Fiche HAS management p. 4 · critère 3.1-01" },
        { theme: "ei", q: "Quelle vigilance concerne les dispositifs médicaux ?",
          opts: ["La pharmacovigilance", "La matériovigilance", "L’hémovigilance", "L’infectiovigilance"], ok: 1,
          why: "Pharmacovigilance pour les médicaments, hémovigilance pour les produits sanguins labiles, matériovigilance pour les dispositifs médicaux, infectiovigilance pour les infections nosocomiales.", src: "Fiche HAS management p. 5 · critère 3.1-04" },
        { theme: "ei", q: "Que mesure un audit clinique ?",
          opts: ["La satisfaction des patients", "L’écart entre la pratique réelle observée et la pratique attendue ou recommandée", "Le nombre d’événements indésirables", "Le budget de l’unité"], ok: 1,
          why: "Exemples de critères : hygiène des mains, traçabilité de la douleur, administration des médicaments. Les audits sont une des méthodes d’évaluation des pratiques professionnelles (EPP).", src: "Fiche HAS management p. 6 · critère 2.4-06" },
        { theme: "ei", q: "Quelle est la différence entre PREMs et PROMs ?",
          opts: ["Ce sont deux noms du même questionnaire", "Les PREMs mesurent l’expérience des soins rapportée par les patients ; les PROMs mesurent les résultats de soins rapportés par les patients", "Les PREMs concernent les soignants et les PROMs les patients", "Les PREMs mesurent la satisfaction hôtelière et les PROMs les coûts"], ok: 1,
          why: "Avec les questionnaires de satisfaction, ce sont trois mesures complémentaires de la qualité rapportée par les patients.", src: "Fiche HAS management p. 6 · critère 1.4-02" }
      ]
    },
    info1: {
      th: "info", title: "Personne de confiance et directives anticipées",
      questions: [
        { theme: "info", q: "Que doit-on tracer dans le dossier de soins à propos de la personne de confiance ?",
          opts: ["Rien, c’est la famille qui le sait", "Son identité, la désignation étant signée par la personne de confiance", "Seulement son numéro de téléphone", "Uniquement son lien de parenté"], ok: 1,
          why: "La personne de confiance est le référent de l’expression des volontés du patient. Elle peut être désignée avant l’hospitalisation : l’équipe retrouve alors l’information auprès des proches ou dans « Mon espace santé ». La désignation est signée par la personne de confiance.", src: "Fiche HAS fin de vie p. 3 · critère 1.3-02" },
        { theme: "info", q: "Quelle est la différence entre la personne de confiance et la personne à prévenir ?",
          opts: ["Aucune, c’est la même personne obligatoirement", "Ce sont deux notions distinctes : le patient doit savoir qu’il peut désigner l’une et l’autre, leur identité est tracée et elles sont informées de leur rôle", "La personne à prévenir remplace la personne de confiance", "Seule la personne à prévenir est tracée"], ok: 1,
          why: "Le patient connaît la différence entre les deux notions. Leur identité est tracée dans le dossier et elles ont été informées de leur rôle.", src: "Fiche HAS engagement p. 5 · critère 1.3-02" },
        { theme: "info", q: "À quels patients informe-t-on de l’utilité des directives anticipées ?",
          opts: ["Seulement aux patients en fin de vie", "À tous les patients, quel que soit leur profil", "Seulement aux patients de moins de 70 ans", "Seulement à ceux qui le demandent"], ok: 1,
          why: "Les équipes informent tous les patients de l’utilité des directives anticipées. Elles tracent les directives et aussi le refus d’en rédiger.", src: "Fiche HAS fin de vie p. 3 · critère 1.1-04" },
        { theme: "info", q: "Un patient refuse de rédiger des directives anticipées. Que fait-on ?",
          opts: ["On ne note rien", "On trace son refus dans le dossier", "On insiste jusqu’à ce qu’il accepte", "On demande à la famille de les rédiger à sa place"], ok: 1,
          why: "Le refus d’en rédiger est tracé, au même titre que les directives elles-mêmes.", src: "Fiche HAS fin de vie p. 3 · critère 1.1-04" },
        { theme: "info", q: "Vrai ou faux : les proches ou aidants peuvent détenir les directives anticipées du patient.",
          opts: ["Vrai", "Faux"], ok: 0,
          why: "Les proches et/ou aidants peuvent détenir les directives anticipées. Ils s’impliquent dans le projet de soins avec l’accord du patient.", src: "Fiche HAS engagement p. 5 · critère 1.3-11" }
      ]
    },
    info2: {
      th: "info", title: "Consentement, projet de soins et fin de vie",
      questions: [
        { theme: "info", q: "Pour que le consentement du patient soit libre et éclairé, que doit-on lui avoir présenté ?",
          opts: ["Uniquement le formulaire à signer", "Les différentes options de prise en charge, avec leurs bénéfices et leurs risques, et recueillir ses préférences", "Uniquement le coût des soins", "Rien, le médecin décide"], ok: 1,
          why: "Le patient exprime ses préférences et besoins pour son projet de soins, et son consentement est demandé pour ce projet. L’information est claire, complète et adaptée.", src: "Fiche HAS fin de vie pp. 3 et 6 · critère 1.3-01" },
        { theme: "info", q: "Avec qui associe-t-on les proches et aidants au projet de soins ?",
          opts: ["Toujours, même si le patient s’y oppose", "Avec l’accord du patient", "Seulement si le médecin le décide", "Jamais pendant l’hospitalisation"], ok: 1,
          why: "Avec l’accord du patient, les proches ou aidants s’impliquent dans le projet de soins. Les aidants, professionnels ou non, peuvent aussi continuer à aider pour les actes de la vie quotidienne dans un cadre tracé au projet de soins.", src: "Fiche HAS fin de vie p. 4 · fiche engagement pp. 3, 5 · critère 1.3-11" },
        { theme: "info", q: "Que trace-t-on dans le dossier lors d’une limitation ou d’un arrêt des thérapeutiques actives (LATA) ?",
          opts: ["Rien de spécial", "La décision issue de la procédure collégiale, le recours à l’équipe mobile de soins palliatifs, la prescription anticipée de la phase agonique, l’annonce à la famille", "Seulement l’heure du décès", "Seulement la décision du médecin seul"], ok: 1,
          why: "La LATA suit une analyse pluriprofessionnelle avant un décès prévisible, pour éviter toute obstination déraisonnable. Le transfert éventuel en USP/LISP ou à domicile (HAD) est aussi tracé.", src: "Fiche HAS fin de vie p. 4 · critères 1.1-09, 2.1-05" },
        { theme: "info", q: "Comment évalue-t-on la douleur d’un patient qui ne peut pas participer (non communicant) ?",
          opts: ["On ne l’évalue pas", "Par une hétéroévaluation réalisée par les soignants, avec un outil adapté à sa situation", "En demandant à la famille de décider", "Une seule fois à l’entrée"], ok: 1,
          why: "L’auto-évaluation est la règle quand elle est possible. Sinon, hétéroévaluation avec un outil adapté, régulière, tracée, avec les décisions de prise en charge.", src: "Fiche HAS fin de vie p. 2 · critère 1.1-05" },
        { theme: "info", q: "Quand un traitement antalgique ou sédatif est mis en place pour une souffrance réfractaire en fin de vie, qui est informé ?",
          opts: ["Personne, c’est une décision médicale", "Le patient, la personne de confiance, la famille ou à défaut un proche ; la procédure est tracée dans le dossier médical", "Seulement le pharmacien", "Seulement le cadre de santé"], ok: 1,

    age1: {
      th: "age", title: "Dépendance iatrogène",
      questions: [
        { theme: "age", q: "À partir de quel âge le référentiel de certification considère-t-il un patient comme âgé ?",
          opts: ["60 ans", "Plus de 75 ans", "Plus de 90 ans", "Aucune limite : tout dépend de la fragilité"], ok: 1,
          why: "Dans le référentiel, un patient est âgé s’il a plus de 75 ans. La fiche précise que la fragilité aide aussi à cerner les personnes relevant de la gériatrie.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { theme: "age", q: "Qu’est-ce que la dépendance iatrogène ?",
          opts: ["La dépendance due à la maladie d’Alzheimer", "Les décompensations fonctionnelles ou psychiques liées à l’hospitalisation : immobilisation, confusion, dénutrition, chutes, incontinence, effets indésirables des médicaments, risque suicidaire", "La dépendance à l’alcool", "Le besoin d’une aide à domicile après la sortie"], ok: 1,
          why: "Ces causes peuvent parfois aller jusqu’au décès. L’évaluation à l’admission recherche les facteurs de risque de dépendance iatrogène.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { theme: "age", q: "Parmi ces facteurs, lequel favorise le syndrome d’immobilisation ?",
          opts: ["Une aide adaptée à la marche et aux transferts", "Un alitement ou des restrictions d’activité non justifiés médicalement, une contention, une sonde non justifiée, une douleur non traitée", "Un lever précoce au fauteuil", "Un environnement adapté"], ok: 1,
          why: "Le syndrome d’immobilisation entraîne perte rapide de masse musculaire, perte d’autonomie et réhospitalisations. Le patient est parfois alité alors que la restriction n’est pas médicalement justifiée.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { theme: "age", q: "Quels sont des facteurs de risque prédisposant à la confusion aiguë ?",
          opts: ["Démence ou troubles cognitifs, atteinte sensorielle, polymédication, dénutrition, immobilisation aggravée par la contention", "Avoir moins de 60 ans", "Une chambre individuelle", "Un bon état nutritionnel"], ok: 0,
          why: "La confusion aiguë augmente le risque de déclin fonctionnel, de chutes, la durée d’hospitalisation et l’entrée en institution.", src: "Fiche HAS patients âgés p. 2 · critère 1.3-04" },
        { theme: "age", q: "Un patient âgé agité : que dit la fiche à propos des barrières de lit posées « par souci de sécurité » ?",
          opts: ["C’est une mesure de sécurité sans conséquence", "Il faut éviter le recours inapproprié aux contentions physiques, y compris les barrières, et réévaluer toute mesure restrictive nécessaire", "Elles sont obligatoires la nuit", "Elles sont décidées par l’aide-soignant seul"], ok: 1,
          why: "Les contentions aggravent l’immobilisation et la confusion. La fiche demande d’éviter leur recours inapproprié et de réévaluer toute mesure restrictive lorsqu’elle est nécessaire.", src: "Fiche HAS patients âgés p. 5 · critères 1.1-06, 1.1-10" },
        { theme: "age", q: "Parmi ces mesures, laquelle prévient la dépendance iatrogène ?",
          opts: ["Laisser le patient au lit toute la journée par précaution", "Le mettre au fauteuil, lui proposer de marcher et préserver son autonomie pour aller aux toilettes", "Poser une protection urinaire systématique à l’entrée", "Prescrire un sédatif pour la nuit à tous"], ok: 1,
          why: "On évite aussi les médicaments potentiellement sédatifs, on est vigilant sur les apports alimentaires et hydriques, on surveille le poids, et on évite les protections ou sondes urinaires non justifiées en réévaluant régulièrement leur indication.", src: "Fiche HAS patients âgés p. 5 · critère 1.3-04" },
        { theme: "age", q: "Quelle part des effets indésirables des médicaments chez le sujet âgé est prévisible et évitable ?",
          opts: ["Moins de 5 %", "Environ 10 %", "De 30 à 60 %", "Plus de 95 %"], ok: 2,
          why: "L’iatrogénie médicamenteuse est une cause d’hospitalisation en urgence des plus de 75 ans. La polymédication et les médicaments à marge thérapeutique étroite ou favorisant les chutes sont des facteurs de risque.", src: "Fiche HAS patients âgés p. 2 · critères 1.3-04, 2.1-04" },
        { theme: "age", q: "Vrai ou faux : la dépression est un signe normal de vieillesse.",

      ]

    age2: {

        { theme: "age", q: "Que doit comporter l’évaluation d’un patient âgé dès l’admission ?",

        { theme: "age", q: "Pourquoi faciliter la présence des proches auprès du patient âgé ?",

        { theme: "age", q: "Pour éviter un passage inutile aux urgences d’un patient de plus de 75 ans, que doit pouvoir faire l’établissement ?",

      ]
    },

        { theme: "sse", q: "Que fait-on des enseignements d’un événement ayant déclenché un plan ?",

    eq2: {

        { theme: "equipes", q: "Qu’est-ce qu’une équipe au sens de la certification ?",

          why: "L’équipe décline sur le terrain la politique qualité-sécurité des soins de l’établissement. Le travail en équipe agit directement sur la qualité de vie au travail et la qualité des soins.", src: "Fiche HAS ressources p. 2 · critère 3.2-11" },
        { theme: "equipes", q: "Comment la politique de qualité de vie au travail doit-elle être construite ?",

    eq3: {
      th: "equipes", title: "Violences sexistes et sexuelles entre professionnels",
      questions: [
        { theme: "equipes", q: "Quelles situations relèvent du « sexisme d’atmosphère » ?",

          why: "Les violences sexistes créent un environnement de travail intimidant, hostile, dégradant, humiliant ou offensant. Aucun propos ou comportement sexiste ou sexuel n’est acceptable au regard des habitudes professionnelles ou des rapports hiérarchiques.", src: "Fiche HAS VSS p. 2 · critère 3.2-12" },
        { theme: "equipes", q: "Quelles caractéristiques doit avoir un dispositif de signalement des violences sexistes et sexuelles ?",

        { theme: "equipes", q: "Qui peut signaler une situation de violences sexistes et sexuelles ?",

          why: "Les professionnels doivent savoir qu’un dispositif existe et connaître ses modalités d’utilisation, en cas de besoin.", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { theme: "equipes", q: "Dans un établissement public, qui est le référent pour les situations de harcèlement ?",

          why: "Dans le privé (plus de 11 salariés), c’est un référent harcèlement. D’autres acteurs peuvent intervenir : RH, médecine du travail, direction, syndicats, inspection du travail, ordres professionnels, instituts de formation ou université pour les étudiants.", src: "Fiche HAS VSS p. 3 · critère 3.2-12" },
        { theme: "equipes", q: "Un étudiant ou un stagiaire est victime de violences sexistes ou sexuelles. Que doit faire l’établissement ?",
          opts: ["Ne rien faire car il n’est pas salarié", "Gérer la situation avec l’université ou l’institut de formation, pour protéger la personne et prévenir la récurrence", "Mettre fin au stage sans discussion", "Attendre la fin de l’année"], ok: 1,

        { theme: "equipes", q: "Quel accompagnement doit être proposé à une victime ?",
          opts: ["Aucun tant qu’il n’y a pas de plainte", "Un dispositif mobilisable dès les premiers signes, avec écoute, orientation et soutien effectif, tracé et activé dans la durée", "Un seul entretien", "Un changement de service imposé"], ok: 1,
          why: "Les personnes missionnées savent écouter, accompagner et orienter. L’établissement peut aussi orienter vers un soutien externe, par exemple France victimes ou le CIDFF.", src: "Fiche HAS VSS p. 4 · critère 3.2-12" },
        { theme: "equipes", q: "Que doit-il y avoir dans le plan de formation de l’établissement ?",

        { theme: "equipes", q: "Que contient le bilan annuel présenté aux instances ?",

          why: "Nombre de signalements, délai moyen de traitement, procédures disciplinaires, plaintes pénales, entretiens de recadrage. Le bilan aborde aussi les violences faites aux patients (critère 1.1-06).", src: "Fiche HAS VSS p. 5 · critère 3.2-12" }

    var missed = quiz.log.filter(function (e) { return !e.ok; });
    var h = '<div class="qtop"><button class="linkbtn" type="button" id="back">‹ Retour aux thèmes</button><p class="eyebrow">' + esc(quiz.title) + "</p></div>" +
      '<div class="res"><div class="big">' + quiz.ok + "<small>/" + n + "</small></div><p class=\"cap\" style=\"margin:0\">" + pts + " points gagnés</p></div>" +
      '<div class="sect"><div class="sect-head"><h3>Effet sur vos thèmes</h3></div>' +
      Object.keys(touched).map(function (id) {
        var a = before[id], b = pct(id);
        return '<div class="row" style="cursor:default"><div class="name">' + esc(BYID[id].name) + '</div><div class="pct"><b class="delta">' + (a === null ? "" : r(a) + " → ") + r(b) + "<small> %</small></b></div></div>";
      }).join("") + "</div>" +
      '<div class="sect"><div class="sect-head"><h3>À retenir</h3></div>' +
      (missed.length ? '<ul class="keep">' + missed.map(function (e) { return "<li><strong>" + esc(e.q.q) + "</strong><br>" + esc(e.q.why) + '<br><span class="src">' + esc(e.q.src) + "</span></li>"; }).join("") + "</ul>" : '<p class="note" style="font-size:16px;color:var(--ink)">Aucune erreur. Les ' + n + " points sont acquis.</p>") + "</div>" +
      '<div class="actions"><button class="btn" type="button" id="again">Rejouer</button><button class="btn ghost" type="button" id="back2">Retour aux thèmes</button></div>';
    var key = quiz.key; quiz = null;
    $("v-quiz").innerHTML = h;
    $("back").addEventListener("click", function () { show("play"); });
    $("back2").addEventListener("click", function () { show("play"); });
    $("again").addEventListener("click", function () { startQuiz(key); });
    window.scrollTo(0, 0);
  }

  /* ---------- Bienvenue ---------- */
  function genCode() { var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i = 0; i < 6; i++) { s += a.charAt(Math.floor(Math.random() * a.length)); if (i === 2) s += "-"; } return s; }
  function renderWelcome() {
    var P = profiles(), ks = Object.keys(P);
    var plist = ks.length ? '<div class="wform"><h3>Reprendre un profil</h3>' + ks.map(function (k) {
      return '<button class="row" type="button" data-resume="' + esc(k) + '"><div><div class="name">' + esc(P[k].pseudo) + '</div><div class="meta"><span class="refs">' + esc(P[k].service || "") + '</span></div></div><div class="pct"><b>' + (P[k].points || 0) + '</b><em>points</em></div></button>';
    }).join("") + '<h3 style="margin-top:28px">Nouveau profil</h3></div>' : "";
    var sv = ["UGA", "UGO", "Médecine", "SMR", "Autre service"].map(function (x) { return "<option>" + x + "</option>"; }).join("");
    $("v-welcome").innerHTML = '<p class="eyebrow">Visite de certification · préparation</p><h1>Objectif<br>CertiF</h1>' +
      '<p class="lede">Des quiz de trois minutes, un thème à la fois, pour arriver prêt le jour de la visite. Créez votre profil pour suivre votre progression.</p>' +
      plist + '<form id="wf" class="wform"><div class="field"><label for="wp">Choisissez un pseudo</label><input id="wp" maxlength="20" autocomplete="off" required placeholder="Ex. : Cyclope42"></div>' +
      '<div class="field"><label for="ws">Votre service</label><select id="ws">' + sv + '</select></div>' +
      '<p class="note">Ni nom ni matricule. Ne saisissez aucune donnée de patient. Votre profil reste enregistré sur ce téléphone.</p>' +
      '<div class="actions"><button class="btn" type="submit">Commencer</button></div></form>' +
      '<p class="note"><button class="linkbtn" id="demo" type="button" style="color:var(--ink)">Voir la maquette avec des exemples</button></p>';
    $("wf").addEventListener("submit", function (e) {
      e.preventDefault();
      var p = $("wp").value.trim(); if (!p) return;
      S = clone(FRESH); S.pseudo = p; S.service = $("ws").value; S.code = genCode(); S.onboarded = true; save(); show("play");
    });
    $("demo").addEventListener("click", function () { S = clone(DEMO); save(); show("play"); });
    Array.prototype.forEach.call($("v-welcome").querySelectorAll("[data-resume]"), function (b) {
      b.addEventListener("click", function () { var p = profiles()[b.getAttribute("data-resume")]; if (p) { S = clone(p); save(); show("play"); } });
    });
  }

  /* ---------- Navigation ---------- */
  function show(name) {
    tab = name;
    ["play", "lib", "me", "team", "quiz", "welcome"].forEach(function (v) { $("v-" + v).hidden = v !== name; });
    $("tabs").hidden = name === "quiz" || name === "welcome";
    if (name === "welcome") renderWelcome();
    if (name === "play") renderPlay();
    if (name === "lib") renderLib();
    if (name === "me") renderMe();
    if (name === "team") renderTeam();
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      if (b.getAttribute("data-tab") === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (name !== "quiz") window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab],[data-theme-id],[data-switch],[data-quiz],#go-defi") : null;
    if (!t) return;
    if (t.hasAttribute("data-switch")) { switchProfile(); return; }
    if (t.hasAttribute("data-quiz")) { startQuiz(t.getAttribute("data-quiz")); return; }
    if (t.hasAttribute("data-tab")) { show(t.getAttribute("data-tab")); return; }
    if (t.id === "go-defi") { startQuiz("defi"); return; }
    var id = t.getAttribute("data-theme-id"), ks = setsOf(id);
    if (ks.length) startQuiz("t:" + id);
    else toast("Quiz à venir pour ce thème.");
  });
  $("reset").addEventListener("click", function () { try { var P = profiles(); delete P[S.code]; localStorage.setItem(KEY + "-profils", JSON.stringify(P)); } catch (e) {}
    S = clone(FRESH); save(); quiz = null; show("welcome"); toast("Profil effacé."); });

  var start = { jouer: "play", quiz: "lib", score: "me", equipe: "team" }[(location.hash || "").replace("#", "")] || "play";
  show(S.onboarded ? start : "welcome");
})();
</script>
