          opts: ["Trois : bleu, orange, rouge", "Cinq : du niveau 1 au niveau 5", "Quatre : vert, jaune, orange, rouge", "Deux : normal et alerte"], ok: 2,
          why: "Vert = veille saisonnière ; jaune = pic de chaleur ; orange = canicule ; rouge = canicule extrême.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Contexte · critère 3.1-05" },
        { id: "SSE-011", theme: "sse", q: "Que signifie la vigilance verte en matière de canicule ?",
          opts: ["Qu’aucune action n’est nécessaire tant que la vigilance n’est pas passée à l’orange ou au rouge", "Que le plan blanc est déclenché et que l’établissement est en situation de crise", "Que les activités programmées sont suspendues dans tous les services de soins", "Une période de préparation : vérification des équipements, stocks et organisations"], ok: 3,
          why: "La veille saisonnière sert à garantir la capacité de réponse avant l’épisode de chaleur. Les professionnels sont aussi sensibilisés.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Contexte · critère 3.1-05" },
        { id: "SSE-012", theme: "sse", q: "Vigilance jaune (pic de chaleur) : que renforce-t-on ?",
          opts: ["La surveillance des patients et résidents les plus vulnérables", "Uniquement la communication aux familles", "La déprogrammation de toutes les activités", "Rien, c’est un simple avis météo"], ok: 0,
          why: "Le jaune renforce la vigilance et la surveillance des personnes vulnérables ; à ce niveau, le plan bleu est déclenché. Les ressources sont aussi préparées en cas d’aggravation.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Contexte · critère 3.1-05" },
        { id: "SSE-013", theme: "sse", q: "Quel niveau de vigilance peut conduire à l’activation du Plan Blanc ?",
          opts: ["Aucun : canicule et plan blanc sont sans lien", "Le rouge : canicule extrême (intense et durable)", "Le vert", "Le jaune"], ok: 1,
          why: "Le rouge correspond à une gestion de crise institutionnelle pouvant conduire à l’activation du Plan Blanc.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Contexte · critère 3.1-05" },
        { id: "SSE-014", theme: "sse", q: "Quels patients sont particulièrement à risque en cas de forte chaleur ?",
          opts: ["Les patients jeunes et autonomes, car ils sont les plus exposés à la chaleur", "Aucun patient en particulier : tous les patients sont exposés de la même façon", "Les personnes les plus vulnérables, comme les personnes âgées", "Uniquement les patients de réanimation, qui sont les seuls surveillés"], ok: 2,
          why: "Les cadres de santé identifient les personnes à risque dans les services de soins ; c’est une action de veille. Le service doit les identifier.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 1 · critère 3.1-05" },
        { id: "SSE-015", theme: "sse", q: "Pendant la veille saisonnière, qu’attend-on des équipes de soins ?",
          opts: ["Qu’elles attendent la vigilance orange pour s’informer", "Qu’elles ne changent rien aux pratiques", "Qu’elles appellent la direction à chaque degré gagné", "Qu’elles soient resensibilisées et appliquent les protocoles en cas de chaleur"], ok: 3,
          why: "Les protocoles de prise en charge en cas de chaleur sont rappelés au personnel dès le niveau de veille. Ce sont les protocoles de prise en charge.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 1 · critère 3.1-05" },
        { id: "SSE-016", theme: "sse", q: "En cas de pic de chaleur, que fait-on des événements indésirables liés à la chaleur ?",
          opts: ["Ils sont déclarés : la DGRQS en assure le suivi", "Ils ne sont pas déclarés tant que le plan blanc n’est pas activé", "Ils sont réservés au médecin du travail, qui en assure seul le suivi", "Ils sont traités uniquement par la pharmacie, sans déclaration interne"], ok: 0,
          why: "Déclarer reste la règle : le suivi des événements indésirables liés à la chaleur fait partie du niveau 2. La DGRQS les transmet aux directions des soins.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 2 · critère 3.1-05" },
        { id: "SSE-017", theme: "sse", q: "Comment le personnel est-il informé du passage en niveau canicule ?",
          opts: ["Il n’y a aucune information officielle, chacun se renseigne par la météo", "Par une note de service diffusée par mail à tous (Everyone)", "Par un affichage en salle de pause uniquement, sans diffusion par mail", "Par un appel de chaque cadre à chaque agent"], ok: 1,
          why: "La note de service est diffusée par le secrétariat de la DGRQS.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveaux 2 et 3 · critère 3.1-05" },
        { id: "SSE-018", theme: "sse", q: "En alerte canicule (niveau 3), que peut autoriser la DRH ?",
          opts: ["La suppression des transmissions écrites entre les équipes de soins", "L’arrêt des soins non urgents décidé par chaque agent selon sa charge de travail", "L’adaptation des tenues professionnelles, de l’organisation et des horaires de travail", "La fermeture définitive des services les plus exposés à la chaleur"], ok: 2,
          why: "Les adaptations de tenues, de locaux (pièces rafraîchies) et d’horaires sont autorisées en niveau 3.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 3 · critère 3.1-05" },
        { id: "SSE-019", theme: "sse", q: "En alerte canicule, que fait-on pour les personnes à risque ?",
          opts: ["On les laisse dans leur chambre quelle que soit la température, sans surveillance", "On les transfère systématiquement aux urgences dès l’alerte pour les surveiller", "On ouvre toutes les fenêtres en plein après-midi pour faire circuler l’air", "On les accueille dans des pièces climatisées ou rafraîchies"], ok: 3,
          why: "Un dispositif de rafraîchissement est mis en place par bâtiment, pour les professionnels et pour installer les patients selon leurs possibilités. Une pièce par bâtiment est prévue pour se rafraîchir.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 3 · critère 3.1-05" },
        { id: "SSE-020", theme: "sse", q: "En alerte canicule, que fait-on pour gérer l’occupation des lits ?",
          opts: ["On accélère les sorties et on prévoit des lits supplémentaires si nécessaire", "On bloque toutes les sorties pour garder les patients sous surveillance, quel que soit leur état", "On ferme des unités sans en informer la direction ni les équipes concernées", "On refuse tous les nouveaux patients, y compris ceux adressés par les urgences"], ok: 0,
          why: "Les chefs de service et cadres accélèrent les sorties ; la cellule de crise peut ouvrir des lits ou différer les activités non urgentes.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 3 · critère 3.1-05" },
        { id: "SSE-021", theme: "sse", q: "Qui peut décider de différer des activités programmées non urgentes pendant une canicule ?",
          opts: ["La pharmacie seule, sans consulter la direction", "La cellule de crise (directeur de garde, direction)", "Chaque agent selon sa charge de travail", "Le patient"], ok: 1,
          why: "La décision est prise par la direction/cellule de crise, puis diffusée par note de service.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 3 · critère 3.1-05" },
        { id: "SSE-022", theme: "sse", q: "Quelle documentation sur le médicament est diffusée pendant une vague de chaleur ?",
          opts: ["Aucune", "Une liste de médicaments interdits dans tout l’hôpital", "Une fiche sur le bon usage des médicaments en cas de chaleur", "Un nouveau livret thérapeutique complet"], ok: 2,
          why: "Certains traitements exposent à un risque en cas de chaleur : la fiche de bon usage est transmise à partir du niveau 3.", src: "Plan interne canicule (HSV-PB-PRO-0481) · Niveau 3 · critère 3.1-05" },
        { id: "SSE-023", theme: "sse", q: "Depuis quand les plans canicule existent-ils en France ?",
          opts: ["Depuis 1990, comme les autres plans de gestion de crise de l’hôpital", "Depuis 2015, date de la mise en place des plans de crise hospitaliers", "Depuis la crise Covid, qui a conduit à créer ces plans dans les établissements", "Depuis 2004, après l’épisode de canicule de 2003"], ok: 3,
          why: "Le plan canicule a été mis en place en 2004 et il est révisé chaque année.", src: "Plan bleu canicule EHPAD 2026 · Introduction · critère 3.1-05" },
        { id: "SSE-024", theme: "sse", q: "À qui s’adresse le plan bleu canicule ?",
          opts: ["Aux établissements médico-sociaux, ici les EHPAD de l’hôpital", "Aux seuls services de chirurgie de l’hôpital", "Aux seuls services techniques de l’hôpital", "Aux établissements privés uniquement, hors de l’hôpital"], ok: 0,
          why: "Le plan bleu est intégré au plan canicule de l’hôpital et bénéficie de ses moyens.", src: "Plan bleu canicule EHPAD 2026 · Introduction · critère 3.1-05" },
        { id: "SSE-025", theme: "sse", q: "Sur quelle période le plan canicule est-il opérationnel ?",
          opts: ["Uniquement en juillet et août, lors des pics de chaleur", "Du 1er juin au 15 septembre", "Toute l’année, sans changement de dispositif", "Du 1er novembre au 31 mars"], ok: 1,
          why: "Le plan canicule est opérationnel du 1er juin au 15 septembre.", src: "Plan bleu canicule EHPAD 2026 · Introduction · critère 3.1-05" },
        { id: "SSE-026", theme: "sse", q: "Que doit-on faire des protocoles d’hydratation en EHPAD ?",
          opts: ["Les réserver aux patients alités pendant la canicule", "Les confier aux familles des patients en période de canicule", "Les appliquer toute l’année", "Les appliquer uniquement en juillet, au pic de la canicule"], ok: 2,
          why: "Des protocoles médicaux d’hydratation sont établis dans le service et appliqués toute l’année. Ils ne sont pas appliqués seulement pendant la canicule.", src: "Plan bleu canicule EHPAD 2026 · Fiches actions · critère 3.1-05" },
        { id: "SSE-027", theme: "sse", q: "Quand le plan bleu doit-il être présenté aux équipes de l’EHPAD ?",
          opts: ["Après la première canicule", "Une fois tous les cinq ans", "Jamais, il est réservé aux cadres", "Avant l’été"], ok: 3,
          why: "Il doit être présenté à l’ensemble des équipes avant l’été et disponible dans les infirmeries, au secrétariat et dans la GED.", src: "Plan bleu canicule EHPAD 2026 · Diffusion de l’information · critère 3.1-05" },
        { id: "SSE-028", theme: "sse", q: "À la fin d’une alerte canicule, que fait la direction avec la cellule de crise ?",

        if (!Object.keys(imported).length) throw importError("Aucun profil exploitable dans cette sauvegarde.");
        save();

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function questionKey(q) { return q.id || (q.theme + "::" + q.q); }
  function questionPool(id) { var a = []; setsOf(id).forEach(function(k){ a = a.concat(QUIZ[k].questions); }); return a; }
  function distinctPool(id) { var seen = {}; questionPool(id).forEach(function(q){ seen[questionKey(q)] = true; }); return Object.keys(seen); }
  function masteredCount(id) { return distinctPool(id).filter(function(k){ return !!S.correctDistinct[k]; }).length; }
  function pct(id) { var total = distinctPool(id).length; return total ? masteredCount(id) / total * 100 : null; }
  /* ---------- Mes erreurs : questions ratées (retirées dès qu'elles sont réussies) ---------- */
  function questionIndex() { var idx = {}; THEMES.forEach(function (t) { questionPool(t.id).forEach(function (q) { idx[questionKey(q)] = q; }); }); return idx; }
  function missedKeys() { var idx = questionIndex(); return Object.keys(S.missed || {}).filter(function (k) { return idx[k]; }); }
  function missedCount() { return missedKeys().length; }
  function refreshErrorsBadge() { var n = missedCount(), b = $("nav-errors"); if (b) { b.textContent = n; b.hidden = !n; } }
  function mean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  function chapterScore(ch) { var ids = []; THEMES.filter(function(t){return t.ch===ch;}).forEach(function(t){ids=ids.concat(distinctPool(t.id));}); ids = ids.filter(function(k,i){return ids.indexOf(k)===i;}); return ids.length ? ids.filter(function(k){return !!S.correctDistinct[k];}).length / ids.length * 100 : null; }
  function globalScore() { var ids = []; THEMES.forEach(function(t){ids=ids.concat(distinctPool(t.id));}); ids=ids.filter(function(k,i){return ids.indexOf(k)===i;}); return ids.length ? ids.filter(function(k){return !!S.correctDistinct[k];}).length / ids.length * 100 : null; }
  function level(v) { return v >= 80 ? "good" : v >= 60 ? "warn" : "bad"; }
  function levelLabel(v) { return v >= 80 ? "Solide" : v >= 60 ? "À consolider" : "À revoir"; }
  function r(v) { return Math.round(v); }
  function answered() { return Object.keys(S.counters).reduce(function (n, k) { return n + S.counters[k][1]; }, 0); }
  function chipHtml() { return '<button class="chip" type="button" data-switch aria-label="Profil ' + esc(S.pseudo) + ', changer de profil"><i aria-hidden="true">' + initials() + "</i>" + esc(S.pseudo) + " <small>Changer</small></button>"; }
  function switchProfile() { save(); S = clone(FRESH); save(); show("welcome"); }

    var hasImp = t.refs.some(function (x) { return x[1]; });

  }

  /* ---------- Images des trophées (planche « Catalogue des trophées ») et 4 états ----------

  var METAL_KEY = {"25":"bronze","50":"silver","75":"gold","100":"platinum"};
  function trophyImgKey(id) {

  /* progression (0 à 1) vers un trophée non obtenu ; null si non mesurable */
  function trophyProgress(id) {
    var m = /^theme_(.+)_(25|50|75|100)$/.exec(id);
    if (m) { var p = pct(m[1]); return p === null ? 0 : Math.min(1, p / Number(m[2])); }
    m = /^global_(25|50|75|100)$/.exec(id);
    if (m) { var g = globalScore(); return g === null ? 0 : Math.min(1, g / Number(m[1])); }
    var explored = Object.keys(S.discoveredThemes || {}).filter(function (k) { return S.discoveredThemes[k]; }).length;
    var sess = S.sessionsCompleted || 0;
    function cnt(min) { return THEMES.filter(function (t) { return pct(t.id) >= min; }).length; }
    var map = { first_quiz: sess / 1, explorer_4: explored / 4, explorer_8: explored / 8, explorer_16: explored / 16, sessions_10: sess / 10, sessions_25: sess / 25,
      streak_10: (S.consecutiveCorrect || 0) / 10, expert_8: cnt(75) / 8, cartographer: cnt(25) / THEMES.length, absolute: cnt(100) / THEMES.length };
    if (id in map) return Math.min(1, map[id]);

  function chart(cur) {

    var pts = vals.map(function (v, i) { return x(i).toFixed(1) + "," + y(v).toFixed(1); });
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Évolution du score global sur six semaines, de ' + vals[0] + " à " + vals[vals.length - 1] + ' pour cent">';

    s += '<line class="target" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(100) + '" y2="' + y(100) + '"/><text x="' + (L - 6) + '" y="' + (y(100) + 3) + '" text-anchor="end">100</text>' +
      '<text x="' + (W - R) + '" y="' + (y(100) - 5) + '" text-anchor="end">cible</text>';
    s += '<polygon class="area" points="' + pts.join(" ") + " " + x(vals.length - 1).toFixed(1) + "," + y(lo) + " " + L + "," + y(lo) + '"/>';
    s += '<polyline class="line" points="' + pts.join(" ") + '"/>';
    vals.forEach(function (v, i) {
      if (i < vals.length - 1) s += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.5"/>';
      s += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + (i + 1) + "</text>";

    return s;
  }

    else if (a === "qrbig") { if (d.created) { var qb = document.createElement("div"); qb.className = "qrbig"; qb.setAttribute("data-pa", "qrclose"); qb.innerHTML = '<h2>' + esc(d.created.l || "Partie en équipe") + '</h2><p>Scannez pour jouer</p>' + QR.svg(partyLink(d.created), 640) + '<small>Touchez l’écran pour fermer</small>'; document.body.appendChild(qb); } }
    else if (a === "qrclose") { t.remove(); }
    else if (a === "create") partyCreate(false);
    else if (a === "reseed") partyCreate(true);
    else if (a === "copy") { var inp = document.querySelector(".party-link"); try { navigator.clipboard.writeText(inp.value).then(function () { toast("Lien copié."); }, function () { inp.select(); toast("Sélectionné : copiez avec Ctrl+C."); }); } catch (err) { inp.select(); toast("Sélectionné : copiez avec Ctrl+C."); } }
    else if (a === "anim") { if (d.created) openAnim(d.created); }
    else if (a === "self") { if (d.created) openParty(d.created); }
    else if (a === "start") renderPartyQuestion();
    else if (a === "ans") partyAnswer(Number(v));
    else if (a === "next") partyNext();
    else if (a === "exit") partyExit();
    else if (a === "anext") animNext();
    else if (a === "aprev") animPrev();
    else if (a === "aquit") { partyAnim = null; try { if (document.fullscreenElement) document.exitFullscreen(); } catch (err) {} show("party"); }
    else if (a === "fs") { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) {} }
  });
  window.addEventListener("hashchange", function () { var c = partyFromHash(); if (c) openParty(c); });

  /* ---------- Défi du jour ----------
     Tout est calculé à partir de la date et de la banque de questions : rien à mettre à jour quand on ajoute des questions ou des thèmes.
     - DEFI_START : jour n° 0, identique pour tout le monde (les 4 questions sont les mêmes pour tous, le même jour).
     - DEFI_THEMES : nombre de thèmes (= de questions) par jour.
     - Chaque thème sort une fois par « tour ». L'ordre des thèmes est mélangé à chaque tour.
     - Au tour n, un thème propose sa n-ième question, dans un ordre mélangé qui change quand toutes ont été vues. */
  var DEFI_START = Date.UTC(2026, 10, 1), DEFI_THEMES = 4;
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffled(arr, seed, keyOf) {
    return arr.map(function (x) { return [hash(seed + "|" + keyOf(x)), keyOf(x), x]; })
      .sort(function (a, b) { return a[0] - b[0] || (a[1] < b[1] ? -1 : 1); })
      .map(function (e) { return e[2]; });
  }
  function dailyDefi(date) {
    var d = date || new Date();
    var day = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DEFI_START) / 864e5);
    var ids = THEMES.filter(function (t) { return poolOf(t.id).length; }).map(function (t) { return t.id; });
    var N = ids.length, per = Math.min(DEFI_THEMES, N), out = [];
    for (var k = 0; k < per; k++) {
      var slot = day * per + k, cycle = Math.floor(slot / N), pos = slot - cycle * N;
      var id = shuffled(ids, "tour" + cycle, function (x) { return x; })[pos];
      var pool = poolOf(id), round = Math.floor(cycle / pool.length), n = cycle - round * pool.length;
      out.push(shuffled(pool, id + "|" + round, function (q) { return q.id || q.q; })[n]);
    }
    return out;
  }
  function startQuiz(key) {
    var list, title;
    if (key.indexOf("t:") === 0) {
      var id = key.slice(2), pool = poolOf(id).slice().sort(function () { return Math.random() - 0.5; });
      list = pool.slice(0, PICK); title = BYID[id].name;
    } else if (key.indexOf("s:") === 0) {
      var sd = subDef(key.slice(2));
      if (!sd) { toast("Sous-thème introuvable."); return; }
      list = subPool(sd.id).slice().sort(function () { return Math.random() - 0.5; }).slice(0, PICK); title = BYID[sd.th].name + " · " + sd.name;
    } else if (key === "defi") { list = dailyDefi(); title = "Défi du jour"; }
    else if (key === "errors") {
      var mk = missedKeys();
      if (!mk.length) { toast("Aucune erreur à rejouer pour l’instant. Bravo !"); return; }
      var qidx = questionIndex();
      list = shuffleArray(mk).slice(0, PICK).map(function (k) { return qidx[k]; }); title = "Mes erreurs";
    }
    else { list = QUIZ[key].questions; title = QUIZ[key].title; }
    quiz = { key: key, title: title, i: 0, picked: null, ok: 0, log: [], qs: mixQs(list) };
    show("quiz"); renderQuiz(); window.scrollTo(0, 0);
  }
  function renderQuiz() {
    var set = QUIZ[quiz.key], n = quiz.qs.length, q = quiz.qs[quiz.i], th = BYID[q.theme];
    var segs = quiz.qs.map(function (_, k) { return '<i class="' + (k < quiz.i || (k === quiz.i && quiz.picked !== null) ? "done" : k === quiz.i ? "now" : "") + '"></i>'; }).join("");
    var h = '<div class="qtop"><button class="linkbtn" type="button" id="quit">‹ Quitter</button><p class="eyebrow">' + esc(quiz.title) + " · " + (quiz.i + 1) + " / " + n + "</p></div>" +
      '<div class="segs" aria-hidden="true">' + segs + "</div>" +
      '<p class="eyebrow qtheme">' + esc(th.name) + (subName(q) ? " · " + esc(subName(q)) : "") + "</p><p class=\"qtext\" id=\"qtext\">" + esc(q.q) + "</p>" + noteHtml(q) + (q.multi && quiz.picked === null ? '<p class="mhint">' + MHINT + "</p>" : "") + "<div class=\"opts\" role=\"group\" aria-labelledby=\"qtext\">";
    if (q.multi && !quiz.sel) quiz.sel = [];
    q.opts.forEach(function (o, k) {
      var cls = "opt", tag = "";
      if (q.multi) {
        var isOk = q.oks.indexOf(k) >= 0, shown = quiz.picked !== null ? quiz.picked : quiz.sel, chosen = shown.indexOf(k) >= 0;
        if (quiz.picked !== null) {
          if (isOk && chosen) { cls += " right"; tag = '<span class="tag">Bonne réponse cochée</span>'; }
          else if (isOk) { cls += " right missed"; tag = '<span class="tag">Bonne réponse oubliée</span>'; }
          else if (chosen) { cls += " wrong"; tag = '<span class="tag">Cochée à tort</span>'; }
        } else if (chosen) cls += " sel";
        h += '<button type="button" class="' + cls + '" role="checkbox" aria-checked="' + chosen + '" data-k="' + k + '"' + (quiz.picked !== null ? " disabled" : "") + '><span class="l cb">' + (chosen ? "✓" : "") + "</span><span>" + esc(o) + tag + "</span></button>";
        return;
      }
      if (quiz.picked !== null) {
        if (k === q.ok) { cls += " right"; tag = '<span class="tag">Bonne réponse</span>'; }
        else if (k === quiz.picked) { cls += " wrong"; tag = '<span class="tag">Votre réponse</span>'; }
      }
      h += '<button type="button" class="' + cls + '" data-k="' + k + '"' + (quiz.picked !== null ? " disabled" : "") + '><span class="l">' + "ABCD".charAt(k) + "</span><span>" + esc(o) + tag + "</span></button>";
    });
    h += "</div>";
    if (q.multi && quiz.picked === null) h += '<div class="actions"><button class="btn" type="button" id="mvalid"' + (quiz.sel.length ? "" : " disabled") + '>Valider ma réponse</button></div>';
    if (quiz.picked !== null) {
      var good = samePick(q, quiz.picked), last = quiz.i === n - 1;
      h += '<div class="fb" role="status"><h3 class="' + (good ? "good" : "bad") + '">' + (good ? (defiNoPts() ? "Correct" : "Correct · +10 points") : "Pas tout à fait") + "</h3><p>" + esc(q.why) + '</p><p class="src">' + esc(q.src) + "</p>" +
        '<div class="actions"><button class="btn" type="button" id="next">' + (last ? "Voir le résultat" : "Question suivante") + "</button></div></div>";
    }
    $("v-quiz").innerHTML = h;
    $("quit").addEventListener("click", function () { quiz = null; show("play"); });
    Array.prototype.forEach.call($("v-quiz").querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        var k = +b.getAttribute("data-k");
        if (q.multi) {
          var pos = quiz.sel.indexOf(k); if (pos >= 0) quiz.sel.splice(pos, 1); else quiz.sel.push(k);
          renderQuiz();
          var again = $("v-quiz").querySelector('.opt[data-k="' + k + '"]'); if (again) again.focus();
          return;
        }
        quiz.picked = k;
        var ok = k === q.ok; if (ok) quiz.ok++;
        quiz.log.push({ q: q, ok: ok });
        renderQuiz();
        var nx = $("next"); if (nx) nx.focus();
      });
    });
    var mv = $("mvalid");
    if (mv) mv.addEventListener("click", function () {
      if (!quiz.sel.length) return;
      quiz.picked = quiz.sel.slice().sort(numAsc);
      var ok = samePick(q, quiz.picked); if (ok) quiz.ok++;
      quiz.log.push({ q: q, ok: ok });
      renderQuiz();
      var nx2 = $("next"); if (nx2) nx2.focus();
    });
    var nx = $("next");
    if (nx) nx.addEventListener("click", function () {
      if (quiz.i < n - 1) { quiz.i++; quiz.picked = null; quiz.sel = null; renderQuiz(); window.scrollTo(0, 0); }
      else finishQuiz();
    });
  }
  function localDay(d) { function z(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
  function defiNoPts() { return !!quiz && quiz.key === "defi" && S.defiDay === localDay(new Date()); }
  function finishQuiz() {
    var set = QUIZ[quiz.key], n = quiz.qs.length, touched = {}, before = {};
    var sessionThemeScores = {}, sessionThemeCounts = {}, sessionThemeCorrect = {};
    quiz.log.forEach(function (e) {
      var id = e.q.theme, qid = questionKey(e.q);
      if (!(id in before)) before[id] = pct(id);
      var c = S.counters[id]; c[1] += 1; if (e.ok) c[0] += 1; touched[id] = 1;
      S.discoveredThemes[id] = true;
      sessionThemeCounts[id]=(sessionThemeCounts[id]||0)+1; if(e.ok)sessionThemeCorrect[id]=(sessionThemeCorrect[id]||0)+1;
      if(e.ok) S.correctDistinct[qid]=true;
      if(e.ok) delete S.missed[qid]; else S.missed[qid]=true;
      if(e.ok) S.consecutiveCorrect=(S.consecutiveCorrect||0)+1; else S.consecutiveCorrect=0;
    });
    Object.keys(sessionThemeCounts).forEach(function(id){sessionThemeScores[id]=sessionThemeCorrect[id] ? sessionThemeCorrect[id]/sessionThemeCounts[id]*100 : 0;});
    var noPts = defiNoPts(); var pts = noPts ? 0 : quiz.ok * 10; S.points += pts; if (quiz.key === "defi") S.defiDay = localDay(new Date()); S.sessionsCompleted=(S.sessionsCompleted||0)+1; (S.hist = S.hist || []).push(r(globalScore()));
    evaluateBadges(before,sessionThemeScores,quiz.ok===n);
    var d = new Date(), today = localDay(d), yday = localDay(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1));
    if (S.last !== today) { S.streak = S.last === yday ? (S.streak || 0) + 1 : 1; S.last = today; }
    save();
    var canAgain = !(quiz.key === "errors" && !missedCount());
    var missed = quiz.log.filter(function (e) { return !e.ok; });
    var h = '<div class="qtop"><button class="linkbtn" type="button" id="back">‹ Retour aux thèmes</button><p class="eyebrow">' + esc(quiz.title) + "</p></div>" +
      '<div class="res"><div class="big">' + quiz.ok + "<small>/" + n + "</small></div><p class=\"cap\" style=\"margin:0\">" + (noPts ? "Défi déjà joué aujourd’hui : pas de nouveaux points" : pts + " points gagnés") + "</p></div>" +
      '<div class="sect"><div class="sect-head"><h3>Effet sur vos thèmes</h3></div>' +
      Object.keys(touched).map(function (id) {
        var a = before[id], b = pct(id);
        return '<div class="row" style="cursor:default"><div class="name">' + esc(BYID[id].name) + '</div><div class="pct"><b class="delta">' + (a === null ? "" : r(a) + " → ") + r(b) + "<small> %</small></b></div></div>";
      }).join("") + "</div>" +
      '<div class="sect"><div class="sect-head"><h3>À retenir</h3></div>' +
      (missed.length ? '<ul class="keep">' + missed.map(function (e) { return "<li><strong>" + esc(e.q.q) + "</strong><br>" + esc(e.q.why) + (e.q.note ? '<br><span class="src">' + esc(e.q.note) + "</span>" : "") + '<br><span class="src">' + esc(e.q.src) + "</span></li>"; }).join("") + "</ul>" : '<p class="note" style="font-size:16px;color:var(--ink)">Aucune erreur. Les ' + n + " points sont acquis.</p>") + "</div>" +
      '<div class="actions">' + (canAgain ? '<button class="btn" type="button" id="again">Rejouer</button>' : '') + '<button class="btn ghost" type="button" id="back2">Retour aux thèmes</button></div>';
    var key = quiz.key; quiz = null;
    $("v-quiz").innerHTML = h;
    $("back").addEventListener("click", function () { show("play"); });
    $("back2").addEventListener("click", function () { show("play"); });
    if ($("again")) $("again").addEventListener("click", function () { startQuiz(key); });
    else toast("Plus aucune erreur à revoir. Bravo !");
    window.scrollTo(0, 0);
  }

  /* ---------- Bienvenue ---------- */
  function genCode() { var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i = 0; i < 6; i++) { s += a.charAt(Math.floor(Math.random() * a.length)); if (i === 2) s += "-"; } return s; }
  function renderWelcome() {
    animLock();
    var P = profiles(), ks = Object.keys(P);
    var seen = {}, dups = 0;
    ks.forEach(function (k) { var n = (P[k].pseudo || "").toLowerCase(); if (seen[n]) dups++; seen[n] = 1; });
    var plist = ks.length ? '<div class="wform"><h3>Reprendre un profil</h3>' + ks.map(function (k) {
      return '<div style="display:flex;gap:8px;align-items:stretch"><div style="flex:1;min-width:0"><button class="row" type="button" data-resume="' + esc(k) + '"><div><div class="name">' + esc(P[k].pseudo) + '</div><div class="meta"><span class="refs">' + esc(P[k].service || "") + '</span></div></div><div class="pct"><b>' + (P[k].points || 0) + '</b><em>points</em></div></button></div><button class="btn ghost" type="button" data-del="' + esc(k) + '" aria-label="Supprimer le profil ' + esc(P[k].pseudo) + '" style="flex:none;padding:0 14px">Supprimer</button></div>';
    }).join("") + (dups ? '<button class="btn ghost" type="button" id="wdup" style="margin-top:10px">Supprimer les doublons (' + dups + ')</button>' : "") + '<h3 style="margin-top:28px">Nouveau profil</h3></div>' : "";
    var sv = ["UGA", "UGO", "Médecine", "SMR", "Autre service"].map(function (x) { return "<option>" + x + "</option>"; }).join("");
    $("v-welcome").innerHTML = '<p class="eyebrow">Visite de certification · préparation</p><h1>Objectif<br>CertiF</h1>' +
      '<p class="lede">Des quiz de trois minutes, un thème à la fois, pour arriver prêt le jour de la visite. Créez votre profil pour suivre votre progression.</p>' +
      backupPanelHtml() + plist + '<form id="wf" class="wform"><div class="field"><label for="wp">Choisissez un pseudo</label><input id="wp" maxlength="20" autocomplete="off" required placeholder="Ex. : Cyclope42"></div>' +
      '<div class="field"><label for="ws">Votre service</label><select id="ws">' + sv + '</select></div>' +
      '<p class="note">Ni nom ni matricule. Ne saisissez aucune donnée de patient. Votre profil reste enregistré sur cet appareil. Si ce pseudo existe déjà ici, vous retrouvez votre progression.</p>' +
      '<div class="actions"><button class="btn" type="submit">Commencer</button></div></form>';
    bindBackupControls($("v-welcome"));

    $("wf").addEventListener("submit", function (e) {
      e.preventDefault();
      var p = $("wp").value.trim(); if (!p) return;
      var P = profiles(), want = p.toLowerCase(), best = null;
      Object.keys(P).forEach(function (k) { if ((P[k].pseudo || "").toLowerCase() === want && (!best || (P[k].points || 0) > (best.points || 0))) best = P[k]; });
      if (best) { S = normalizeProfile(clone(best)); save(); show("play"); toast("Profil retrouvé : " + S.pseudo); return; }
      S = clone(FRESH); S.pseudo = p; S.service = $("ws").value; S.code = genCode(); S.onboarded = true; save(); show("play"); if (!guideSeen()) openGuide();
    });
    Array.prototype.forEach.call($("v-welcome").querySelectorAll("[data-resume]"), function (b) {
      b.addEventListener("click", function () { var p = profiles()[b.getAttribute("data-resume")]; if (p) { S = normalizeProfile(clone(p)); save(); show("play"); } });
    });
    function putProfiles(P) { try { localStorage.setItem(KEY + "-profils", JSON.stringify(P)); } catch (e) {} }
    Array.prototype.forEach.call($("v-welcome").querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        if (!b.getAttribute("data-sure")) { b.setAttribute("data-sure", "1"); b.textContent = "Confirmer ?"; setTimeout(function () { b.removeAttribute("data-sure"); b.textContent = "Supprimer"; }, 4000); return; }
        var P2 = profiles(); delete P2[b.getAttribute("data-del")]; putProfiles(P2); renderWelcome(); toast("Profil supprimé");
      });
    });
    var wd = $("wdup");
    if (wd) wd.addEventListener("click", function () {
      if (!wd.getAttribute("data-sure")) { wd.setAttribute("data-sure", "1"); wd.textContent = "Confirmer : garder le meilleur score de chaque pseudo"; return; }
      var P2 = profiles(), best = {};
      Object.keys(P2).forEach(function (k) { var n = (P2[k].pseudo || "").toLowerCase(); if (!best[n] || (P2[k].points || 0) > (P2[best[n]].points || 0)) best[n] = k; });
      var keep = {}; Object.keys(best).forEach(function (n) { keep[best[n]] = P2[best[n]]; });
      putProfiles(keep); renderWelcome(); toast("Doublons supprimés");
    });
  }

  /* ---------- Navigation ---------- */
  function show(name) {
    tab = name;
    ["play", "lib", "me", "team", "badges", "defis", "tower", "biblio", "party", "quiz", "welcome"].forEach(function (v) { $("v-" + v).hidden = v !== name; });
    $("tabs").hidden = name === "quiz" || name === "welcome";
    $("sidebar").classList.toggle("is-hidden", name === "quiz" || name === "welcome");
    $("sidebar").style.display = "";
    $("shell").style.gridTemplateColumns = (name === "quiz" || name === "welcome") ? "1fr" : "280px minmax(0,1fr)";
    if (name === "welcome") renderWelcome();
    if (name === "play") renderPlay();
    if (name === "lib") renderLib();
    if (name === "me") renderMe();
    if (name === "team") renderTeam();
    if (name === "badges") renderBadges();
    if (name === "defis") renderDefis();
    if (name === "tower") renderTower();
    if (name === "biblio") renderBiblio();
    if (name === "party") renderParty();
    refreshErrorsBadge();
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      var hub = (name === "tower" || name === "biblio") ? "defis" : name;
      if (b.getAttribute("data-tab") === hub && !b.hasAttribute("data-action")) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (name !== "quiz") window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab],[data-theme-id],[data-switch],[data-quiz],[data-action],[data-tower-answer],[data-tower-quit],[data-bib-opt],[data-bib-slot],[data-bib-validate],[data-bib-next],[data-bib-quit],#go-defi") : null;
    if (!t) return;
    if (t.hasAttribute("data-tower-answer")) { answerTower(Number(t.getAttribute("data-tower-answer"))); return; }
    if (t.hasAttribute("data-tower-quit")) { if (window.confirm("Quitter cette ascension ? Les récompenses déjà obtenues et votre record seront conservés.")) { towerRun=null; show("tower"); } return; }
    if (t.hasAttribute("data-bib-opt")) { bibPick(Number(t.getAttribute("data-bib-opt"))); return; }
    if (t.hasAttribute("data-bib-slot")) { var bq = libRun && libRun.qs[libRun.i]; if (bq && !bq.done) { bq.cur = Number(t.getAttribute("data-bib-slot")); renderBibQuestion(); } return; }
    if (t.hasAttribute("data-bib-validate")) { bibValidate(); return; }
    if (t.hasAttribute("data-bib-next")) { bibNext(); return; }
    if (t.hasAttribute("data-bib-quit")) { if (window.confirm("Quitter cette séance ? Les manuscrits déjà restaurés sont conservés.")) { libRun = null; show("biblio"); } return; }
    if (t.getAttribute("data-action") === "bib-start") { startBiblio(); return; }
    if (t.getAttribute("data-action") === "tower-start") { startTower(); return; }
    if (t.hasAttribute("data-switch")) { switchProfile(); return; }
    if (t.getAttribute("data-action") === "challenge") { startQuiz("defi"); return; }
    if (t.getAttribute("data-action") === "errors") { startQuiz("errors"); return; }
    if (t.getAttribute("data-action") === "tower") { show("tower"); return; }
    if (t.getAttribute("data-action") === "badges") { show("badges"); return; }
    if (t.hasAttribute("data-quiz")) { startQuiz(t.getAttribute("data-quiz")); return; }
    if (t.hasAttribute("data-tab")) { show(t.getAttribute("data-tab")); return; }
    if (t.id === "go-defi") { startQuiz("defi"); return; }
    var id = t.getAttribute("data-theme-id"), ks = setsOf(id);
    if (ks.length) startQuiz("t:" + id);
    else toast("Quiz à venir pour ce thème.");
  });

  var themeBtn = $("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", function(){document.body.classList.toggle("light-ui");themeBtn.querySelector("span").textContent=document.body.classList.contains("light-ui")?"Passer en mode sombre":"Passer en mode clair";});
  var start = { jouer: "play", quiz: "lib", score: "me", equipe: "team" }[(location.hash || "").replace("#", "")] || "play";
  var partyCfg = partyFromHash();
  if (partyCfg) openParty(partyCfg); else show(S.onboarded ? start : "welcome");
})();
